<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   1) 자잘한 도구들
   ═══════════════════════════════════════════════════════════════════ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const now = ()=> Date.now();
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const R = window.RULES;

function toast(msg, ms){
  const d = document.createElement('div');
  d.className='tt'; d.textContent = msg; el('toast').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0';
    setTimeout(()=>d.remove(),320); }, ms||1800);
}
function modal(title, html, onOpen){
  el('mTitle').textContent = title; el('mBody').innerHTML = html;
  el('modal').classList.add('on'); if(onOpen) onOpen();

/* 답을 견주는 규칙 — 초등학생이 띄어쓰기 하나 틀렸다고 오답이 되면 안 된다.
   공백/문장부호를 지우고, 영문 대소문자를 맞추고, 전각 숫자를 반각으로 바꾼다. */
function norm(s){
  return String(s==null?'':s)
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s​]/g,'')
    .replace(/[.,!?~"'`·…“”‘’(){}\[\]<>]/g,'')
    .toLowerCase();
}
/* 답이 여러 개 허용될 때는 / 로 나눠 적는다: "태평양/태평양바다" */
function isRight(user, ans){
  const u = norm(user); if(!u) return false;
  return String(ans).split('/').some(a=> norm(a)===u );
}

/* 4자리 비번을 그대로 저장하지 않으려고 쓰는 아주 간단한 섞기.
   ※ 진짜 암호학적 보호가 아니다. 교실에서 옆자리 애가 값만 보고
     바로 알아채지 못하게 하는 정도다. 자세한 건 사용법 문서를 봐라. */
function pinHash(id, pin){
  let h = 2166136261 >>> 0; const s = 'qz1|'+id+'|'+pin;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let g = h; for(let i=0;i<3;i++){ g ^= g<<13; g>>>=0; g ^= g>>17; g ^= g<<5; g>>>=0; }
  return (h.toString(36)+'-'+g.toString(36));
}
/* 파이어베이스 키에 못 쓰는 글자( . $ # [ ] / )를 피해 아이디를 키로 만든다 */
function idKey(name){
  return String(name).trim().replace(/[.$#\[\]\/\s]/g,'_').slice(0,24);
}

function sh(hex, a){            // a: 양수면 밝게, 음수면 어둡게
  const n = parseInt(hex.slice(1),16);
  let r = n>>16&255, g = n>>8&255, b = n&255;
  if(a>=0){ r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; }
  else    { r*=1+a; g*=1+a; b*=1+a; }
  const h2 = v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');
  return '#'+h2(r)+h2(g)+h2(b);
}

/* ── 카탈로그 만들기 ──────────────────────────────────────────
   모양 함수 × 색 팔레트 = 아이템. 그림 파일은 한 장도 안 쓴다. */
const CATS = [
  {k:'hair',   n:'머리',   src:HAIR,    pal:'hair',  crop:'18 4 164 168',  off:false},
  {k:'top',    n:'상의',   src:TOPS,    pal:'basic', crop:'30 126 140 134',off:false},

  {k:'glass',  n:'안경',   src:GLASSES, pal:'basic', crop:'28 74 144 62',  off:true},
  {k:'ear',    n:'귀걸이', src:EARR,    pal:'metal', crop:'16 88 168 64',  off:true},
  {k:'neck',   n:'목걸이', src:NECK,    pal:'metal', crop:'56 136 88 72',  off:true},
  {k:'back',   n:'등장식', src:BACKS,   pal:'basic', crop:'0 96 200 184',  off:true},
  {k:'pet',    n:'펫',     src:PETS,    pal:'basic', crop:'136 208 76 78', off:true}
];
const CAT = {}; CATS.forEach(c=>CAT[c.k]=c);

/* 처음 가입하면 공짜로 갖고 시작하는 아이템 */
const STARTER = ['hair:short:0','hair:short:1','hair:bob:1','hair:bob:5',
  'top:tee:5','top:tee:7','top:tee:3','bottom:shorts:5','bottom:jeans:5',
  'bottom:skirt:7','shoes:sneaker:9','shoes:sneaker:8'];
const STARTER_SET = new Set(STARTER);

const ITEMS = {};      // id -> {id,cat,shape,ci,name,price,color}
(function buildCatalog(){
  for(const c of CATS){
    const pal = PAL[c.pal];
    for(const sk in c.src){
      const [sname, sprice] = c.src[sk];
      for(let i=0;i<pal.length;i++){
        const id = c.k+':'+sk+':'+i;
        ITEMS[id] = { id, cat:c.k, shape:sk, ci:i, color:pal[i][0],
          name: sname + ' ('+pal[i][1]+')', short: sname,
          price: STARTER_SET.has(id) ? 0 : sprice };
      }
    }
  }
})();
const ITEM_COUNT = Object.keys(ITEMS).length;

/* 한 파츠를 그린다. val 은 "모양:색번호". 없으면 빈 문자열 */
function part(catKey, val, want){
  if(!val) return '';
  const c = CAT[catKey]; if(!c) return '';
  const [sk, ciS] = String(val).split(':');
  const entry = c.src[sk]; if(!entry) return '';
  const pal = PAL[c.pal];
  const col = (pal[+ciS] || pal[0])[0];
  const out = entry[2](col, sh(col,-.22), sh(col,.34));
  if(typeof out === 'string') return out;
  return out[want] || '';           // 머리처럼 {b,f} 를 돌려주는 것
}

/* 그림에 선을 두른다.
   paint-order="stroke" 는 선을 칠 밑에 깔아서, 도형이 안 깎이고 테두리만 생긴다.
   이 한 줄로 아이템 992종 전부에 선이 들어간다 — 함수를 하나씩 고칠 필요가 없다. */
const INK = '#4a3427';
function ink(str, w){
  return str ? `<g stroke="${INK}" stroke-width="${w||3}" stroke-linejoin="round"`
    + ` stroke-linecap="round" paint-order="stroke fill markers">${str}</g>` : '';
}
/* 머리를 통째로 조금 줄인다. 머리·머리카락·모자·안경이 같이 줄어야 비율이 안 깨진다 */
const HEADT = ' transform="translate(100 96) scale(.93) translate(-100 -96)"';
/* 앞머리는 조금 내려 덮는다. 이마가 훤하면 사람 얼굴로 안 보인다 */
const BANGT = ' transform="translate(100 96) scale(.93) translate(-100 -96) translate(0 11) scale(1.04 1) translate(-4 0)"';
/* 몸은 조금 홀쭉하고 길게. 옷·신발이 같은 상자 안에 있어서 같이 늘어난다 */
const BODYT = ' transform="translate(100 214) scale(.91 1.07) translate(-100 -214)"';


/* ── 아바타 한 장 그리기 ──────────────────────────────────────
   lod 2 = 크게(홈·상점), lod 1 = 작게(명단·OX). 작을 땐 등장식을 뺀다. */
const avCache = new Map();
function avKey(a){
  return [a.sk,a.ec,a.eyes,a.hair,a.top,a.bottom,a.shoes,a.hat,a.glass,a.ear,a.neck,a.back,a.pet].join('|');
}
function avatarSVG(av, size, lod){
  av = av || newAvatar(); lod = lod==null?2:lod;
  const key = avKey(av)+'#'+size+'#'+lod;
  const hit = avCache.get(key); if(hit) return hit;
  const sk = (PAL.skin[av.sk] || PAL.skin[0])[0];
  let s = '';
  if(lod >= 2) s += ink(part('back', av.back), 2.8);
  s += `<g${HEADT}>` + ink(part('hair', av.hair, 'b'), 3.2) + `</g>`;
  s += `<g${BODYT}>` + ink(drawBody(sk), 3)
     + ink(part('bottom', av.bottom), 2.8)
     + ink(part('shoes', av.shoes), 2.8)
     + ink(part('top', av.top), 2.8)
     + ink(part('neck', av.neck), 2.2) + `</g>`;
  s += `<g${HEADT}>`
     + ink(drawHead(sk), 3)
     + drawFace(av)                       /* 얼굴은 선이 이미 들어 있어서 안 두른다 */
     + ink(part('glass', av.glass), 2.2)
     + `</g><g${BANGT}>` + ink(part('hair', av.hair, 'f'), 3.2)
     + `</g><g${HEADT}>`
     + ink(part('ear', av.ear), 2.2)
     + ink(part('hat', av.hat), 2.8)
     + `</g>`;
  if(lod >= 2) s += ink(part('pet', av.pet), 2.8);
  const svg = `<svg viewBox="0 0 ${AVW} ${AVH}" width="${size*AVW/AVH}" height="${size}" `
    + `shape-rendering="geometricPrecision" style="display:block">${s}</svg>`;
  if(avCache.size > 260) avCache.clear();
  avCache.set(key, svg);
  return svg;
}
/* 상점 미리보기 — 그 파츠가 잘 보이도록 잘라서 보여 준다 */
function partThumb(catKey, shape, ci, h){
  const c = CAT[catKey];
  const base = { sk:1, ec:0, eyes:'round', hair:'', top:'', bottom:'', shoes:'',
                 hat:'', glass:'', ear:'', neck:'', back:'', pet:'' };
  base[catKey] = shape+':'+ci;
  if(catKey==='pet'){                       // 펫은 사람 없이 펫만 보여 준다
    const [px,py,pw,ph2] = c.crop.split(' ').map(Number);
    return `<svg viewBox="${c.crop}" height="${h}" width="${(h*pw/ph2)|0}" style="display:block">`
      + ink(part('pet', base.pet), 2.8) + `</svg>`;
  }
  if(catKey==='top')    base.bottom = 'shorts:9';
  if(catKey==='bottom') base.top    = 'tee:8';
  if(catKey==='hair'||catKey==='hat'||catKey==='glass'||catKey==='ear') base.hair = (catKey==='hair'?shape+':'+ci:'short:0');
  const sks = (PAL.skin[base.sk])[0];
  let s = '';
  if(catKey==='back') s += ink(part('back', base.back), 2.8);
  s += `<g${HEADT}>` + ink(part('hair', base.hair, 'b'), 3.2) + `</g>`;
  s += `<g${BODYT}>` + ink(drawBody(sks), 3)
     + ink(part('bottom', base.bottom), 2.8) + ink(part('shoes', base.shoes), 2.8)
     + ink(part('top', base.top), 2.8) + ink(part('neck', base.neck), 2.2) + `</g>`;
  s += `<g${HEADT}>` + ink(drawHead(sks), 3) + drawFace(base)
     + ink(part('glass', base.glass), 2.2) + `</g>`
     + `<g${BANGT}>` + ink(part('hair', base.hair, 'f'), 3.2) + `</g>`
     + `<g${HEADT}>` + ink(part('ear', base.ear), 2.2) + ink(part('hat', base.hat), 2.8) + `</g>`;
  const [cx,cy,cw,ch] = c.crop.split(' ').map(Number);
  return `<svg viewBox="${c.crop}" height="${h}" width="${(h*cw/ch)|0}" style="display:block">${s}</svg>`;
}

function newAvatar(){
  const pick = a => a[(Math.random()*a.length)|0];
  const eyeKeys = Object.keys(EYES);
  return {
    sk: (Math.random()*PAL.skin.length)|0,
    ec: (Math.random()*PAL.eye.length)|0,
    eyes: pick(eyeKeys),
    hair:   pick(['short:0','short:1','bob:1','bob:5']),
    top:    pick(['tee:5','tee:7','tee:3']),
    bottom: pick(['shorts:5','jeans:5','skirt:7']),
    shoes:  pick(['sneaker:9','sneaker:8']),
    hat:'', glass:'', ear:'', neck:'', back:'', pet:''
  };
}

const DBR = 'quiz';
const FB = { db:null, ok:false, why:'' };
function initFB(){
  if(FB.ok) return true;
  if(typeof firebase === 'undefined'){ FB.why='인터넷이 안 되나 봐요'; return false; }
  const cfg = window.FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL){ FB.why='파이어베이스 설정이 비어 있어요'; return false; }
  try{
    if(!firebase.apps.length) firebase.initializeApp(cfg);
    FB.db = firebase.database(); FB.ok = true; return true;
  }catch(e){ FB.why = e.message; return false; }
}
const uref  = k => FB.db.ref(DBR+'/users/'+k);
const bref  = ()  => FB.db.ref(DBR+'/bank');

let IS_TEACHER = false;
const LS = { get(k,d){ try{ const v=localStorage.getItem('qz_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem('qz_'+k, JSON.stringify(v)); }catch(e){} },
             del(k){ try{ localStorage.removeItem('qz_'+k); }catch(e){} } };

let saveTimer = null, savePend = {};
function save(patch, now2){
  if(!ME) return;
  Object.assign(ME, patch); Object.assign(savePend, patch);
  paintGold();
  if(!FB.ok) return;
  clearTimeout(saveTimer);
  const flush = ()=>{ const p = savePend; savePend = {};
    if(Object.keys(p).length) uref(ME.k).update(p).catch(e=>toast('저장 실패: '+e.message,3000)); };
  if(now2) flush(); else saveTimer = setTimeout(flush, 500);
}
function owns(id){ return !!(ME && ME.owned && ME.owned[id]) || STARTER_SET.has(id); }
function paintGold(){ const g = el('goldNum'); if(g && ME) g.textContent = (ME.gold||0).toLocaleString(); }

/* 골드 더하기 — 연습 모드는 하루 상한을 지킨다 */
function addGold(n, fromPractice){
  if(!ME || n<=0) return 0;
  let give = n;
  if(fromPractice){
    const d = ME.day && ME.day.d===today() ? ME.day : {d:today(), g:0};
    give = Math.max(0, Math.min(n, R.practiceCap - d.g));
    d.g += give; ME.day = d; save({day:d});
  }
  if(give>0) save({gold:(ME.gold||0)+give});
  return give;
}

SCREENS.login = function(st){
  let pin = '', mode = 'in';       // in = 들어가기, up = 처음 가입
  let pin2 = '', step = 1;
  st.innerHTML = `<div id="login" class="on"><div>

      </div>

      <div class="row gap4 mt8">
        <button class="btn sm gray f1" id="lgNew">처음이에요 (가입)</button>
        <button class="btn sm gray" id="lgT">선생님</button>
      </div>
      <div class="hint mt8" id="lgMsg" style="min-height:30px"></div>
    </div></div></div>`;

  const dots = ()=> $$('#lgDots i').forEach((d,i)=> d.classList.toggle('f', i < pin.length));
  const msg  = t => el('lgMsg').innerHTML = t;
  const pad  = el('lgPad');
  ['1','2','3','4','5','6','7','8','9','지우기','0','◀'].forEach(k=>{
    const b = document.createElement('button'); b.textContent = k;
    if(k==='지우기'||k==='◀') b.style.fontSize='14px';
    b.onclick = ()=>{
      if(k==='지우기') pin='';
      else if(k==='◀') pin = pin.slice(0,-1);
      else if(pin.length<4) pin += k;
      dots();
    };
    pad.appendChild(b);
  });
  document.onkeydown = e=>{
    if(curScr!=='login') return;
    if(/^[0-9]$/.test(e.key)){ if(pin.length<4) pin+=e.key; dots(); }
    else if(e.key==='Backspace' && document.activeElement.id!=='lgId'){ pin=pin.slice(0,-1); dots(); }
    else if(e.key==='Enter') el('lgGo').click();
  };

  function setMode(m){
    mode = m; step = 1; pin=''; pin2=''; dots();
    el('lgGo').textContent  = m==='up' ? '이 비밀번호로 만들기' : '들어가기';
    el('lgNew').textContent = m==='up' ? '이미 있어요 (돌아가기)' : '처음이에요 (가입)';
    el('lgLab').textContent = m==='up' ? '쓸 비밀번호 — 숫자 4개' : '비밀번호 — 숫자 4개';
    msg(m==='up' ? '아이디는 한글도 돼요. 비밀번호는 <b>꼭 기억할 수 있는 숫자 4개</b>로 정하세요.' : '');
  }
  el('lgNew').onclick = ()=> setMode(mode==='up'?'in':'up');

  el('lgT').onclick = ()=>{
    const pw = prompt('선생님 암호');
    if(pw == null) return;
    if(String(pw) !== String(window.TEACHER_CODE)){ msg('<b style="color:#c0392b">암호가 달라요.</b>'); return; }
    if(!initFB()){ msg('<b style="color:#c0392b">파이어베이스 연결이 안 돼요 — '+esc(FB.why)+'</b>'); return; }
    IS_TEACHER = true;
    ME = { k:'__teacher', name:'선생님', gold:0, av:newAvatar(), owned:{}, stat:{}, day:{} };

  el('lgGo').onclick = ()=>{
    const raw = (el('lgId').value||'').trim();
    if(raw.length < 1){ msg('<b style="color:#c0392b">아이디를 적어 주세요.</b>'); el('lgId').focus(); return; }

      const u = sn.val();
      if(mode==='up'){
        if(u){ msg('<b style="color:#c0392b">그 아이디는 이미 있어요. 다른 이름으로 해 보세요.</b>'); return; }
        if(step===1){ pin2 = pin; pin=''; step=2; dots();

          msg('안 잊어버리게 <b>한 번 더</b> 눌러 주세요.'); return; }
        if(pinHash(k,pin) !== pinHash(k,pin2)){ pin=''; pin2=''; step=1; dots();

          msg('<b style="color:#c0392b">두 번이 서로 달라요. 처음부터 다시.</b>'); return; }

    }).catch(()=>{ msg(''); });
  }
};

/* ═══════════════════════════════════════════════════════════════════
   9) 문제 은행
   문제 한 개 = {q:문제, a:답, c:[오답 보기들]}
   c 가 없으면 답을 직접 쓰는 주관식. a 가 O/X 면 OX 문제.
   ═══════════════════════════════════════════════════════════════════ */
let BANK = {};                       // setId -> {title, qs:[...]}
function loadBank(){
  return new Promise((res,rej)=>{
    if(!FB.ok) return rej(new Error('연결 안 됨'));
    bref().once('value').then(sn=>{ BANK = sn.val()||{}; res(BANK); }).catch(rej);
  });
}
function setList(){
  return Object.keys(BANK).map(id=>({id, title:BANK[id].title||'이름 없음',
    n:(BANK[id].qs||[]).length, made:BANK[id].made||0}))
    .sort((a,b)=> b.made - a.made);
}
/* 붙여넣은 여러 줄을 문제로 바꾼다.
   탭이 있으면 탭으로, 없으면 쉼표로 나눈다.
   첫 칸 = 문제, 둘째 칸 = 답, 나머지 = 오답 보기 */
function parsePaste(text){
  const out = [], bad = [];
  String(text).split(/\r?\n/).forEach((line,i)=>{
    const t = line.trim(); if(!t) return;
    if(/^(문제|질문)\s*[\t,]/.test(t) && i===0) return;         // 표 머리글은 건너뛴다
    const f = (t.indexOf('\t')>=0 ? t.split('\t') : t.split(',')).map(x=>x.trim()).filter((x,j)=> j<2 || x!=='');
    if(f.length < 2 || !f[0] || !f[1]){ bad.push(t); return; }
    const q = { q:f[0], a:f[1] };
    const ch = f.slice(2).filter(Boolean);
    if(ch.length) q.c = ch.slice(0,5);
    out.push(q);
  });
  return {ok:out, bad};
}
/* 객관식 보기 만들기 — 정답 + 오답들을 섞는다 */
function makeChoices(item, seed){
  if(!item.c || !item.c.length) return null;
  const arr = [item.a].concat(item.c);
  let s = seed==null? Math.random()*99991 : seed;
  const rnd = ()=>{ s = (s*9301 + 49297) % 233280; return s/233280; };
  for(let i=arr.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
const isOX = it => /^(o|x|O|X|ㅇ|ㅁ|맞|틀)/.test(String(it.a).trim()) && String(it.a).trim().length<=2;

   11) 문제 한 개를 화면에 그리는 공용 부품

function answerUI(item, seed){
  if(isOX(item)){
    return `<div class="choices" style="grid-template-columns:1fr 1fr;gap:18px">
      <button class="ch" data-v="O" style="justify-content:center;font-size:52px;padding:18px;
        background:linear-gradient(#fff6da,#ffe1a0);border-color:#d8a63a;box-shadow:0 5px 0 #a97c1e;color:#a35f00">O</button>
      <button class="ch" data-v="X" style="justify-content:center;font-size:52px;padding:18px;
        background:linear-gradient(#e6f4ff,#c2e0f8);border-color:#3d94e4;box-shadow:0 5px 0 #1f5f9e;color:#12467e">X</button></div>`;
  }
  const ch = makeChoices(item, seed);
  if(ch){
    const num = ['①','②','③','④','⑤','⑥'];
    return `<div class="choices">` + ch.map((c,i)=>
      `<button class="ch" data-v="${esc(c)}"><span class="n">${num[i]}</span><span>${esc(c)}</span></button>`).join('') + `</div>`;
  }
  return `<div class="row gap mt12">
    <input class="inp f1" id="ansIn" placeholder="답을 여기에 쓰세요" autocomplete="off"
      style="font-size:22px;padding:14px;font-weight:800;text-align:center">
    <button class="btn y big" id="ansOk">확인</button></div>`;
}
function wireAnswer(root, cb){
  $$('.ch', root).forEach(b=> b.onclick = ()=> cb(b.dataset.v, b));
  const inp = $('#ansIn', root), ok = $('#ansOk', root);
  if(inp){ inp.focus();
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); cb(inp.value, null); } };
    ok.onclick = ()=> cb(inp.value, null);
  }
}
function markAnswer(root, item, picked){
  const right = String(item.a).split('/')[0].trim();
  $$('.ch', root).forEach(b=>{
    const v = b.dataset.v;
    b.disabled = true;
    if(isRight(v, item.a)) b.classList.add('ok');
    else if(v===picked)    b.classList.add('no');
  });
  const inp = $('#ansIn', root); if(inp){ inp.disabled = true; const ok=$('#ansOk',root); if(ok) ok.disabled=true; }
  return right;
}

/* ═══════════════════════════════════════════════════════════════════
   13) 수업 모드 — 방 규칙
   ★ 정답은 '공개' 하기 전까지 절대 방에 안 올린다.
     채점은 선생님 화면이 한다. 학생 화면은 자기 점수를 스스로 못 올린다.
   ═══════════════════════════════════════════════════════════════════ */
let SVOFF = 0, clockOn = false;
function ensureClock(){
  if(clockOn || !FB.ok) return;
  clockOn = true;
  FB.db.ref('.info/serverTimeOffset').on('value', s=>{ SVOFF = s.val()||0; });
}
const svNow = ()=> Date.now() + SVOFF;

/* 같은 씨앗(seed)이면 언제 다시 돌려도 같은 순서가 나온다.
   선생님 화면을 새로고침해도 문제 순서가 안 흐트러진다. */
function seedRnd(seed){ let s = seed>>>0 || 1;
  return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function pickQs(setId, seed, count, onlyOX){
  let all = (BANK[setId] && BANK[setId].qs || []).slice();
  if(onlyOX) all = all.filter(isOX);
  const rnd = seedRnd(seed);
  for(let i=all.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=all[i]; all[i]=all[j]; all[j]=t; }
  return all.slice(0, Math.min(count||all.length, all.length));
}

/* ── 가로세로 격자 짜기 ────────────────────────────────────────
   한 칸에 한 글자. 이미 놓인 글자와 겹치게 이어 붙인다. */
function buildCross(items, seed, maxWords){
  const seen = new Set(), pool = [];
  for(const it of items){
    const a = String(it.a).split('/')[0].replace(/\s/g,'');
    if(a.length<2 || a.length>7) continue;
    if(seen.has(a)) continue; seen.add(a);
    pool.push({a, clue: it.q});
  }
  const rnd = seedRnd(seed);
  for(let i=pool.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
  pool.sort((x,y)=> y.a.length - x.a.length);
  const use = pool.slice(0, maxWords||14);
  if(!use.length) return null;

  const G = new Map(); const at = (r,c)=> G.get(r+','+c);
  const placed = [];
  const put = (w,r,c,dir)=>{ for(let i=0;i<w.length;i++) G.set((dir?r+i:r)+','+(dir?c:c+i), w[i]); };
  const fits = (w,r,c,dir)=>{
    if(dir){ if(at(r-1,c)!=null || at(r+w.length,c)!=null) return -1; }
    else   { if(at(r,c-1)!=null || at(r,c+w.length)!=null) return -1; }
    let cross = 0;
    for(let i=0;i<w.length;i++){
      const rr = dir? r+i : r, cc = dir? c : c+i, cur = at(rr,cc);
      if(cur!=null){ if(cur!==w[i]) return -1; cross++; }
      else if(dir ? (at(rr,cc-1)!=null || at(rr,cc+1)!=null)
                  : (at(rr-1,cc)!=null || at(rr+1,cc)!=null)) return -1;
    }
    return cross;
  };
  const box = ()=>{ let a=1e9,b=-1e9,c2=1e9,d=-1e9;
    G.forEach((v,key)=>{ const [r,c]=key.split(',').map(Number);
      a=Math.min(a,r); b=Math.max(b,r); c2=Math.min(c2,c); d=Math.max(d,c); });
    return {minR:a, maxR:b, minC:c2, maxC:d}; };
  const areaIf = (r,c,dir,len)=>{ const b = box();
    const r2 = r+(dir?len:1)-1, c2 = c+(dir?1:len)-1;
    const H = Math.max(b.maxR,r2)-Math.min(b.minR,r)+1, W = Math.max(b.maxC,c2)-Math.min(b.minC,c)+1;
    return H*W + Math.abs(H-W)*3;                 // 너무 길쭉해지지 않게 살짝 벌점
  };

  put(use[0].a, 0, 0, 0); placed.push({a:use[0].a, r:0, c:0, dir:0, clue:use[0].clue});
  const left = use.slice(1);
  /* 두 번 돌린다 — 처음에 자리가 없던 단어도 뒤에 놓인 단어와 겹칠 수 있다 */
  for(let pass=0; pass<2 && left.length; pass++){
    for(let k=left.length-1; k>=0; k--){
      const w = left[k].a; let best = null;
      /* ① 이미 놓인 글자와 겹치는 자리를 먼저 찾는다 */
      for(const p of placed){
        for(let i=0;i<p.a.length;i++) for(let j=0;j<w.length;j++){
          if(p.a[i] !== w[j]) continue;
          const dir = p.dir ? 0 : 1;
          const r = p.dir ? p.r+i : p.r - j;
          const c = p.dir ? p.c - j : p.c + i;
          const sc = fits(w, r, c, dir);
          if(sc < 1) continue;
          const score = sc*10000 - areaIf(r,c,dir,w.length);
          if(!best || score > best.score) best = {r, c, dir, score};
        }
      }
      /* ② 한글은 음절이 통째로 겹쳐야 해서 겹칠 데가 없는 일이 흔하다.
            그럴 땐 옆 빈자리에 따로 놓는다. 다음 판에서 다른 단어가 여기에 걸릴 수도 있다. */
      if(!best && pass===1){
        const b = box();
        for(let r=b.minR-1; r<=b.maxR+2; r++) for(let c=b.minC-1; c<=b.maxC+2; c++)
          for(const dir of [0,1]){
            if(fits(w,r,c,dir) !== 0) continue;
            const score = -areaIf(r,c,dir,w.length);
            if(!best || score > best.score) best = {r, c, dir, score};
          }
      }
      if(best){ put(w, best.r, best.c, best.dir);
        placed.push({a:w, r:best.r, c:best.c, dir:best.dir, clue:left[k].clue});
        left.splice(k,1); }
    }
  }
  if(placed.length < 2) return null;

  let minR=1e9,minC=1e9,maxR=-1e9,maxC=-1e9;
  G.forEach((v,key)=>{ const [r,c]=key.split(',').map(Number);
    minR=Math.min(minR,r); maxR=Math.max(maxR,r); minC=Math.min(minC,c); maxC=Math.max(maxC,c); });
  const rows = maxR-minR+1, cols = maxC-minC+1;
  const open = []; for(let r=0;r<rows;r++){ let s=''; for(let c=0;c<cols;c++) s += at(r+minR,c+minC)!=null?'1':'0'; open.push(s); }
  placed.forEach(p=>{ p.r -= minR; p.c -= minC; });
  placed.sort((a,b)=> (a.r-b.r) || (a.c-b.c) || (a.dir-b.dir));
  const numAt = {}; let n = 0;
  const w = placed.map(p=>{
    const key = p.r+','+p.c;
    if(numAt[key]==null) numAt[key] = ++n;
    return { n:numAt[key], r:p.r, c:p.c, dir:p.dir, len:p.a.length, clue:p.clue, a:p.a };
  });
  return { rows, cols, open, num:numAt, w };
}
/* 학생한테 보낼 때는 정답 글자를 뺀다 */
function crossPublic(cr){
  return { rows:cr.rows, cols:cr.cols, open:cr.open, num:cr.num,
    w: cr.w.map(x=>({n:x.n, r:x.r, c:x.c, dir:x.dir, len:x.len, clue:x.clue})) };
}

/* ═══════════════════════════════════════════════════════════════════
   14) 선생님 — 수업 조종판
   ═══════════════════════════════════════════════════════════════════ */
const MODES = { quiz:{n:'일반 퀴즈', ic:'🎪', d:'문제를 내면 다 같이 답을 고릅니다. 빨리 맞힐수록 점수가 높아요.'},
                ox:  {n:'OX 게임',  ic:'⭕', d:'O 나 X 쪽으로 옮겨 갑니다. 틀리면 탈락, 끝까지 남으면 큰 보너스.'},
                cross:{n:'가로세로',ic:'🔠', d:'낱말 격자를 다 같이 채웁니다. 먼저 맞힌 사람이 칸을 차지해요.'} };
let HOST = null;

function hostPanel(box){
  ensureClock();
  const R2 = rref();
  const st = { meta:null, players:{}, tick:null, subs:[] };
  HOST = st;
  leaveFn = ()=>{ st.subs.forEach(f=>f()); clearInterval(st.tick); HOST=null; };

  const sub = (ref, ev, cb)=>{ const h = ref.on(ev, cb); st.subs.push(()=> ref.off(ev, h)); };
  sub(R2.child('meta'), 'value', s=>{ st.meta = s.val(); paint(); });
  sub(R2.child('p'),    'value', s=>{ st.players = s.val()||{}; paint(); });
  sub(R2.child('cross/try'), 'value', s=>{ if(st.meta && st.meta.mode==='cross') gradeTries(s.val()||{}); });

  clearInterval(st.tick);
  st.tick = setInterval(()=>{
    const m = st.meta; if(!m || !m.open) return;
    const t = el('hTime'); const left = Math.max(0, (m.tEnd||0) - svNow());
    if(t) t.textContent = Math.ceil(left/1000)+'초';
    const bar = el('hBar'); if(bar && m.sec) bar.style.width = clamp(left/(m.sec*1000)*100,0,100)+'%';
    if(m.phase==='ask' && left<=0){ if(m.mode==='cross') finishCross(); else doReveal(); }
    if(m.phase==='ask' && m.mode!=='cross'){
      const alive = Object.keys(st.players).filter(k=> st.players[k].alive!==false);
      if(alive.length && alive.every(k=> st.players[k].ansAt)) doReveal();
    }
  }, 300);

  /* ── 방 열기 화면 ── */
  function paintSetup(){
    const L = setList().filter(s=> s.n>0);
    box.innerHTML = `<div class="pnl col" style="grid-column:span 2;overflow:hidden">
      <div class="pnl-h">수업 열기</div>
      <div class="f1 scroll" style="padding:14px">
        ${L.length? '' : '<div class="hint">먼저 <b>문제 만들기</b> 탭에서 문제를 넣어 주세요.</div>'}
        <div style="font-weight:900;color:#12467e;margin-bottom:8px">1. 무엇으로 할까요?</div>
        <div class="menu" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
          ${Object.keys(MODES).map(k=>`<button class="mtile" data-m="${k}" style="min-height:96px">
            <span class="ic">${MODES[k].ic}</span><h3>${MODES[k].n}</h3><p>${MODES[k].d}</p></button>`).join('')}
        </div>
        <div style="font-weight:900;color:#12467e;margin-bottom:8px">2. 어떤 문제 묶음으로?</div>
        <div id="hSets" style="max-height:26vh;overflow:auto;margin-bottom:16px">
          ${L.map(s=>`<div class="setrow" data-id="${s.id}"><div class="sn">${esc(s.title)}
            <div class="sc">문제 ${s.n}개</div></div></div>`).join('')}</div>
        <div class="row gap" style="align-items:flex-end">
          <div><div class="hint">문제 수</div><input class="inp" id="hCnt" type="number" value="10" min="1" max="50" style="width:100px"></div>
          <div><div class="hint">한 문제 시간(초)</div><input class="inp" id="hSec" type="number" value="${R.answerSec}" min="5" max="300" style="width:120px"></div>
          <div class="f1"></div>
          <button class="btn y big" id="hOpen" disabled>방 열기</button>
        </div>
        <div class="hint mt12" id="hNote"></div>
      </div></div>`;
    let mode = null, setId = null;
    const upd = ()=>{ el('hOpen').disabled = !(mode && setId);
      const n = el('hNote');
      if(mode==='cross'){ el('hSec').value = 300; el('hCnt').value = 12;
        n.innerHTML = '가로세로는 <b>정답이 2~7글자</b>인 문제만 씁니다. 한글은 글자가 통째로 겹쳐야 해서, '
          + '겹칠 데가 없는 낱말은 옆 빈자리에 따로 놓입니다.'; }
      else if(mode==='ox'){ el('hSec').value = R.oxMoveSec;
        n.innerHTML = '정답을 <b>O</b> 또는 <b>X</b> 로 적은 문제만 나옵니다. 틀리면 그 판에서 탈락해요.'; }
      else if(mode){ el('hSec').value = R.answerSec; n.innerHTML = ''; }
    };
    $$('[data-m]', box).forEach(b=> b.onclick = ()=>{ mode=b.dataset.m;
      $$('[data-m]',box).forEach(x=> x.style.outline=''); b.style.outline='4px solid #ff9a24'; upd(); });
    $$('#hSets .setrow', box).forEach(r=> r.onclick = ()=>{ setId=r.dataset.id;
      $$('#hSets .setrow',box).forEach(x=>x.classList.remove('on')); r.classList.add('on'); upd(); });
    el('hOpen').onclick = ()=> openRoom(mode, setId,
      clamp(parseInt(el('hCnt').value,10)||10,1,50), clamp(parseInt(el('hSec').value,10)||20,5,600));
  }

  function openRoom(mode, setId, count, sec){
    const seed = (now() & 0x7fffffff) || 1;
    const round = ((st.meta && st.meta.round)||0) + 1;
    let total = count, cross = null;
    if(mode==='cross'){
      cross = buildCross(BANK[setId].qs||[], seed, count);
      if(!cross){ toast('가로세로로 만들 수 있는 낱말이 모자라요 (2~7글자 정답이 2개 이상 필요)', 3600); return; }
      total = cross.w.length;
    } else {
      const qs = pickQs(setId, seed, count, mode==='ox');
      if(!qs.length){ toast(mode==='ox' ? '정답이 O/X 인 문제가 없어요' : '문제가 없어요', 3200); return; }
      total = qs.length;
    }
    const meta = { open:true, mode, setId, seed, count, sec, total, round,
      title: (BANK[setId].title||''), phase:'lobby', qi:-1, tEnd:0 };
    R2.set({ meta, cross: cross? crossPublic(cross) : null }).then(()=> toast('방을 열었어요!'));
  }
  function closeRoom(){
    if(!confirm('수업을 닫을까요? 지금 점수는 사라집니다.')) return;
    R2.child('meta/open').set(false).then(()=> R2.remove());
  }

  /* ── 문제 내기 / 채점 ── */
  function myQs(){ const m = st.meta; return pickQs(m.setId, m.seed, m.count, m.mode==='ox'); }
  function myCross(){ const m = st.meta; return buildCross(BANK[m.setId].qs||[], m.seed, m.count); }

  function startQ(i){
    const m = st.meta, qs = myQs();
    if(i >= qs.length) return doEnd();
    const it = qs[i];
    const pub = { t: it.q, n: i+1, tot: qs.length };
    if(!isOX(it)){ const ch = makeChoices(it, m.seed + i*7919); if(ch) pub.c = ch; }
    else pub.ox = true;
    const ups = {};
    ups['q'] = pub; ups['ans'] = null; ups['reveal'] = null;
    ups['meta/phase'] = 'ask'; ups['meta/qi'] = i; ups['meta/tEnd'] = svNow() + m.sec*1000;
    Object.keys(st.players).forEach(k=>{ ups['p/'+k+'/ansAt'] = null; ups['p/'+k+'/ox'] = null; });
    R2.update(ups);
  }
  function doReveal(){
    const m = st.meta; if(!m || m.phase!=='ask') return;
    const qs = myQs(), it = qs[m.qi]; if(!it) return;
    R2.child('ans').once('value').then(sn=>{
      const ans = sn.val()||{}, ups = {}, tops = [];
      Object.keys(st.players).forEach(k=>{
        const p = st.players[k]; if(p.alive===false) return;
        const a = ans[k]; const ok = a && isRight(a.v, it.a);
        let pts = 0, gold = 0;
        if(ok){
          const usedMs = clamp((a.t||0) - ((m.tEnd||0) - m.sec*1000), 0, m.sec*1000);
          pts = 100 + Math.round(60 * (1 - usedMs/(m.sec*1000)));
          gold = R.livePerQ;
          tops.push({k, name:p.name, ms:usedMs});
          ups['p/'+k+'/ok'] = (p.ok||0)+1;
        } else if(m.mode==='ox'){
          ups['p/'+k+'/alive'] = false;
        }
        ups['p/'+k+'/sc']   = (p.sc||0) + pts;
        ups['p/'+k+'/gain'] = gold;
        ups['p/'+k+'/gqi']  = m.qi;
      });
      tops.sort((a,b)=> a.ms-b.ms);
      ups['reveal'] = { a: String(it.a).split('/')[0], tops: tops.slice(0,3) };
      ups['meta/phase'] = 'reveal';
      R2.update(ups);
    });
  }
  function doEnd(){
    const arr = Object.keys(st.players).map(k=> Object.assign({k}, st.players[k]))
      .sort((a,b)=> (b.sc||0)-(a.sc||0));
    const ups = {};
    arr.forEach((p,i)=>{
      let bonus = R.liveRankBonus[i] || 0;
      if(st.meta.mode==='ox' && p.alive!==false) bonus += 150;
      ups['p/'+p.k+'/gain'] = bonus; ups['p/'+p.k+'/gqi'] = 'F';
    });
    ups['meta/phase'] = 'end';
    R2.update(ups).then(()=> toast('수업을 마쳤어요'));
  }

  /* ── 가로세로 채점 ── */
  let grading = false;
  function gradeTries(tries){
    const m = st.meta;
    if(grading || !m || m.mode!=='cross' || m.phase!=='ask') return;
    const keys = Object.keys(tries); if(!keys.length) return;
    grading = true;
    const cr = myCross(); const byN = {}; cr.w.forEach(w=> byN[w.n]=w);
    R2.child('cross/f').once('value').then(sn=>{
      const filled = sn.val()||{}, ups = {};
      for(const k of keys){
        const t = tries[k]; ups['cross/try/'+k] = null;
        const w = byN[t.n]; if(!w || filled[t.n]) continue;
        if(!isRight(t.v, w.a)) continue;
        filled[t.n] = 1;
        const p = st.players[t.by]||{};
        ups['cross/f/'+t.n] = { a:w.a, by:t.by, name:t.name||p.name||'' };
        ups['p/'+t.by+'/sc']   = (p.sc||0) + 100 + w.len*20;
        ups['p/'+t.by+'/ok']   = (p.ok||0) + 1;
        ups['p/'+t.by+'/gain'] = R.livePerQ;
        ups['p/'+t.by+'/gqi']  = 'c'+t.n;
      }
      R2.update(ups).then(()=>{ grading=false;
        if(Object.keys(filled).length >= cr.w.length) finishCross(); })
        .catch(()=>{ grading=false; });
    }).catch(()=>{ grading=false; });
  }
  function finishCross(){
    const m = st.meta; if(!m || m.phase!=='ask') return;
    const cr = myCross();
    R2.update({ 'reveal': { all: cr.w.map(w=>({n:w.n, a:w.a})) }, 'meta/phase':'reveal' });
  }

  /* ── 방이 열려 있을 때 화면 ── */
  function paint(){
    const m = st.meta;
    if(!m || !m.open) return paintSetup();
    const arr = Object.keys(st.players).map(k=> Object.assign({k}, st.players[k]))
      .sort((a,b)=> (b.sc||0)-(a.sc||0));
    const answered = arr.filter(p=> p.ansAt).length;
    const alive = arr.filter(p=> p.alive!==false).length;
    const qs = m.mode==='cross'? [] : myQs();
    const it = qs[m.qi];

    box.innerHTML = `
      <div class="pnl col" style="overflow:hidden">
        <div class="pnl-h">${MODES[m.mode].ic} ${MODES[m.mode].n} — ${esc(m.title)}
          <div class="f1"></div><button class="btn sm p" id="hClose">방 닫기</button></div>
        <div style="padding:10px 12px;background:#dceffd;border-bottom:2px solid #b8d8f0">
          <div class="row gap">
            <div class="tag" style="background:#0e3f70;color:#fff;padding:5px 12px;font-size:13px">
              들어온 사람 ${arr.length}명${m.mode==='ox'?' · 살아남음 '+alive:''}</div>
            ${m.phase==='ask'&&m.mode!=='cross'? `<div class="tag" style="background:#fff;color:#3d8f2e;padding:5px 12px;font-size:13px">답한 사람 ${answered}</div>`:''}
            <div class="f1"></div>
            ${m.phase==='ask'? `<div class="tag" style="background:#fff;color:#c0392b;padding:5px 12px;font-size:13px" id="hTime">–</div>`:''}
          </div>
          ${m.phase==='ask'? `<div class="timebar mt8"><i id="hBar" style="width:100%"></i></div>`:''}
        </div>
        <div class="plist f1" id="hPl"></div>
      </div>
      <div class="pnl col" style="overflow:hidden">
        <div class="pnl-h">조종</div>
        <div class="f1 scroll" style="padding:14px" id="hCtl"></div>
      </div>`;
    el('hClose').onclick = closeRoom;
    el('hPl').innerHTML = arr.length ? arr.map(p=>`
      <div class="pcard ${p.ansAt?'ansd':''} ${p.alive===false?'dead':''}">
        ${avatarSVG(Object.assign(newAvatar(), p.av||{}), 58, 1)}
        <div class="pn">${esc(p.name||p.k)}</div>
        <div class="st">${p.sc||0}점</div></div>`).join('')
      : '<div class="hint">아직 아무도 안 들어왔어요. 아이들에게 <b>수업 참가하기</b>를 누르라고 해 주세요.</div>';

    const ctl = el('hCtl');
    if(m.mode==='cross'){
      ctl.innerHTML = `
        <div class="hint">낱말 ${m.total}개짜리 격자예요. 아이들이 먼저 맞힌 칸을 차지합니다.</div>
        <div class="mt12 row gap">
          ${m.phase==='lobby'? `<button class="btn y big f1" id="hGo">시작!</button>`:''}
          ${m.phase==='ask'?   `<button class="btn p f1" id="hStop">그만하고 정답 보기</button>`:''}
          ${m.phase==='reveal'?`<button class="btn g f1" id="hEnd">점수 매기고 끝내기</button>`:''}
          ${m.phase==='end'?   `<button class="btn f1" id="hAgain">다시 열기</button>`:''}
        </div>
        <div class="mt12" id="hAns"></div>`;
      const cr = myCross();
      el('hAns').innerHTML = (m.phase==='lobby')? '' :
        '<div style="font-weight:800;color:#12467e;margin-bottom:6px">정답 (선생님만 보임)</div>'
        + cr.w.map(w=>`<div class="qrow"><span style="width:44px;color:#8fb4d0;font-weight:800">${w.n}${w.dir?'세로':'가로'}</span>
            <span class="qq">${esc(w.clue)}</span><span class="qa">${esc(w.a)}</span></div>`).join('');
      const g=el('hGo'); if(g) g.onclick = ()=> R2.update({'meta/phase':'ask','meta/tEnd':svNow()+m.sec*1000});
      const s2=el('hStop'); if(s2) s2.onclick = finishCross;
      const e2=el('hEnd'); if(e2) e2.onclick = doEnd;
    } else {
      ctl.innerHTML = `
        ${m.phase==='lobby'? `<div class="hint">아이들이 다 들어오면 시작하세요. 문제 ${m.total}개.</div>
          <button class="btn y big mt12" style="width:100%" id="hGo">첫 문제 내기</button>`:''}
        ${it? `<div class="qbox mt12"><div class="qno">${m.qi+1} / ${m.total}</div>
            <div class="qtext" style="font-size:21px">${esc(it.q)}</div>
            <div class="mt12" style="font-size:16px;font-weight:900;color:#3d8f2e">
              정답: ${esc(String(it.a).split('/')[0])} <span class="hint">(선생님만 보임)</span></div></div>`:''}
        <div class="row gap mt12">
          ${m.phase==='ask'?   `<button class="btn p f1" id="hRev">지금 정답 공개</button>`:''}
          ${m.phase==='reveal'? (m.qi+1 < m.total
              ? `<button class="btn g big f1" id="hNext">다음 문제 ▶</button>
                 <button class="btn gray" id="hEnd">여기서 끝</button>`
              : `<button class="btn g big f1" id="hEnd">점수 매기고 끝내기</button>`):''}
          ${m.phase==='end'?   `<button class="btn f1" id="hAgain">다시 열기</button>`:''}
        </div>
        ${m.phase==='end'? `<div class="mt12"><div style="font-weight:900;color:#12467e;margin-bottom:6px">최종 순위</div>
          ${arr.map((p,i)=>`<div class="rank ${i<3?'t'+(i+1):''}"><div class="no">${i+1}</div>
            <div class="rn">${esc(p.name)}</div><div class="rs">${p.sc||0}점</div></div>`).join('')}</div>`:''}`;
      const g=el('hGo');   if(g) g.onclick = ()=> startQ(0);
      const r3=el('hRev'); if(r3) r3.onclick = doReveal;
      const n2=el('hNext');if(n2) n2.onclick = ()=> startQ(m.qi+1);
      const e3=el('hEnd'); if(e3) e3.onclick = doEnd;
    }
    const a2=el('hAgain'); if(a2) a2.onclick = ()=> R2.remove().then(paintSetup);
  }
  paintSetup();
}

/* ═══════════════════════════════════════════════════════════════════
   15) 학생 — 수업 참가 화면
   ═══════════════════════════════════════════════════════════════════ */
SCREENS.live = function(st){
  ensureClock();
  const R2 = rref(), MK = ME.k;
  const S = { meta:null, p:{}, q:null, rev:null, cf:{}, subs:[], tick:null,
              phaseKey:'', picked:null, pickedQi:-99, joined:false, appliedGqi:null,
              clue:null, oxNodes:null };
  /* 내가 이번 문제에 낸 답. 문제 번호가 다르면 안 낸 것으로 본다. */
  const myPick = ()=> (S.meta && S.pickedQi === S.meta.qi) ? S.picked : null;

  st.innerHTML = topbar('수업', true) + `<div id="lvWrap" style="position:absolute;inset:54px 0 0 0"></div>`;
  wireTop();
  const wrap = el('lvWrap');

  const sub = (ref, ev, cb)=>{ const h = ref.on(ev, cb); S.subs.push(()=> ref.off(ev, h)); };
  leaveFn = ()=>{ S.subs.forEach(f=>f()); clearInterval(S.tick);
    if(S.joined) R2.child('p/'+MK).remove().catch(()=>{}); };

  sub(R2.child('meta'),   'value', s=>{ S.meta = s.val(); ensureJoin(); render(); });
  sub(R2.child('q'),      'value', s=>{ S.q   = s.val(); render(true); });
  sub(R2.child('reveal'), 'value', s=>{ S.rev = s.val(); render(true); });
  sub(R2.child('p'),      'value', s=>{ S.p   = s.val()||{}; onMine(); render(); });
  sub(R2.child('cross/f'),'value', s=>{ S.cf  = s.val()||{}; if(S.meta&&S.meta.mode==='cross') render(true); });

  S.tick = setInterval(()=>{
    const m = S.meta; if(!m || m.phase!=='ask') return;
    const left = Math.max(0, (m.tEnd||0) - svNow());
    const t = el('lvTime'); if(t) t.textContent = Math.ceil(left/1000);
    const bar = el('lvBar');
    if(bar && m.sec){ const p = clamp(left/(m.sec*1000)*100,0,100); bar.style.width = p+'%';
      bar.className = p<20?'hot':p<50?'warn':''; }
  }, 250);

  function ensureJoin(){
    const m = S.meta;
    if(!m || !m.open){ S.joined=false; return; }
    if(S.joined) return;
    S.joined = true;
    const ref = R2.child('p/'+MK);
    ref.onDisconnect().remove();
    ref.update({ name:ME.name, av:ME.av, sc:0, ok:0, alive:true });
  }
  /* 선생님이 매긴 점수만큼 골드를 받는다 (한 문제에 한 번만) */
  function onMine(){
    const mine = S.p[MK]; if(!mine) return;
    if(mine.gqi != null && mine.gqi !== S.appliedGqi){
      S.appliedGqi = mine.gqi;
      const g = mine.gain||0;
      if(g > 0){ addGold(g, false); toast('+'+g+'골드!', 1600); }
      const s2 = ME.stat||{solved:0,correct:0};
      s2.solved = (s2.solved||0)+1; if(g>0) s2.correct = (s2.correct||0)+1;
      save({stat:s2});
    }
  }
  function sendAnswer(v){
    const m = S.meta;
    if(!m || m.phase!=='ask') return;
    if(myPick() != null) return;
    S.picked = v; S.pickedQi = m.qi;
    const t = svNow();
    R2.child('ans/'+MK).set({v:String(v), t});
    R2.child('p/'+MK+'/ansAt').set(t);
    render(true);
  }

  /* ── 그리기 ── */
  function render(force){
    const m = S.meta;
    const mine = S.p[MK] || {};
    const key = !m||!m.open ? 'closed'
      : m.phase+'|'+m.qi+'|'+m.mode+'|'+(m.round||0)+'|'+(myPick()!=null)+'|'+(mine.alive===false)
        +'|'+(m.mode==='cross'? Object.keys(S.cf).length+'|'+(S.clue||'') : '');
    if(!force && key === S.phaseKey) { paintLight(); return; }
    S.phaseKey = key;

    if(!m || !m.open){
      wrap.innerHTML = `<div class="center" style="height:100%"><div class="pnl" style="padding:26px;text-align:center;width:min(560px,92vw)">
        <div style="font-size:46px">⏳</div>
        <div style="font-size:22px;font-weight:900;color:#12467e">아직 수업이 안 열렸어요</div>
        <div class="hint mt8">선생님이 방을 열면 <b>여기가 저절로 바뀝니다.</b> 기다려 주세요.</div>
        <div class="row gap mt12" style="justify-content:center">
          <button class="btn gray" onclick="go('home')">홈으로</button>
          <button class="btn y" onclick="go('practice')">그동안 혼자 연습하기</button></div></div></div>`;
      return;
    }
    if(m.phase==='lobby')  return paintLobby();
    if(m.phase==='end')    return paintEnd();
    if(m.mode==='cross')   return paintCross();
    if(m.mode==='ox')      return paintOX();
    return paintQuiz();
  }
  function seatHTML(){
    /* 큐플레이 의자처럼, 반 친구들이 답했는지 한눈에 보이게 */
    return plArr().sort((a,b)=> String(a.name||'').localeCompare(String(b.name||''))).map(p=>
      `<div class="pcard ${p.ansAt?'ansd':''} ${p.alive===false?'dead':''}">
        ${avatarSVG(Object.assign(newAvatar(),p.av||{}),52,1)}
        <div class="pn">${esc(p.name||p.k)}</div>
        <div class="st">${p.ansAt?'냈어요':'&nbsp;'}</div></div>`).join('');
  }
  function paintLight(){
    const m = S.meta; if(!m) return;
    const seat = el('lvSeat'); if(seat) seat.innerHTML = seatHTML();
    if(m.phase==='lobby' || m.phase==='end'){ const b = el('lvPl');
      if(b) b.innerHTML = plHTML(); }
    if(m.mode==='ox' && m.phase==='ask') moveOX();
    if(m.phase==='reveal'){ const b=el('lvRank'); if(b) b.innerHTML = rankHTML(); }
  }
  const plArr = ()=> Object.keys(S.p).map(k=> Object.assign({k}, S.p[k]));
  function plHTML(){
    const a = plArr().sort((x,y)=>(y.sc||0)-(x.sc||0));
    return a.map(p=>`<div class="pcard ${p.alive===false?'dead':''} ${p.k===MK?'ansd':''}">
      ${avatarSVG(Object.assign(newAvatar(),p.av||{}),58,1)}
      <div class="pn">${esc(p.name||p.k)}</div><div class="st">${p.sc||0}점</div></div>`).join('')
      || '<div class="hint">아직 아무도 없어요.</div>';
  }
  function rankHTML(){
    const a = plArr().sort((x,y)=>(y.sc||0)-(x.sc||0)).slice(0,10);
    return a.map((p,i)=>`<div class="rank ${i<3?'t'+(i+1):''} ${p.k===MK?'me':''}">
      <div class="no">${i+1}</div><div class="rn">${esc(p.name)}</div>
      <div class="rs">${p.sc||0}점</div></div>`).join('');
  }
  const timeBar = ()=> `<div class="row gap" style="align-items:center;margin-bottom:8px">
      <div class="timebar f1"><i id="lvBar" style="width:100%"></i></div>
      <div class="tag" style="background:#0e3f70;color:#fff;font-size:16px;padding:4px 12px"
        ><span id="lvTime">–</span>초</div></div>`;

  function paintLobby(){
    const m = S.meta;
    wrap.innerHTML = `<div style="display:grid;grid-template-rows:auto 1fr;height:100%;padding:12px;gap:10px">
      <div class="pnl" style="padding:14px 18px;text-align:center">
        <div style="font-size:26px;font-weight:900;color:#12467e;letter-spacing:-.03em">
          ${MODES[m.mode].ic} ${MODES[m.mode].n} — ${esc(m.title)}</div>
        <div class="hint mt8">${MODES[m.mode].d}<br>선생님이 시작하면 바로 문제가 나와요!</div></div>
      <div class="pnl col" style="overflow:hidden"><div class="pnl-h">들어온 친구들</div>
        <div class="plist f1" id="lvPl">${plHTML()}</div></div></div>`;
  }
  function paintEnd(){
    const a = plArr().sort((x,y)=>(y.sc||0)-(x.sc||0));
    const me = a.findIndex(p=>p.k===MK);
    wrap.innerHTML = `<div class="center" style="height:100%;padding:12px">
      <div class="pnl" style="padding:20px;width:min(720px,94vw);text-align:center">
        <div style="font-size:30px;font-weight:900;color:#12467e;letter-spacing:-.04em">수업 끝!</div>
        <div class="center" style="margin:6px 0">${avatarSVG(ME.av,150,2)}</div>
        <div style="font-size:20px;font-weight:800;color:#2b5b85">
          ${me>=0? '나는 <b style="color:#b57700">'+(me+1)+'등</b> · '+(a[me].sc||0)+'점' : '구경했어요'}</div>
        <div class="mt12" style="max-height:34vh;overflow:auto;text-align:left">${rankHTML()}</div>
        <div class="row gap mt12" style="justify-content:center">
          <button class="btn gray" onclick="go('home')">홈으로</button>
          <button class="btn y" onclick="go('shop')">번 골드로 옷 사기</button></div></div></div>`;
  }

  function paintQuiz(){
    const m = S.meta, mine = S.p[MK]||{};
    const showRev = m.phase==='reveal';
    wrap.innerHTML = `<div style="display:grid;grid-template-columns:1fr 250px;height:100%;padding:12px;gap:10px">
      <div class="col" style="overflow:hidden">
        ${m.phase==='ask'? timeBar():''}
        <div class="qbox"><div class="qno">${(S.q&&S.q.n)||m.qi+1} / ${m.total}</div>
          <div class="qtext">${esc((S.q&&S.q.t)||'')}</div></div>
        <div class="f1 scroll mt12" id="lvAns"></div>
        <div class="pnl mt12" style="flex:none;overflow:hidden">
          <div class="plist" id="lvSeat" style="max-height:172px;padding:8px">${seatHTML()}</div></div>
      </div>
      <div class="pnl col" style="overflow:hidden">
        <div class="pnl-h">점수</div>
        <div style="padding:10px;text-align:center;background:#dceffd">
          ${avatarSVG(ME.av,92,1)}
          <div style="font-weight:900;color:#12467e">${esc(ME.name)}</div>
          <div style="font-size:22px;font-weight:900;color:#b57700">${mine.sc||0}점</div></div>
        <div class="f1 scroll" style="padding:8px" id="lvRank">${rankHTML()}</div></div></div>`;
    const area = el('lvAns');
    if(showRev){
      const pk = myPick();
      const ok = pk!=null && S.rev && isRight(pk, S.rev.a);
      area.innerHTML = `<div class="pnl" style="padding:16px;text-align:center;
          background:${ok?'#eafbe4':'#fff0ef'};border-color:${ok?'#3d8f2e':'#d94b46'}">
          <div style="font-size:26px;font-weight:900;color:${ok?'#2c7a22':'#a83531'}">
            ${ok?'정답이에요! 🎉':(pk==null?'시간이 다 됐어요':'아쉬워요')}</div>
          <div class="mt8" style="font-size:22px;font-weight:800;color:#12467e">
            정답은 <b>${esc((S.rev&&S.rev.a)||'')}</b></div>
          ${(S.rev&&S.rev.tops&&S.rev.tops.length)? `<div class="hint mt12">가장 빨리 맞힌 친구 —
            ${S.rev.tops.map((t,i)=>['🥇','🥈','🥉'][i]+' '+esc(t.name)).join('  ')}</div>`:''}
          <div class="hint mt8">선생님이 다음 문제를 낼 때까지 기다려요.</div></div>`;
      return;
    }
    if(myPick() != null){
      area.innerHTML = `<div class="pnl" style="padding:20px;text-align:center;background:#fff8e6">
        <div style="font-size:22px;font-weight:900;color:#b57700">답을 냈어요!</div>
        <div style="font-size:26px;font-weight:900;color:#12467e;margin-top:6px">${esc(myPick())}</div>
        <div class="hint mt8">친구들이 다 낼 때까지 잠깐만요…</div></div>`;
      return;
    }
    if(mine.alive===false){ area.innerHTML = '<div class="pnl" style="padding:20px;text-align:center">'
      + '<b>이번 판은 구경이에요.</b><div class="hint mt8">다음 판에 다시 도전!</div></div>'; return; }
    const it = { q:(S.q&&S.q.t)||'', a:'', c:(S.q&&S.q.c)||null };
    area.innerHTML = (S.q&&S.q.ox)
      ? answerUI({q:it.q, a:'O'})
      : ((S.q&&S.q.c) ? `<div class="choices">` + S.q.c.map((c,i)=>
          `<button class="ch" data-v="${esc(c)}"><span class="n">${['①','②','③','④','⑤','⑥'][i]}</span><span>${esc(c)}</span></button>`).join('')+`</div>`
        : `<div class="row gap"><input class="inp f1" id="ansIn" placeholder="답을 여기에 쓰세요" autocomplete="off"
             style="font-size:22px;padding:14px;font-weight:800;text-align:center">
           <button class="btn y big" id="ansOk">확인</button></div>`);
    wireAnswer(area, v=>{ if(!String(v||'').trim()){ toast('답을 골라 주세요'); return; } sendAnswer(v); });
  }

  function paintOX(){
    const m = S.meta, mine = S.p[MK]||{};
    const dead = mine.alive===false;
    wrap.innerHTML = `<div style="position:absolute;inset:0">
      <div class="oxstage">
        <div class="oxzone o" data-z="0"><div class="mark">O</div></div>
        <div class="oxzone x" data-z="1"><div class="mark">X</div></div>
      </div>
      <div class="oxfield" id="oxField"></div>
      <div style="position:absolute;left:12px;right:12px;top:8px;pointer-events:none">
        <div class="qbox" style="padding:12px 18px">
          <div class="qno">${(S.q&&S.q.n)||m.qi+1} / ${m.total}</div>
          <div class="qtext" style="font-size:22px">${esc((S.q&&S.q.t)||'')}</div></div>
        <div class="mt8">${m.phase==='ask'? timeBar():''}</div></div>
      <div style="position:absolute;left:0;right:0;bottom:10px;text-align:center;pointer-events:none" id="oxMsg"></div></div>`;
    $$('.oxzone', wrap).forEach(z=>{
      if(myPick() === (z.dataset.z==='0'?'O':'X')) z.classList.add('sel');
      z.onclick = ()=>{
      if(m.phase!=='ask' || dead) return;
      const v = z.dataset.z==='0' ? 'O' : 'X';
      S.picked = v; S.pickedQi = m.qi;
      R2.child('ans/'+MK).set({v, t:svNow()});
      R2.child('p/'+MK).update({ ansAt:svNow(), ox:+z.dataset.z,
        px:0.12+Math.random()*0.76, py:0.10+Math.random()*0.74 });
      render(true);
    };});
    S.oxNodes = null; moveOX();
    const msg = el('oxMsg');
    if(m.phase==='reveal'){
      const ok = myPick() && S.rev && isRight(myPick(), S.rev.a);
      msg.innerHTML = `<div class="tag" style="font-size:22px;padding:10px 24px;
        background:${ok?'#3d8f2e':'#d94b46'};color:#fff">정답은 ${esc((S.rev&&S.rev.a)||'')} —
        ${ok?'살아남았어요!':'탈락…'}</div>`;
    } else if(dead) msg.innerHTML = '<div class="tag" style="font-size:17px;padding:8px 20px;background:#0e3f70;color:#fff">탈락했어요 — 친구들을 응원해 주세요</div>';
    else if(myPick()) msg.innerHTML = '<div class="tag" style="font-size:17px;padding:8px 20px;background:#0e3f70;color:#fff">'+myPick()+' 를 골랐어요 (마음이 바뀌면 다시 눌러도 돼요)</div>';
    else msg.innerHTML = '<div class="tag" style="font-size:17px;padding:8px 20px;background:#0e3f70;color:#fff">맞으면 O, 틀리면 X 쪽을 눌러요!</div>';
  }
  function moveOX(){
    const f = el('oxField'); if(!f) return;
    const keys = Object.keys(S.p);
    if(!S.oxNodes || keys.join(',') !== S.oxNodes.sig){
      f.innerHTML = keys.map(k=>{ const p=S.p[k];
        return `<div class="oxdot ${k===MK?'me':''}" data-k="${k}">
          ${avatarSVG(Object.assign(newAvatar(),p.av||{}),72,1)}
          <div class="lb">${esc(p.name||k)}</div></div>`; }).join('');
      S.oxNodes = { sig:keys.join(','), map:{} };
      $$('.oxdot', f).forEach(n=> S.oxNodes.map[n.dataset.k] = n);
    }
    keys.forEach((k,i)=>{
      const n = S.oxNodes.map[k], p = S.p[k]; if(!n) return;
      const has = p.ox===0 || p.ox===1;
      const px = p.px!=null? p.px : ((i%7)/7+0.07), py = p.py!=null? p.py : 0.62;
      n.style.left = (has ? (p.ox===1?50:0) + px*50 : 8 + (i%9)*4) + '%';
      n.style.top  = (has ? 26 + py*58 : 88) + '%';
      n.style.opacity = p.alive===false ? '.35' : '1';
      n.style.filter  = p.alive===false ? 'grayscale(1)' : '';
    });
  }

  function paintCross(){
    const m = S.meta, mine = S.p[MK]||{};
    R2.child('cross').once('value').then(sn=>{
      const cr = sn.val(); if(!cr){ wrap.innerHTML='<div class="center" style="height:100%">격자를 불러오는 중…</div>'; return; }
      const byN = {}; (cr.w||[]).forEach(w=> byN[w.n]=w);
      const letters = {};                       // "r,c" -> 글자
      Object.keys(S.cf).forEach(n=>{ const w = byN[n], f = S.cf[n]; if(!w||!f) return;
        for(let i=0;i<w.len;i++) letters[(w.dir?w.r+i:w.r)+','+(w.dir?w.c:w.c+i)]
          = { ch:String(f.a)[i]||'', by:f.by }; });
      const hi = {};
      if(S.clue && byN[S.clue]){ const w=byN[S.clue];
        for(let i=0;i<w.len;i++) hi[(w.dir?w.r+i:w.r)+','+(w.dir?w.c:w.c+i)]=1; }
      const numByCell = cr.num||{};
      let grid = `<div class="cgrid" id="cGrid" style="grid-template-columns:repeat(${cr.cols},var(--cs,34px))">`;
      for(let r=0;r<cr.rows;r++) for(let c=0;c<cr.cols;c++){
        const open = cr.open[r][c]==='1', key=r+','+c, L=letters[key];
        grid += `<div class="cc ${open?'open':''} ${L?(L.by===MK?'mine':'done'):''} ${hi[key]&&!L?'hi':''}">`
          + (numByCell[key]? `<span class="cn">${numByCell[key]}</span>`:'')
          + (L? `<span class="cv">${esc(L.ch)}</span>`:'') + `</div>`;
      }
      grid += `</div>`;
      const clueRow = (dir)=> (cr.w||[]).filter(w=>w.dir===dir).sort((a,b)=>a.n-b.n).map(w=>
        `<div class="clue ${S.clue==w.n?'on':''} ${S.cf[w.n]?'done':''}" data-n="${w.n}">
          <b>${w.n}.</b> ${esc(w.clue)} <span class="hint">(${w.len}글자)</span>
          ${S.cf[w.n]? '<b style="color:#3d8f2e"> ✔ '+esc(S.cf[w.n].name||'')+'</b>':''}</div>`).join('');
      const doneN = Object.keys(S.cf).length;
      wrap.innerHTML = `<div style="display:grid;grid-template-columns:1fr 330px;height:100%;padding:10px;gap:10px">
        <div class="pnl col" style="overflow:hidden">
          <div class="pnl-h">${esc(m.title)} — ${doneN}/${(cr.w||[]).length} 칸 채움
            <div class="f1"></div>${m.phase==='ask'? '<span id="lvTimeW"><span id="lvTime">–</span>초</span>':''}</div>
          ${m.phase==='ask'? `<div style="padding:6px 10px 0"><div class="timebar"><i id="lvBar" style="width:100%"></i></div></div>`:''}
          <div class="cwrap f1">${grid}</div>
          <div style="padding:8px 10px;background:#dceffd;border-top:2px solid #b8d8f0">
            <div class="row gap">
              <div class="tag" style="background:#0e3f70;color:#fff;padding:8px 12px" id="cSel">
                ${S.clue? S.clue+'번 ('+ (byN[S.clue].dir?'세로':'가로') +', '+byN[S.clue].len+'글자)' : '오른쪽에서 문제를 골라요'}</div>
              <input class="inp f1" id="cIn" placeholder="답안지" autocomplete="off"
                style="font-size:19px;font-weight:800;text-align:center" ${S.clue?'':'disabled'}>
              <button class="btn y" id="cOk" ${S.clue?'':'disabled'}>내기</button></div></div>
        </div>
        <div class="pnl col" style="overflow:hidden">
          <div class="pnl-h">문제</div>
          <div class="f1 scroll" style="padding:8px">
            <div style="font-weight:900;color:#12467e;margin:4px 0">가로</div>${clueRow(0)}
            <div style="font-weight:900;color:#12467e;margin:8px 0 4px">세로</div>${clueRow(1)}
            <div style="font-weight:900;color:#12467e;margin:10px 0 4px">점수</div>${rankHTML()}
          </div></div></div>`;
      $$('.clue', wrap).forEach(c=> c.onclick = ()=>{ S.clue = +c.dataset.n; render(true);
        const i2 = el('cIn'); if(i2) i2.focus(); });
      const send = ()=>{
        const v = (el('cIn').value||'').trim();
        if(!S.clue || !v){ toast('문제를 고르고 답을 써 주세요'); return; }
        if(S.cf[S.clue]){ toast('이미 채워진 칸이에요'); return; }
        R2.child('cross/try/'+MK+'_'+S.clue).set({ n:S.clue, v, by:MK, name:ME.name, t:svNow() });
        el('cIn').value=''; toast('냈어요!');
      };
      const ok = el('cOk'); if(ok) ok.onclick = send;
      const inp = el('cIn'); if(inp) inp.onkeydown = e=>{ if(e.key==='Enter') send(); };
      /* 칸 크기를 남은 자리에 맞춰 키운다 (크롬북 화면에서 글씨가 커 보이게) */
      const box2 = $('.cwrap', wrap);
      if(box2){ const cs = clamp(Math.floor(Math.min(
          (box2.clientWidth  - 24) / cr.cols,
          (box2.clientHeight - 24) / cr.rows)), 24, 56);
        const g = el('cGrid'); if(g) g.style.setProperty('--cs', cs+'px'); }
      if(m.phase==='reveal' && S.rev && S.rev.all && S.revToast !== m.round){
        S.revToast = m.round;
        toast('정답 공개! 못 채운 칸은 선생님 화면에서 볼 수 있어요', 3000);
      }
    });
  }
  render();
};

/* ═══════════════════════════════════════════════════════════════════
   16) 시작
   ═══════════════════════════════════════════════════════════════════ */
window.go = go; window.closeModal = closeModal;
window.addEventListener('error', e=>{ console.error(e.error||e.message); });
go('login');
</script>
</body>
</html>
