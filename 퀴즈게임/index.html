<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
/* ── 크롬북(1280×632)에서 스크롤 없이 들어가도록 짠 레이아웃 ──
   무거운 blur/filter 는 안 씁니다. Mali GPU 에서 비쌉니다.
   움직이는 건 transform/opacity 만 씁니다. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","맑은 고딕",sans-serif;
  font-size:15px; color:#123; user-select:none;
  background:#2e7fd4;
  /* 민무늬 하늘색이면 휑해 보인다. 빗금 무늬와 위쪽 빛을 얹는다.
     한 번만 칠해지는 배경이라 크롬북에서도 공짜다 */
  background-image:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0 14px, rgba(255,255,255,0) 14px 28px),
    linear-gradient(#7fd0ff 0%,#4aa6ee 44%,#2a72c8 100%);
}
/* 배경에 떠다니는 장식 — 화면 구석의 허전함을 메운다 */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco i{position:absolute;display:block;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,.12) 60%, rgba(255,255,255,0) 70%)}
#deco b{position:absolute;color:rgba(255,255,255,.5);font-size:20px;line-height:1}
#stage,#toast,#modal{position:relative;z-index:1}
#stage{position:fixed;inset:0;z-index:1}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:#123}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#8fc4ec;border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ── 공용 부품 ── */
.pnl{background:linear-gradient(#f8fcff 0%,#e2f1ff 42%,#cfe7fb 100%);
  border:3px solid #1e5c9e;border-radius:16px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),
             inset 0 -4px 0 rgba(122,176,220,.4),
             inset 0 0 0 1px rgba(255,255,255,.5),
             0 5px 0 #164a80}
.pnl-h{background:linear-gradient(#7ec8ff 0%,#3f97e6 46%,#2c7ccd 54%,#1f66b4 100%);
  color:#fff;font-weight:800;padding:7px 14px;border-radius:12px 12px 0 0;
  letter-spacing:-.02em;text-shadow:0 1px 1px #14406e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(0,0,0,.14);
  border-bottom:2px solid #16497f;display:flex;align-items:center;gap:8px}
/* 판 네 귀퉁이 못 — 큐플레이 특유의 '기계 판' 느낌 */
.pnl-h::before{content:'';width:9px;height:9px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#9fd0f5 55%,#5590c4);
  box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:12px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(#9ad6ff 0%,#5aa8f0 46%,#3d8fe0 54%,#2f7fd0 100%);
  color:#fff;text-shadow:0 1px 1px #16457a;border:1px solid #1f5f9e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 4px 0 #1f5f9e;
  transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5f9e}
.btn.y{background:linear-gradient(#fff0a8 0%,#ffd24a 46%,#ffc02e 54%,#ffab14 100%);
  color:#6b3d00;text-shadow:0 1px 0 #ffeda0;border-color:#c98800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 0 #c98800}
.btn.y:active{box-shadow:0 1px 0 #c98800}
.btn.p{background:linear-gradient(#ffc4dc 0%,#ff85b6 46%,#ff5f9e 54%,#f04b8c 100%);
  color:#fff;text-shadow:0 1px 1px #ab2a5c;border-color:#d13d79;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #d13d79}
.btn.p:active{box-shadow:0 1px 0 #d13d79}
.btn.g{background:linear-gradient(#c4f5b4 0%,#7ad966 46%,#4cc23c 54%,#3aae2c 100%);
  color:#fff;text-shadow:0 1px 1px #24691b;border-color:#37962b;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #37962b}
.btn.g:active{box-shadow:0 1px 0 #37962b}
.btn.gray{background:linear-gradient(#f4f8fc 0%,#dae6f0 46%,#c6d6e4 54%,#b3c6d8 100%);
  color:#2b4a63;text-shadow:none;border-color:#8ea3b6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 0 #8ea3b6}
.btn.gray:active{box-shadow:0 1px 0 #8ea3b6}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{padding:14px 26px;font-size:19px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px;box-shadow:0 3px 0 #1f5f9e}
.btn.sm.gray{box-shadow:0 3px 0 #8ea3b6}
.btn.sm.y{box-shadow:0 3px 0 #c98800}
.btn.sm.p{box-shadow:0 3px 0 #d13d79}
.btn.sm.g{box-shadow:0 3px 0 #37962b}
.inp{padding:10px 12px;border:2px solid #8fc0e4;border-radius:10px;background:#fff;outline:none;width:100%}
.inp:focus{border-color:#2b7fd0;background:#f4fbff}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;font-weight:800}

/* ── 화면 전환 ── */
.scr{position:fixed;inset:0;display:none}
.scr.on{display:block}
#stage{position:fixed;inset:0}

/* ── 로그인 ── */
/* 크롬북 세로(632px)에 다 들어가야 한다. 넘치면 위아래가 잘린다. */
#login{display:none;place-items:center;overflow:auto;padding:6px 0}
#login.on{display:grid}
.lgStage{display:grid;grid-template-columns:150px auto 150px;align-items:end;gap:6px}
.lgSide{line-height:0;padding-bottom:6px}
.lgSide svg{filter:drop-shadow(0 4px 0 rgba(10,50,90,.25))}
.loginbox{width:376px;padding:13px 16px 11px;text-align:center}
/* 큐플레이 로고처럼 두툼하게 — 그림자를 층층이 쌓아 3D 로 보이게 한다 */
.logo{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;
  color:#ffe27a;margin:0 0 10px;
  text-shadow:
    -3px -3px 0 #14406e, 3px -3px 0 #14406e, -3px 3px 0 #14406e, 3px 3px 0 #14406e,
    -4px 0 0 #14406e, 4px 0 0 #14406e, 0 -4px 0 #14406e, 0 4px 0 #14406e,
    0 7px 0 #0f3a66, 0 10px 0 #0b2d51}
.logo small{display:block;font-size:15px;font-weight:800;letter-spacing:0;
  color:#fff;margin-top:12px;
  text-shadow:-2px -2px 0 #14406e,2px -2px 0 #14406e,-2px 2px 0 #14406e,2px 2px 0 #14406e,0 4px 0 #0f3a66}
.lgFoot{margin-top:8px;text-align:center;color:#cfe6fb;font-size:11px;
  text-shadow:0 1px 0 #14406e}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.pinpad button{padding:9px 0;font-size:20px;font-weight:800;border-radius:11px;
  background:linear-gradient(#fff,#dcecf9);color:#1b4d84;box-shadow:0 4px 0 #9dbcd6}
.pinpad button:active{transform:translateY(3px);box-shadow:0 1px 0 #9dbcd6}
.pindots{display:flex;gap:10px;justify-content:center;margin:7px 0 2px}
.pindots i{width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid #8fc0e4}
.pindots i.f{background:#2b7fd0;border-color:#1b4d84}

/* ── 위쪽 띠 ── */
.top{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;
  gap:9px;padding:0 12px;color:#fff;z-index:5;
  background:linear-gradient(#5cb0f2 0%,#2f83d4 42%,#1f66b4 58%,#17538f 100%);
  border-bottom:3px solid #123f6e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 0 rgba(0,0,0,.12)}
.icb{width:36px;height:36px;flex:none;border-radius:50%;font-size:17px;display:grid;place-items:center;
  background:linear-gradient(#a8dcff 0%,#5aa8f0 48%,#2f7fd0 100%);
  border:2px solid #123f6e;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #123f6e;
  transition:transform .06s,box-shadow .06s}
.icb:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #123f6e}
.icb.y{background:linear-gradient(#ffe9a0 0%,#ffc93e 48%,#ffab14 100%);color:#6b3d00}
/* 아래 알림 띠 — 큐플레이 하단 바 자리 */
.ticker{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;
  border-radius:10px;color:#dff0ff;font-size:13px;font-weight:700;
  background:linear-gradient(#134f8c,#0d3f73);border:2px solid #0b3560;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18);overflow:hidden}
.ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticker em{font-style:normal;color:#ffd24a;font-weight:900}
.top .nm{font-weight:900;font-size:17px;letter-spacing:-.02em;text-shadow:0 1px 0 #123}
.gold{display:flex;align-items:center;gap:5px;background:#0e3f70;border:2px solid #ffd24a;
  border-radius:20px;padding:3px 12px 3px 5px;font-weight:900;color:#ffe38a}
.gold b{font-size:16px;color:#fff}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc32b 60%,#e09400);
  border:1px solid #b57700;display:inline-block;flex:none}

/* ── 홈 ── */
.homewrap{position:absolute;inset:54px 0 0 0;display:grid;
  grid-template-columns:300px 1fr;gap:14px;padding:14px}
.mecard{display:flex;flex-direction:column;overflow:hidden}
.mestage{flex:1;display:grid;place-items:center;padding:6px;
  background:linear-gradient(#cdeaff,#a5d4f6);position:relative}
.mestage svg,.avframe svg{border-radius:12px;overflow:hidden}
.avframe{display:inline-block;line-height:0}
.menu{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.mtile{border:3px solid #1e5c9e;border-radius:18px;padding:16px 18px;text-align:left;
  background:linear-gradient(#ffffff 0%,#eaf5ff 44%,#d3e9fd 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),
             inset 0 -4px 0 rgba(122,176,220,.35), 0 5px 0 #164a80;
  transition:transform .07s,box-shadow .07s;min-height:118px;position:relative;overflow:hidden}
.mtile::after{content:'';position:absolute;right:-30px;top:-30px;width:96px;height:96px;
  border-radius:50%;background:rgba(255,255,255,.5)}
.mtile:active{transform:translateY(4px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -4px 0 rgba(122,176,220,.35),0 1px 0 #164a80}
.mtile{display:flex;flex-direction:column;justify-content:center}
.mtile h3{margin:0 0 4px;font-size:23px;letter-spacing:-.03em;color:#12467e}
.mtile p{margin:0;font-size:13px;color:#4a6b8a;line-height:1.45}
.mtile .ic{font-size:30px;line-height:1;margin-bottom:9px;display:grid;place-items:center;
  width:56px;height:56px;border-radius:50%;position:relative;z-index:1;
  background:linear-gradient(#ffffff,#cfe6fb);border:3px solid #7fb4dd;
  box-shadow:inset 0 2px 0 #fff,0 3px 0 #9dc0dd}
.mtile h3,.mtile p{position:relative;z-index:1}
.mtile.lock{filter:grayscale(.7);opacity:.65}

/* ── 상점 ── */
.shopwrap{position:absolute;inset:54px 0 0 0;display:grid;
  grid-template-columns:260px 1fr 300px;gap:12px;padding:12px}
.tabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
.tab{padding:6px 9px;border-radius:9px 9px 0 0;font-weight:800;font-size:12px;white-space:nowrap;
  background:#c3ddf2;color:#2b5b85;box-shadow:inset 0 -3px 0 #9dbcd6}
.tab.on{background:#fff;color:#12467e;box-shadow:inset 0 -3px 0 #ffb724}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:9px;padding:10px;overflow-y:auto;align-content:start}
.itm{border:2px solid #9dc6e6;border-radius:12px;background:#fff;padding:5px 4px 4px;
  text-align:center;position:relative;transition:transform .07s}
.itm:active{transform:scale(.95)}
.itm.on{border-color:#ff9a24;background:#fff6e6;box-shadow:0 0 0 2px #ffd08a}
.itm.own{border-color:#57bb45}
.itm .thumb{height:64px;display:grid;place-items:center;overflow:hidden}
.itm .nm2{font-size:11px;font-weight:700;color:#2b5b85;line-height:1.2;height:26px;
  display:flex;align-items:center;justify-content:center;text-align:center}
.itm .pr{font-size:11px;font-weight:900;color:#b57700}
.itm .pr.free{color:#3d8f2e}
.itm .badge{position:absolute;top:-6px;right:-5px;font-size:10px;font-weight:900;
  padding:2px 6px;border-radius:20px;background:#57bb45;color:#fff;border:2px solid #fff}
.itm .badge.eq{background:#ff9a24}
.rare1{--rc:#9dc6e6} .rare2{--rc:#7a5cd6} .rare3{--rc:#ff9a24}
.itm.r2{border-color:#a98ce8;background:#faf6ff}
.itm.r3{border-color:#ffb35c;background:#fff8ee}

/* ── 문제 화면 공용 ── */
.qbox{background:linear-gradient(#fffdf3,#fff2cf);border:4px solid #d8a63a;border-radius:18px;
  padding:16px 20px;box-shadow:0 5px 0 #a97c1e;position:relative}
.qbox .qno{position:absolute;left:-2px;top:-16px;background:#e8534f;color:#fff;
  font-weight:900;font-size:13px;padding:4px 14px;border-radius:20px;border:3px solid #fff}
.qtext{font-size:26px;font-weight:800;line-height:1.4;letter-spacing:-.03em;color:#3a2a08;
  word-break:keep-all}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;
  border:3px solid #2b6cb0;background:linear-gradient(#fff,#e6f3ff);
  font-size:19px;font-weight:800;color:#12467e;text-align:left;
  box-shadow:0 4px 0 #1b4d84;transition:transform .07s,box-shadow .07s;word-break:keep-all}
.ch:active{transform:translateY(3px);box-shadow:0 1px 0 #1b4d84}
.ch .n{width:30px;height:30px;flex:none;border-radius:50%;background:#2b7fd0;color:#fff;
  display:grid;place-items:center;font-size:16px}
.ch.pick{border-color:#ff9a24;background:linear-gradient(#fff4e0,#ffe3b8);box-shadow:0 4px 0 #c98800}
.ch.ok{border-color:#3d8f2e;background:linear-gradient(#e8ffe0,#c8f5b8);box-shadow:0 4px 0 #2c7a22}
.ch.ok .n{background:#3d8f2e}
.ch.no{border-color:#d94b46;background:linear-gradient(#ffecec,#ffd0ce);box-shadow:0 4px 0 #a83531;opacity:.75}
.ch.no .n{background:#d94b46}
.timebar{height:16px;border-radius:10px;background:#0e3f70;overflow:hidden;border:2px solid #164d86}
.timebar i{display:block;height:100%;background:linear-gradient(#8ce86a,#3fbb2a);
  transition:width .25s linear;transform-origin:left}
.timebar i.warn{background:linear-gradient(#ffd35c,#ff9a24)}
.timebar i.hot{background:linear-gradient(#ff8a80,#e8342c)}

/* ── 알림/토스트 ── */
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tt{background:#0e3f70;color:#fff;font-weight:800;padding:9px 18px;border-radius:20px;
  border:2px solid #7fd0ff;animation:tin .2s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(8,30,55,.55);display:none;place-items:center;z-index:70}
#modal.on{display:grid}
.mbox{width:min(560px,92vw);max-height:88vh;overflow:auto;padding:0}
.mbody{padding:16px}

/* ── 순위표 ── */
.rank{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:11px;
  background:#fff;border:2px solid #cfe4f5;margin-bottom:6px}
.rank .no{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:13px;background:#c3ddf2;color:#2b5b85}
.rank.t1 .no{background:linear-gradient(#ffe27a,#ffb724);color:#6b3d00}
.rank.t2 .no{background:linear-gradient(#eef3f7,#c3ced8);color:#4a5b6b}
.rank.t3 .no{background:linear-gradient(#f0c08a,#d1934c);color:#5b3410}
.rank .rn{flex:1;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rs{font-weight:900;color:#12467e}
.rank.me{background:#fff6e6;border-color:#ffb724}

/* ── 참가자 카드(수업 대기실) ── */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;
  padding:10px;overflow-y:auto;align-content:start}
.pcard{border:2px solid #9dc6e6;border-radius:12px;background:#fff;padding:4px;text-align:center}
.pcard .pn{font-size:11px;font-weight:800;color:#2b5b85;overflow:hidden;

<body>
<div id="deco"></div>
<div id="stage"></div>

<div id="modal"><div class="pnl mbox"><div class="pnl-h" id="mTitle">알림</div><div class="mbody" id="mBody"></div></div></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════
   1) 자잘한 도구들
   ═══════════════════════════════════════════════════════════════════ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const el = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const now = ()=> Date.now();
const today = ()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const R = window.RULES;

/* 배경에 물방울과 별을 흩어 놓는다. 한 번만 만들고 안 움직인다 */
(function paintDeco(){
  const d = el('deco'); if(!d) return;
  const spots = [[4,10,86],[88,6,120],[12,66,64],[80,74,100],[46,86,52],[62,18,44],[28,34,38],[94,42,58]];
  let h = '';
  spots.forEach(v=> h += `<i style="left:${v[0]}%;top:${v[1]}%;width:${v[2]}px;height:${v[2]}px;
    margin:${-v[2]/2}px 0 0 ${-v[2]/2}px"></i>`);
  ['✦','✧','★','✦','✧','✦','★','✧'].forEach((c,i)=>{
    const x=[7,92,20,74,40,58,86,14][i], y=[30,24,88,8,54,92,64,50][i];
    h += `<b style="left:${x}%;top:${y}%;font-size:${12+(i%3)*7}px;opacity:${.28+(i%3)*.12}">${c}</b>`; });
  d.innerHTML = h;
})();

function toast(msg, ms){
  const d = document.createElement('div');
  d.className='tt'; d.textContent = msg; el('toast').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .3s'; d.style.opacity='0';
    setTimeout(()=>d.remove(),320); }, ms||1800);
}
function modal(title, html, onOpen){
  el('mTitle').textContent = title; el('mBody').innerHTML = html;
  el('modal').classList.add('on'); if(onOpen) onOpen();
}
function closeModal(){ el('modal').classList.remove('on'); }
el('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

/* 답을 견주는 규칙 — 초등학생이 띄어쓰기 하나 틀렸다고 오답이 되면 안 된다.
   공백/문장부호를 지우고, 영문 대소문자를 맞추고, 전각 숫자를 반각으로 바꾼다. */
function norm(s){
  return String(s==null?'':s)
    .replace(/[０-９]/g, c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
    .replace(/[\s​]/g,'')
    .replace(/[.,!?~"'`·…“”‘’(){}\[\]<>]/g,'')
    .toLowerCase();
}
/* 답이 여러 개 허용될 때는 / 로 나눠 적는다: "태평양/태평양바다" */
function isRight(user, ans){
  const u = norm(user); if(!u) return false;
  return String(ans).split('/').some(a=> norm(a)===u );
}

/* 4자리 비번을 그대로 저장하지 않으려고 쓰는 아주 간단한 섞기.
   ※ 진짜 암호학적 보호가 아니다. 교실에서 옆자리 애가 값만 보고
     바로 알아채지 못하게 하는 정도다. 자세한 건 사용법 문서를 봐라. */
function pinHash(id, pin){
  let h = 2166136261 >>> 0; const s = 'qz1|'+id+'|'+pin;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let g = h; for(let i=0;i<3;i++){ g ^= g<<13; g>>>=0; g ^= g>>17; g ^= g<<5; g>>>=0; }
  return (h.toString(36)+'-'+g.toString(36));
}
/* 파이어베이스 키에 못 쓰는 글자( . $ # [ ] / )를 피해 아이디를 키로 만든다 */
function idKey(name){
  return String(name).trim().replace(/[.$#\[\]\/\s]/g,'_').slice(0,24);
}

/* ═══════════════════════════════════════════════════════════════════
   2) 아바타 — 코드로 그리는 2등신 캐릭터
      그림 파일이 하나도 없다. 모양 함수 × 색 = 아이템 수백 종.
   ═══════════════════════════════════════════════════════════════════ */
const AVW = 200, AVH = 300;

function sh(hex, a){            // a: 양수면 밝게, 음수면 어둡게
  const n = parseInt(hex.slice(1),16);
  let r = n>>16&255, g = n>>8&255, b = n&255;
  if(a>=0){ r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; }
  else    { r*=1+a; g*=1+a; b*=1+a; }
  const h2 = v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');
  return '#'+h2(r)+h2(g)+h2(b);
}
const E = (cx,cy,rx,ry,f,x)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${x||''}/>`;
const C = (cx,cy,r,f,x)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}"${x||''}/>`;
const RC= (x,y,w,h,r,f,ex)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${f}"${ex||''}/>`;
const PA= (d,f,x)=>`<path d="${d}" fill="${f}"${x||''}/>`;
const LN= (d,s,w,x)=>`<path d="${d}" fill="none" stroke="${s}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${x||''}/>`;

/* ── 색 팔레트 ─────────────────────────────────────────────── */
const PAL = {
  basic: [['#ff6f91','빨강'],['#ff9f5a','주황'],['#ffd24a','노랑'],['#8fd94a','초록'],
          ['#4ad0c0','민트'],['#5aa8ff','파랑'],['#9b7bff','보라'],['#ff8ad4','분홍'],
          ['#ffffff','하양'],['#556074','검정']],
  hair:  [['#2f2018','검정'],['#5a3a24','갈색'],['#8a5a34','밤색'],['#c9954a','금발'],
          ['#efd79a','노랑'],['#e85a5a','빨강'],['#f291c6','분홍'],['#8a7ce0','보라'],
          ['#5aa8ff','파랑'],['#57cfbe','민트'],['#c4ccd8','은발'],['#fbf3e4','백발']],

/* ── 눈 ──────────────────────────────────────────────────────
   홍채를 겹쳐 그리고, 윗속눈썹을 두껍게 얹고, 반짝이를 두 개 넣는다.
   이 세 가지가 빠지면 인형 눈처럼 밋밋해진다. */
function iris(x, c, rx, ry){
  const id = sh(c,-.5), il = sh(c,.22), ib = sh(c,-.2);
  /* 흰자를 조금만 남기고 홍채가 눈을 거의 채우게 한다.
     흰자가 넓으면 인형 눈처럼 보인다 */
  return E(x,105,rx,ry,'#fff')
   + E(x,106,rx*.95,ry*.94,il)                       // 홍채 바깥(밝은 테)
   + E(x,107,rx*.82,ry*.82,c)                        // 홍채
   + E(x,110,rx*.62,ry*.52,ib)                       // 아래쪽 그늘 — 깊어 보이게
   + E(x,108,rx*.40,ry*.42,'#17120e')                // 눈동자
   + E(x,106,rx*.95,ry*.94,'none',` stroke="${id}" stroke-width="2.2"`)
   + C(x-rx*.30,100,rx*.30,'#fff')                   // 큰 반짝
   + C(x+rx*.34,111,rx*.15,'#fff',' opacity=".9"')   // 작은 반짝
   + E(x,115,rx*.40,ry*.11,'#fff',' opacity=".3"');  // 아랫눈꺼풀 빛
}

/* ── 카탈로그 만들기 ──────────────────────────────────────────
   모양 함수 × 색 팔레트 = 아이템. 그림 파일은 한 장도 안 쓴다. */
const CATS = [
  {k:'hair',   n:'머리',   src:HAIR,    pal:'hair',  crop:'18 4 164 168',  off:false},
  {k:'top',    n:'상의',   src:TOPS,    pal:'basic', crop:'30 126 140 134',off:false},
  {k:'bottom', n:'하의',   src:BOTS,    pal:'basic', crop:'44 204 112 82', off:false},
  {k:'shoes',  n:'신발',   src:SHOES,   pal:'basic', crop:'48 226 104 62', off:false},
  {k:'hat',    n:'모자',   src:HATS,    pal:'basic', crop:'6 0 188 104',   off:true},
  {k:'glass',  n:'안경',   src:GLASSES, pal:'basic', crop:'28 74 144 62',  off:true},
  {k:'face',   n:'수염·점', src:FACES,  pal:'hair',  crop:'32 82 136 86',  off:true},
  {k:'ear',    n:'귀걸이', src:EARR,    pal:'metal', crop:'16 88 168 64',  off:true},
  {k:'neck',   n:'목걸이', src:NECK,    pal:'metal', crop:'56 136 88 72',  off:true},
  {k:'back',   n:'등장식', src:BACKS,   pal:'basic', crop:'0 96 200 184',  off:true},
  {k:'pet',    n:'펫',     src:PETS,    pal:'basic', crop:'126 200 90 86', off:true},
  {k:'bg',     n:'배경',   src:BGS,     pal:'basic', crop:'0 0 200 300',  off:true}
];
const CAT = {}; CATS.forEach(c=>CAT[c.k]=c);

/* 처음 가입하면 공짜로 갖고 시작하는 아이템 */
const STARTER = ['hair:short:0','hair:short:1','hair:bob:1','hair:bob:5',
  'top:tee:5','top:tee:7','top:tee:3','bottom:shorts:5','bottom:jeans:5',
  'bottom:skirt:7','shoes:sneaker:9','shoes:sneaker:8'];
const STARTER_SET = new Set(STARTER);

const ITEMS = {};      // id -> {id,cat,shape,ci,name,price,color}
(function buildCatalog(){
  for(const c of CATS){
    const pal = PAL[c.pal];
    for(const sk in c.src){
      const [sname, sprice] = c.src[sk];
      for(let i=0;i<pal.length;i++){
        const id = c.k+':'+sk+':'+i;
        ITEMS[id] = { id, cat:c.k, shape:sk, ci:i, color:pal[i][0],
          name: sname + ' ('+pal[i][1]+')', short: sname,
          price: STARTER_SET.has(id) ? 0 : sprice };
      }
    }
  }
})();
const ITEM_COUNT = Object.keys(ITEMS).length;

/* 한 파츠를 그린다. val 은 "모양:색번호". 없으면 빈 문자열 */
function part(catKey, val, want){
  if(!val) return '';
  const c = CAT[catKey]; if(!c) return '';
  const [sk, ciS] = String(val).split(':');
  const entry = c.src[sk]; if(!entry) return '';
  const pal = PAL[c.pal];
  const col = (pal[+ciS] || pal[0])[0];
  const out = entry[2](col, sh(col,-.22), sh(col,.34));
  if(typeof out === 'string') return out;
  return out[want] || '';           // 머리처럼 {b,f} 를 돌려주는 것
}

/* 그림에 선을 두른다.
   paint-order="stroke" 는 선을 칠 밑에 깔아서, 도형이 안 깎이고 테두리만 생긴다.
   이 한 줄로 아이템 992종 전부에 선이 들어간다 — 함수를 하나씩 고칠 필요가 없다. */
const INK = '#4a3427';
function ink(str, w){
  return str ? `<g stroke="${INK}" stroke-width="${w||3}" stroke-linejoin="round"`
    + ` stroke-linecap="round" paint-order="stroke fill markers">${str}</g>` : '';
}
/* 머리를 통째로 조금 줄인다. 머리·머리카락·모자·안경이 같이 줄어야 비율이 안 깨진다 */

/* 몸은 조금 홀쭉하고 길게. 옷·신발이 같은 상자 안에 있어서 같이 늘어난다.
   남자는 어깨를 넓게 — 옷이 같은 상자에 있으니 옷도 같이 넓어진다 */
const bodyT = m => ` transform="translate(100 214) scale(${m?'.98':'.89'} 1.07) translate(-100 -214)"`;
const headT = m => ` transform="translate(100 96) scale(${m?'.95':'.92'}) translate(-100 -96)"`;


/* ── 아바타 한 장 그리기 ──────────────────────────────────────
   lod 2 = 크게(홈·상점), lod 1 = 작게(명단·OX). 작을 땐 등장식을 뺀다. */
const avCache = new Map();
function avKey(a){
  return [a.sk,a.ec,a.eyes,a.sex,a.hair,a.top,a.bottom,a.shoes,a.hat,a.glass,a.ear,a.neck,a.back,a.pet,a.bg,a.face].join('|');
}
/* lod 3 = 크게 + 움직임 (혼자 크게 보이는 곳)
   lod 2 = 크게 + 정지 (패션왕처럼 21명이 한꺼번에 뜨는 곳)
   lod 1 = 작게 (명단·OX). 배경·등장식·펫을 아예 안 그린다 */
function avatarSVG(av, size, lod){
  av = av || newAvatar(); lod = lod==null?2:lod;
  const key = avKey(av)+'#'+size+'#'+lod;
  const hit = avCache.get(key); if(hit) return hit;
  const sk = (PAL.skin[av.sk] || PAL.skin[0])[0];
  const mm = av.sex === 'm';
  /* 아바타마다 깜빡이는 박자를 다르게 — 다 같이 깜빡이면 기계 같다 */
  let hsh = 0; for(let i=0;i<key.length;i++){ hsh = (hsh*31 + key.charCodeAt(i)) >>> 0; }
  const d1 = (hsh % 40) / 10, d2 = ((hsh>>>5) % 30) / 10;
  let s = '';
  if(lod >= 2) s += lod>=3 ? `<g class="bgmove">`+part('bg', av.bg)+`</g>`
                           : part('bg', av.bg);   // 배경은 선을 안 두른다
  s += SHADOW;
  s += `<g class="${lod>=3?'bob':''}" style="animation-delay:${d2}s">`;
  if(lod >= 2) s += ink(part('back', av.back), 2.8);
  s += `<g${headT(mm)}>` + ink(part('hair', av.hair, 'b'), 3.2) + `</g>`;
  s += `<g${bodyT(mm)}>` + ink(drawBody(sk), 3)
     + ink(part('bottom', av.bottom), 2.8)
     + ink(part('shoes', av.shoes), 2.8)
     + ink(part('top', av.top), 2.8)
     + ink(part('neck', av.neck), 2.2) + `</g>`;
  s += `<g${headT(mm)}>`
     + ink(drawHead(sk), 3)
     + drawFace(av)                       /* 얼굴은 선이 이미 들어 있어서 안 두른다 */
     + ink(part('face', av.face), 2)
     + ink(part('glass', av.glass), 2.2)
     + `</g><g${headT(mm)}>` + ink(part('hair', av.hair, 'f'), 3.2)
     + `</g><g${headT(mm)}>`
     + ink(part('ear', av.ear), 2.2)
     + ink(part('hat', av.hat), 2.8)
     + `</g>`;
  s += `</g>`;
  if(lod >= 2 && av.pet) s += `<g class="${lod>=3?'petbox':''}" style="animation-delay:${d1}s">`
                  + ink(part('pet', av.pet), 2.8) + `</g>`;
  const svg = `<svg viewBox="0 0 ${AVW} ${AVH}" width="${size*AVW/AVH}" height="${size}" `
    + `shape-rendering="geometricPrecision" style="display:block">${s}</svg>`;
  if(avCache.size > 260) avCache.clear();
  avCache.set(key, svg);
  return svg;
}
/* 상점 미리보기 — 그 파츠가 잘 보이도록 잘라서 보여 준다 */
function partThumb(catKey, shape, ci, h){
  const c = CAT[catKey];
  const base = { sk:1, ec:0, eyes:'round', sex:'f', hair:'', top:'', bottom:'', shoes:'',
                 hat:'', glass:'', ear:'', neck:'', back:'', pet:'', bg:'', face:'' };
  base[catKey] = shape+':'+ci;
  if(catKey==='bg'){                        // 배경은 배경만 보여 준다
    return `<svg viewBox="0 0 200 300" height="${h}" width="${(h*200/300)|0}" style="display:block">`
      + part('bg', base.bg) + `</svg>`;
  }
  if(catKey==='pet'){                       // 펫은 사람 없이 펫만 보여 준다
    const [px,py,pw,ph2] = c.crop.split(' ').map(Number);
    return `<svg viewBox="${c.crop}" height="${h}" width="${(h*pw/ph2)|0}" style="display:block">`
      + ink(part('pet', base.pet), 2.8) + `</svg>`;
  }
  if(catKey==='top')    base.bottom = 'shorts:9';
  if(catKey==='bottom') base.top    = 'tee:8';
  if(catKey==='hair'||catKey==='hat'||catKey==='glass'||catKey==='ear'||catKey==='face')
    base.hair = (catKey==='hair'? shape+':'+ci : 'short:0');
  if(catKey==='face') base.sex = 'm';
  const sks = (PAL.skin[base.sk])[0];
  const mm = base.sex === 'm';
  let s = '';
  if(catKey==='back') s += ink(part('back', base.back), 2.8);
  s += SHADOW;
  s += `<g${headT(mm)}>` + ink(part('hair', base.hair, 'b'), 3.2) + `</g>`;
  s += `<g${bodyT(mm)}>` + ink(drawBody(sks), 3)
     + ink(part('bottom', base.bottom), 2.8) + ink(part('shoes', base.shoes), 2.8)
     + ink(part('top', base.top), 2.8) + ink(part('neck', base.neck), 2.2) + `</g>`;
  s += `<g${headT(mm)}>` + ink(drawHead(sks), 3) + drawFace(base)
     + ink(part('face', base.face), 2) + ink(part('glass', base.glass), 2.2) + `</g>`
     + `<g${headT(mm)}>` + ink(part('hair', base.hair, 'f'), 3.2) + `</g>`
     + `<g${headT(mm)}>` + ink(part('ear', base.ear), 2.2) + ink(part('hat', base.hat), 2.8) + `</g>`;
  const [cx,cy,cw,ch] = c.crop.split(' ').map(Number);
  return `<svg viewBox="${c.crop}" height="${h}" width="${(h*cw/ch)|0}" style="display:block">${s}</svg>`;
}

/* ═══════════════════════════════════════════════════════════════════
   2.5) 소리 — 파일을 하나도 안 쓴다
   브라우저가 직접 소리를 만든다(웹오디오). 그래서 받아올 게 없고,
   크롬북에서 로딩이 안 늘어난다. 브라우저 규칙상 아이가 한 번
   화면을 누른 뒤에야 소리가 나기 시작한다.
   ═══════════════════════════════════════════════════════════════════ */
const SND = {
  ctx:null, master:null, musicGain:null,
  on:  (()=>{ try{ const v=localStorage.getItem('qz_snd'); return v==null?true:JSON.parse(v); }catch(e){ return true; } })(),
  bgm: (()=>{ try{ const v=localStorage.getItem('qz_bgm'); return v==null?true:JSON.parse(v); }catch(e){ return true; } })(),
  timer:null, next:0, step:0,

  wake(){
    if(this.ctx) { if(this.ctx.state==='suspended') this.ctx.resume(); return true; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.16;
      this.musicGain.connect(this.master);
    }catch(e){ return false; }
    return true;
  },
  /* 음 하나 */
  note(freq, t, dur, type, vol, dest){
    if(!this.on || !this.ctx) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g); g.connect(dest || this.master);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(t, dur, vol){
    if(!this.on || !this.ctx) return;
    const c = this.ctx, n = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol||0.06;
    const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=4000;
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    src.start(t);
  },
  /* 효과음 */
  seq(list, type, vol){
    if(!this.wake() || !this.on) return;
    const t0 = this.ctx.currentTime + 0.01;
    list.forEach(v=> this.note(v[0], t0+v[1], v[2], type, vol));
  },
  click(){ this.seq([[880,0,0.05]], 'square', 0.10); },
  pick(){  this.seq([[660,0,0.05],[990,0.05,0.07]], 'square', 0.12); },
  ok(){    this.seq([[784,0,0.09],[988,0.08,0.09],[1319,0.16,0.20]], 'square', 0.16); },
  no(){    this.seq([[311,0,0.13],[233,0.12,0.22]], 'sawtooth', 0.12); },
  coin(){  this.seq([[1319,0,0.05],[1976,0.05,0.14]], 'square', 0.13); },
  buy(){   this.seq([[523,0,0.06],[659,0.06,0.06],[784,0.12,0.06],[1047,0.18,0.16]],'triangle',0.16); },
  tick(){  this.seq([[1200,0,0.03]], 'square', 0.07); },
  hurry(){ this.seq([[1400,0,0.04],[1400,0.1,0.04]], 'square', 0.10); },
  fanfare(){ this.seq([[523,0,0.12],[659,0.11,0.12],[784,0.22,0.12],
                       [1047,0.33,0.30],[784,0.33,0.30],[1319,0.55,0.45]], 'square', 0.17); },
  sad(){   this.seq([[440,0,0.18],[392,0.17,0.18],[330,0.34,0.34]], 'triangle', 0.14); },
  start(){ this.seq([[523,0,0.10],[784,0.12,0.10],[1047,0.24,0.22]], 'square', 0.16); },

  /* 배경음악 — 통통 튀는 8마디를 계속 돈다 */
  TUNE: [
    /* [음높이(반음), 길이] 0 = 쉼 */
    [72,1],[76,1],[79,1],[76,1], [81,1],[79,1],[76,1],[72,1],
    [74,1],[77,1],[81,1],[77,1], [79,1],[77,1],[74,2],[0,0],
    [72,1],[76,1],[79,1],[84,1], [83,1],[79,1],[76,1],[72,1],
    [74,1],[71,1],[74,1],[77,1], [76,2],[0,0],[72,2],[0,0]
  ],
  BASS: [48,48,53,53,55,55,48,48, 48,48,53,53,55,55,48,48,
         45,45,50,50,52,52,45,45, 48,48,53,53,55,55,48,48],
  hz(m){ return 440 * Math.pow(2, (m-69)/12); },
  music(go){
    this.bgm = go; try{ localStorage.setItem('qz_bgm', JSON.stringify(go)); }catch(e){}
    if(!go){ clearInterval(this.timer); this.timer=null; return; }
    if(!this.wake()) return;
    if(this.timer) return;
    this.next = this.ctx.currentTime + 0.1; this.step = 0;
    const SPB = 0.24;                            // 한 박 길이 (약 125BPM 느낌)
    this.timer = setInterval(()=>{
      if(!this.ctx || !this.on || !this.bgm) return;
      while(this.next < this.ctx.currentTime + 0.6){
        const i = this.step % this.TUNE.length;
        const n = this.TUNE[i];
        if(n[0]) this.note(this.hz(n[0]), this.next, SPB*n[1]*0.85, 'square', 0.16, this.musicGain);
        const b = this.BASS[i % this.BASS.length];
        if(i%2===0) this.note(this.hz(b), this.next, SPB*1.6, 'triangle', 0.20, this.musicGain);
        if(i%2===1) this.noise(this.next, 0.05, 0.05);
        this.next += SPB * n[1];
        this.step++;
      }
    }, 120);
  },
  setOn(v){
    this.on = v; try{ localStorage.setItem('qz_snd', JSON.stringify(v)); }catch(e){}
    if(this.master) this.master.gain.value = v ? 0.5 : 0;
    if(v && this.bgm) this.music(true);
  }
};

let saveTimer = null, savePend = {};
function save(patch, now2){
  if(!ME) return;
  Object.assign(ME, patch); Object.assign(savePend, patch);
  paintGold();
  if(!FB.ok) return;
  clearTimeout(saveTimer);
  const flush = ()=>{ const p = savePend; savePend = {};
    if(Object.keys(p).length) uref(ME.k).update(p).catch(e=>toast('저장 실패: '+e.message,3000)); };

}
/* 선생님이 준 골드(패션왕 상금·수업 보너스)를 화면이 바로 받아 오게.
   내 계정을 계속 지켜보다가, 내가 방금 쓴 값이 아니면 그대로 받는다. */
let meWatch = null;
function watchMe(){
  if(meWatch){ meWatch(); meWatch = null; }
  if(!FB.ok || !ME || IS_TEACHER) return;
  const r = uref(ME.k);
  const cb = r.on('value', sn=>{
    const u = sn.val(); if(!u || !ME) return;
    if(savePend.gold === undefined && typeof u.gold === 'number' && u.gold !== ME.gold){
      const diff = u.gold - ME.gold;
      ME.gold = u.gold; paintGold();
      if(diff > 0){ toast('선물 도착! +' + diff + '골드 🎁', 2600); SND.coin(); }
    }
    if((u.crown||0) !== (ME.crown||0)) ME.crown = u.crown||0;
  });
  meWatch = ()=> r.off('value', cb);
}
function owns(id){ return !!(ME && ME.owned && ME.owned[id]) || STARTER_SET.has(id); }
function paintGold(){ const g = el('goldNum'); if(g && ME) g.textContent = (ME.gold||0).toLocaleString(); }

/* 골드 더하기 — 연습 모드는 하루 상한을 지킨다 */
function addGold(n, fromPractice){
  if(!ME || n<=0) return 0;
  let give = n;
  if(fromPractice){
    const d = ME.day && ME.day.d===today() ? ME.day : {d:today(), g:0};
    give = Math.max(0, Math.min(n, R.practiceCap - d.g));
    d.g += give; ME.day = d; save({day:d});
  }
  if(give>0) save({gold:(ME.gold||0)+give});
  return give;
}

        uref(k).set(fresh).then(()=>{ enter(k, fresh); })
          .catch(e=> msg('<b style="color:#c0392b">만들기 실패: '+esc(e.message)+'</b>'));
        return;
      }
      if(!u){ msg('<b style="color:#c0392b">그런 아이디가 없어요. "처음이에요"를 눌러 만들어 주세요.</b>'); return; }
      if(u.pin !== h){ pin=''; dots(); msg('<b style="color:#c0392b">비밀번호가 달라요. 다시 눌러 보세요.</b>'); return; }
      enter(k, u);
    }).catch(e=> msg('<b style="color:#c0392b">연결 실패: '+esc(e.message)+'</b>'));
  };

  function enter(k, u){
    ME = { k, name:u.name||k, gold:u.gold||0, av:Object.assign(newAvatar(), u.av||{}),
           owned:u.owned||{}, stat:u.stat||{solved:0,correct:0}, crown:u.crown||0,
           day:(u.day && u.day.d===today()) ? u.day : {d:today(), g:0} };
    IS_TEACHER = false;
    LS.set('login', {k, h:u.pin});
    watchMe();
    if(!ME.day || ME.day.d!==today()) save({day:{d:today(),g:0}});
    go('home');
  }

  /* 지난번에 들어왔던 아이디면 바로 들어간다 */
  const saved = LS.get('login', null);
  if(saved && saved.k && initFB()){
    msg('지난번 아이디로 들어가는 중…');
    uref(saved.k).once('value').then(sn=>{
      const u = sn.val();
      if(u && u.pin===saved.h) enter(saved.k, u);
      else { LS.del('login'); msg(''); }
    }).catch(()=>{ msg(''); });
  }
};

    '옷 가게에는 <em>'+ITEM_COUNT+'가지</em>가 있어요. 색을 바꾸면 또 달라져요',
    '<em>배경 장식</em>을 사면 내 캐릭터 뒤가 예뻐집니다',
    '수업 모드는 <em>빨리 맞힐수록</em> 점수가 높아요',
    '띄어쓰기나 물음표는 틀려도 괜찮아요. <em>답만</em> 맞으면 정답!',
    '<em>펫</em>을 사면 내 옆에 따라다녀요 — 강아지·고양이·펭귄·공룡…',
    '얼굴·눈 모양 바꾸기는 <em>공짜</em>예요'
  ];
  let ti = (Math.random()*TIPS.length)|0;
  const tk = ()=>{ const n = el('tick'); if(!n) return false;
    n.innerHTML = TIPS[ti % TIPS.length]; ti++; return true; };
  tk();
  const tkTimer = setInterval(()=>{ if(!tk()) clearInterval(tkTimer); }, 5200);
  const prevLeave = leaveFn;
  leaveFn = ()=>{ if(prevLeave) prevLeave(); clearInterval(tkTimer); };

  /* 패션왕 배너 — 대회가 열렸거나 금요일이면 띄운다 */
  function banner(html, cls){

  }
  if(FB.ok){
    const fr = fref().child('cur');
    const fcb = fr.on('value', sn=>{
      const c = sn.val(); const b = el('fBan'); if(!b) return;

             : c.phase==='vote'  ? '<b>패션왕 투표 중!</b><div class="hint">누가 제일 잘 꾸몄는지 골라 주세요</div>'
             :                     '<b>패션왕 발표가 났어요!</b><div class="hint">결과 보러 가기</div>');
      } else if(isFriday()){
        banner('<b>오늘은 금요일 — 패션왕 대회 날!</b><div class="hint">선생님이 열기 전에 예쁘게 꾸며 두세요</div>');
      } else b.innerHTML = '';
    });
    const old = leaveFn;
    leaveFn = ()=>{ if(old) old(); fr.off('value', fcb); };
  }

  /* 선생님이 방을 열었으면 알려 준다 */
  if(FB.ok){
    const rf = rref().child('meta');

      const m = sn.val(); const h = el('liveHint'); if(!h) return;

    });
    const before = leaveFn;
    leaveFn = ()=>{ if(before) before(); rf.off('value', cb); };
  }
};

function showRank(){
  if(!FB.ok){ toast('연결이 안 돼 있어요'); return; }
  modal('우리 반 순위', '<div class="center" style="height:120px">불러오는 중…</div>');
  FB.db.ref(DBR+'/users').once('value').then(sn=>{
    const arr = [];
    sn.forEach(c=>{ const v=c.val(); if(c.key==='__teacher') return;
      arr.push({k:c.key, name:v.name||c.key, gold:v.gold||0, crown:v.crown||0,
        correct:(v.stat&&v.stat.correct)||0, av:v.av}); });
    const draw = (key, unit)=>{
      const s = arr.slice().sort((a,b)=> (b[key]-a[key]) || a.name.localeCompare(b.name));
      return s.slice(0,30).map((u,i)=>`<div class="rank ${i<3?'t'+(i+1):''} ${u.k===ME.k?'me':''}">
        <div class="no">${i+1}</div>
        <div style="width:30px;flex:none">${avatarSVG(Object.assign(newAvatar(),u.av||{}), 40, 1)}</div>
        <div class="rn">${esc(u.name)}${crownStr(u.crown)}</div><div class="rs">${u[key].toLocaleString()}${unit}</div></div>`).join('')
        || '<div class="hint">아직 아무도 없어요.</div>';
    };
    el('mBody').innerHTML = `<div class="row gap" style="margin-bottom:10px">
        <button class="btn sm y f1" id="rkA">맞힌 문제</button>
        <button class="btn sm gray f1" id="rkB">모은 골드</button></div>
      <div id="rkList" style="max-height:52vh;overflow:auto">${draw('correct','개')}</div>`;
    const A = el('rkA'), B = el('rkB');
    A.onclick = ()=>{ A.className='btn sm y f1'; B.className='btn sm gray f1'; el('rkList').innerHTML = draw('correct','개'); };
    B.onclick = ()=>{ B.className='btn sm y f1'; A.className='btn sm gray f1'; el('rkList').innerHTML = draw('gold','골드'); };
  }).catch(e=> el('mBody').innerHTML = '<div class="hint">불러오지 못했어요: '+esc(e.message)+'</div>');
}

/* ═══════════════════════════════════════════════════════════════════
   9) 문제 은행
   문제 한 개 = {q:문제, a:답, c:[오답 보기들]}
   c 가 없으면 답을 직접 쓰는 주관식. a 가 O/X 면 OX 문제.
   ═══════════════════════════════════════════════════════════════════ */
let BANK = {};                       // setId -> {title, qs:[...]}
function loadBank(){
  return new Promise((res,rej)=>{
    if(!FB.ok) return rej(new Error('연결 안 됨'));
    bref().once('value').then(sn=>{ BANK = sn.val()||{}; res(BANK); }).catch(rej);
  });
}
function setList(){
  return Object.keys(BANK).map(id=>({id, title:BANK[id].title||'이름 없음',
    n:(BANK[id].qs||[]).length, made:BANK[id].made||0}))
    .sort((a,b)=> b.made - a.made);
}
/* 붙여넣은 여러 줄을 문제로 바꾼다.
   탭이 있으면 탭으로, 없으면 쉼표로 나눈다.
   첫 칸 = 문제, 둘째 칸 = 답, 나머지 = 오답 보기 */
function parsePaste(text){
  const out = [], bad = [];
  String(text).split(/\r?\n/).forEach((line,i)=>{
    const t = line.trim(); if(!t) return;
    if(/^(문제|질문)\s*[\t,]/.test(t) && i===0) return;         // 표 머리글은 건너뛴다
    const f = (t.indexOf('\t')>=0 ? t.split('\t') : t.split(',')).map(x=>x.trim()).filter((x,j)=> j<2 || x!=='');
    if(f.length < 2 || !f[0] || !f[1]){ bad.push(t); return; }
    const q = { q:f[0], a:f[1] };
    const ch = f.slice(2).filter(Boolean);
    if(ch.length) q.c = ch.slice(0,5);
    out.push(q);
  });
  return {ok:out, bad};
}
/* 객관식 보기 만들기 — 정답 + 오답들을 섞는다 */
function makeChoices(item, seed){
  if(!item.c || !item.c.length) return null;
  const arr = [item.a].concat(item.c);
  let s = seed==null? Math.random()*99991 : seed;
  const rnd = ()=>{ s = (s*9301 + 49297) % 233280; return s/233280; };
  for(let i=arr.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
const isOX = it => /^(o|x|O|X|ㅇ|ㅁ|맞|틀)/.test(String(it.a).trim()) && String(it.a).trim().length<=2;

function answerUI(item, seed){
  if(isOX(item)){
    return `<div class="choices" style="grid-template-columns:1fr 1fr;gap:18px">
      <button class="ch" data-v="O" style="justify-content:center;font-size:52px;padding:18px;
        background:linear-gradient(#fff6da,#ffe1a0);border-color:#d8a63a;box-shadow:0 5px 0 #a97c1e;color:#a35f00">O</button>
      <button class="ch" data-v="X" style="justify-content:center;font-size:52px;padding:18px;
        background:linear-gradient(#e6f4ff,#c2e0f8);border-color:#3d94e4;box-shadow:0 5px 0 #1f5f9e;color:#12467e">X</button></div>`;
  }
  const ch = makeChoices(item, seed);
  if(ch){
    const num = ['①','②','③','④','⑤','⑥'];
    return `<div class="choices">` + ch.map((c,i)=>
      `<button class="ch" data-v="${esc(c)}"><span class="n">${num[i]}</span><span>${esc(c)}</span></button>`).join('') + `</div>`;
  }
  return `<div class="row gap mt12">
    <input class="inp f1" id="ansIn" placeholder="답을 여기에 쓰세요" autocomplete="off"
      style="font-size:22px;padding:14px;font-weight:800;text-align:center">
    <button class="btn y big" id="ansOk">확인</button></div>`;
}
function wireAnswer(root, cb){
  $$('.ch', root).forEach(b=> b.onclick = ()=> cb(b.dataset.v, b));
  const inp = $('#ansIn', root), ok = $('#ansOk', root);
  if(inp){ inp.focus();
    inp.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); cb(inp.value, null); } };
    ok.onclick = ()=> cb(inp.value, null);
  }
}
function markAnswer(root, item, picked){
  const right = String(item.a).split('/')[0].trim();
  $$('.ch', root).forEach(b=>{
    const v = b.dataset.v;
    b.disabled = true;
    if(isRight(v, item.a)) b.classList.add('ok');
    else if(v===picked)    b.classList.add('no');
  });
  const inp = $('#ansIn', root); if(inp){ inp.disabled = true; const ok=$('#ansOk',root); if(ok) ok.disabled=true; }
  return right;
}

  function start(setId){
    const all = (BANK[setId].qs||[]).slice();
    for(let i=all.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; const t=all[i]; all[i]=all[j]; all[j]=t; }
    const qs = all.slice(0, Math.min(R.practiceCount, all.length));
    let i = 0, right = 0, earned = 0;

    const marks = [];      // 문제별 ○ / ✕
    function road(){
      let h = '';
      for(let k=0;k<qs.length;k++){
        const m = marks[k], cur = k===i;
        h += `<div class="sw">${cur? '<div class="who">'+avatarSVG(ME.av,50,1)+'</div>':''}`
           + `<div class="stone ${m===1?'ok':m===0?'no':''} ${cur?'cur':''}">`
           + (m===1?'○':m===0?'✕':(k+1)) + `</div></div>`;
      }
      return h;
    }
    function sheet(){
      let h = '';
      for(let k=0;k<qs.length;k++){
        const m = marks[k];
        h += `<div class="mcell ${m===1?'ok':m===0?'no':''}">${k+1}<b>${m===1?'○':m===0?'✕':'·'}</b></div>`;
      }
      return h;
    }
    function step(){
      if(i >= qs.length) return done();
      wrap.style.placeItems = 'stretch';
      const item = qs[i];
      wrap.innerHTML = `<div class="play3">
        <div class="pnl col" style="overflow:hidden">
          <div class="pnl-h">나</div>
          <div class="mestage f1" style="min-height:0">${avatarSVG(ME.av, 210, 3)}</div>
          <div style="padding:8px 10px;background:#dceffd;border-top:2px solid #b8d8f0;text-align:center">

            <div class="tag mt8" id="prGold" style="background:#fff6e6;color:#b57700;font-size:13px;padding:4px 12px">
              이번 판 +${earned}골드</div></div>
        </div>

        <div class="pnl col" style="overflow:hidden;min-width:0">
          <div class="pnl-h">${esc(BANK[setId].title||'문제')}

          <div class="col f1" style="padding:14px;min-height:0;justify-content:center">
            <div class="qbox"><div class="qno">문제 ${i+1}</div>
              <div class="qtext">${esc(item.q)}</div></div>
            <div id="ansArea" class="mt12">${answerUI(item, i*7919+setId.length)}</div>
            <div id="fb" style="min-height:60px;margin-top:10px"></div>
          </div>
          <div class="roadbox"><div class="road" id="prRoad">${road()}</div></div>
        </div>

        <div class="pnl col" style="overflow:hidden">
          <div class="pnl-h">채점표</div>
          <div class="msheet f1" id="prSheet">${sheet()}</div>
          <div style="padding:8px 10px;background:#dceffd;border-top:2px solid #b8d8f0;text-align:center">
            <div class="hint">오늘 더 벌 수 있는 골드</div>
            <div style="font-size:19px;font-weight:900;color:#b57700">${capLeft()}</div></div>
        </div>
      </div>`;
      wireAnswer(wrap, (v, btn)=> judge(item, v));
    }
    function judge(item, v){
      if(!String(v||'').trim()){ toast('답을 골라 주세요'); return; }
      const ok = isRight(v, item.a);
      const right2 = markAnswer(wrap, item, v);
      const s = ME.stat||{solved:0,correct:0};
      s.solved = (s.solved||0)+1; if(ok) s.correct = (s.correct||0)+1;
      save({stat:s});
      let got = 0;
      if(ok){ right++; got = addGold(R.practicePerQ, true); earned += got; SND.ok(); }
      else SND.no();
      marks[i] = ok ? 1 : 0;
      el('prOk').textContent = '맞힘 ' + right;
      el('prGold').textContent = '이번 판 +' + earned + '골드';
      el('prSheet').innerHTML = sheet();
      el('prRoad').innerHTML = road();
      el('fb').innerHTML = ok
        ? `<div class="pnl" style="padding:12px 16px;background:#eafbe4;border-color:#3d8f2e">

        : `<div class="pnl" style="padding:12px 16px;background:#fff0ef;border-color:#d94b46">
            <b style="color:#a83531;font-size:19px">아쉬워요.</b>
            <span style="font-size:17px;font-weight:800;color:#12467e">정답은 <b>${esc(right2)}</b></span>
            <button class="btn" style="float:right" id="nx">다음 ▶</button></div>`;
      el('nx').onclick = ()=>{ i++; step(); };
      document.onkeydown = e=>{ if(curScr==='practice' && e.key==='Enter'){ const n=el('nx'); if(n) n.click(); } };
    }
    function done(){
      wrap.style.placeItems = 'center';
      if(right >= qs.length*0.7) SND.fanfare(); else SND.sad();
      wrap.innerHTML = `<div class="pnl" style="padding:24px;width:min(680px,94vw);text-align:center">
        <div style="font-size:30px;font-weight:900;color:#12467e;letter-spacing:-.04em">다 풀었어요!</div>
        <div class="center avframe" style="margin:10px 0">${avatarSVG(ME.av, 170, 3)}</div>

          ${qs.length}문제 중 <b style="color:#3d8f2e">${right}개</b> 정답</div>

          이번 판에 번 골드 +${earned}</div>

        <div class="row gap mt12" style="justify-content:center">
          <button class="btn gray" id="dHome">홈으로</button>
          <button class="btn" id="dAgain">한 판 더</button>
          <button class="btn y" id="dShop">옷 사러 가기</button></div></div>`;
      el('dHome').onclick = ()=> go('home');
      el('dShop').onclick = ()=> go('shop');
      el('dAgain').onclick = ()=> start(setId);
    }

  }
};

/* ═══════════════════════════════════════════════════════════════════
   13) 수업 모드 — 방 규칙
   ★ 정답은 '공개' 하기 전까지 절대 방에 안 올린다.
     채점은 선생님 화면이 한다. 학생 화면은 자기 점수를 스스로 못 올린다.
   ═══════════════════════════════════════════════════════════════════ */
let SVOFF = 0, clockOn = false;
function ensureClock(){
  if(clockOn || !FB.ok) return;
  clockOn = true;
  FB.db.ref('.info/serverTimeOffset').on('value', s=>{ SVOFF = s.val()||0; });
}
const svNow = ()=> Date.now() + SVOFF;

/* 같은 씨앗(seed)이면 언제 다시 돌려도 같은 순서가 나온다.
   선생님 화면을 새로고침해도 문제 순서가 안 흐트러진다. */
function seedRnd(seed){ let s = seed>>>0 || 1;
  return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function pickQs(setId, seed, count, onlyOX){
  let all = (BANK[setId] && BANK[setId].qs || []).slice();
  if(onlyOX) all = all.filter(isOX);
  const rnd = seedRnd(seed);
  for(let i=all.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=all[i]; all[i]=all[j]; all[j]=t; }
  return all.slice(0, Math.min(count||all.length, all.length));
}
