<title>tri count</title>
<pre id="out">running…</pre>
<script>
const LOG=[];
function run(){
const HW = 73, WS = HW*2+1;
const GY = 9;
const ARENA_R = 40;
const RING_A = 40, RING_D = 53;
const FIELD_R = 59;
const MTN_H = 15;
const GAP_HALF = 6.6;
const NG = 5;
const GHEX = [0xff6b6b,0x4dabf7,0x51cf66,0xffd43b,0xcc7bff];
const gi = (x,z)=> (x+HW) + (z+HW)*WS;
const inW = (x,z)=> x>=-HW && x<=HW && z>=-HW && z<=HW;
const DIRS = [];
for(let i=0;i<NG;i++){ const a = -Math.PI/2 + i*(Math.PI*2/NG);
  DIRS.push({a, dx:Math.cos(a), dz:Math.sin(a)}); }
const T = { grassTop:0, grassSide:1, dirt:2, stone:3, rock:4, sand:5, logSide:6, logTop:7,
  leaves:8, plank:9, brick:10, goldOre:11, crystal:12, wool:13, fur:14, furDark:15,
  ice:16, sbrick:17, goldBlk:18, dark:19, hay:20, water:21, eye:22, snout:23,
  woolDirty:24, tower:25, roofRed:26, glow:27, thatch:28, bark:29, mossy:30, cloth:31 };
function rnd(s){ const v = Math.sin(s*127.1 + s*s*0.017)*43758.5453; return v - Math.floor(v); }
function boxGeo(){ return {}; }
const cube = (t)=> boxGeo();
const MAT={}, matC=(h)=>({h});
const terrH = new Int16Array(WS*WS).fill(-999);
const blockG= new Int8Array(WS*WS).fill(-1);
function terrAt(x,z){ return inW(x,z) ? terrH[gi(x,z)] : -999; }
function gapHalfAt(r){ return GAP_HALF + Math.max(0, (r-RING_D))*0.85; }
function mtnHeight(r){ if(r <= RING_A) return 0; return Math.min(MTN_H, (r-RING_A)*2.7); }
function corridorDist(x,z){
  for(let i=0;i<NG;i++){ const d=DIRS[i];
    const t = x*d.dx + z*d.dz; if(t<=0) continue;
    const perp = Math.abs(-x*d.dz + z*d.dx);
    if(perp < gapHalfAt(t)+3) return [i,t,perp];
  }
  return null;
}
function sectorOf(x,z){
  let a = Math.atan2(z,x), best=0, bd=9;
  for(let i=0;i<NG;i++){ let d=Math.abs(((a-DIRS[i].a+Math.PI*3)%(Math.PI*2))-Math.PI);
    if(d<bd){bd=d;best=i;} }
  return best;
}
function genTerrain(){
  for(let z=-HW; z<=HW; z++) for(let x=-HW; x<=HW; x++){
    const r = Math.hypot(x+0.5, z+0.5); const i = gi(x,z);
    if(r > FIELD_R){ terrH[i] = -999; continue; }
    let h = GY;
    let m = mtnHeight(r);
    if(m > 0){
      const cd = corridorDist(x+0.5, z+0.5);
      if(cd){
        const gh = gapHalfAt(r);
        const fade = (cd[2] - gh) / 2.6;
        m *= Math.max(0, Math.min(1, fade));
      }
      if(m > 0.35){
        const n = Math.sin(x*0.7)*Math.cos(z*0.61)*1.3 + Math.sin((x+z)*0.33)*1.0;
        h = GY + Math.max(1, Math.round(m + n));
      }
    }
    terrH[i] = h;
    blockG[i] = (r < FIELD_R) ? sectorOf(x+0.5,z+0.5) : -1;
  }
  for(let z=-4; z<=4; z++) for(let x=-4; x<=4; x++) terrH[gi(x,z)] = GY+1;
  for(let z=-5; z<=5; z++) for(let x=-5; x<=5; x++)
    if(Math.max(Math.abs(x),Math.abs(z))===5) terrH[gi(x,z)] = GY+1;
}
genTerrain();

// ── bpush 카운터 ──
const banks = new Map();
let TAG='';
const tagCount = new Map();
// 섹터 분할 시뮬레이션
const SEC = 8;
function cellOf(x,z){
  const r = Math.hypot(x,z);
  if(r < 18) return 'c';
  let a = Math.atan2(z,x); if(a<0) a += Math.PI*2;
  return (a/(Math.PI*2)*SEC)|0;
}
const sbanks = new Map();      // 전부 쪼갤 때
const sbanks4 = new Map();     // 큰 뱅크 4개만 쪼갤 때
const BIG4 = new Set(['rk','leaf','mo','log']);
const secInst = new Map();     // 섹터별 인스턴스 수(전체)
function bpush(key, geo, mat, x,y,z, ry=0, sx=1,sy=1,sz=1){
  banks.set(key,(banks.get(key)||0)+1);
  tagCount.set(TAG,(tagCount.get(TAG)||0)+1);
  const c = cellOf(x,z);
  sbanks.set(key+'#'+c,(sbanks.get(key+'#'+c)||0)+1);
  const k4 = BIG4.has(key) ? key+'#'+c : key;
  sbanks4.set(k4,(sbanks4.get(k4)||0)+1);
  secInst.set(c,(secInst.get(c)||0)+1);
  return [key, banks.get(key)-1];
}

const NDIST={}; let NCOL2=0, NTOT=0, NCAP2=0, NCAP3=0;
function buildWorldMesh(){
  const gRock = cube(T.rock), gMoss = cube(T.mossy), gStone = cube(T.stone);
  const gGrass = boxGeo();
  const gSB = cube(T.sbrick), gGold = cube(T.goldBlk);
  TAG='terrain-blocks';
  for(let z=-HW; z<=HW; z++) for(let x=-HW; x<=HW; x++){
    const h = terrH[gi(x,z)]; if(h <= GY) continue;
    let hn = 99;
    for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const t = inW(x+dx,z+dz) ? terrH[gi(x+dx,z+dz)] : GY-3;
      hn = Math.min(hn, t<-900 ? GY-3 : t);
    }
    const n = Math.max(1, Math.min(7, h - hn));
    NDIST[n]=(NDIST[n]||0)+1; if(n>1) NCOL2++;
    NTOT += n; if(n>2) NCAP2 += (n-2); if(n>3) NCAP3 += (n-3);
    const r = Math.hypot(x+0.5,z+0.5);
    const plat = Math.max(Math.abs(x),Math.abs(z)) <= 5 && r < 9;
    for(let k=0;k<n;k++){
      const y = h - 0.5 - k;
      if(plat){ bpush('sb', gSB, MAT, x+0.5, y, z+0.5); }
      else if(k===0 && h <= GY+3){ bpush('gr', gGrass, MAT, x+0.5, y, z+0.5); }
      else {
        const mossy = ((x*7+z*13)%17+17)%17 < 3 && k===0;
        bpush(mossy?'mo':'rk', mossy?gMoss:gRock, MAT, x+0.5, y, z+0.5);
      }
    }
  }
  TAG='platform-gold';
  for(let i=-5;i<=5;i++){ for(const p of [[i,-5],[i,5],[-5,i],[5,i]])
    if(Math.abs(p[0])===5||Math.abs(p[1])===5) bpush('gb', gGold, MAT, p[0]+0.5, GY+1.5, p[1]+0.5); }
  TAG='flags+marks';
  const gFlat = boxGeo();
  for(let g=0; g<NG; g++){
    const d = DIRS[g], mc = matC(GHEX[g]);
    for(const rr of [ARENA_R+2, RING_D-2]){
      const gh = gapHalfAt(rr);
      for(const side of [-1,1]){
        const px = Math.round(d.dx*rr - (-d.dz)*side*(gh+2.4));
        const pz = Math.round(d.dz*rr - ( d.dx)*side*(gh+2.4));
        if(!inW(px,pz)) continue;
        const base = terrH[gi(px,pz)];
        for(let k=0;k<4;k++) bpush('flag'+g, cube(T.cloth), mc, px+0.5, base+0.5+k, pz+0.5);
        bpush('flagT'+g, cube(T.glow), matC(0xfff0a0), px+0.5, base+4.5, pz+0.5);
      }
    }
    for(let t=ARENA_R-5; t<RING_D-1; t+=1){
      if(t%2) continue;
      const gh = Math.min(gapHalfAt(t), GAP_HALF+0.5);
      for(const side of [-1,1]){
        const px = Math.round(d.dx*t - (-d.dz)*side*(gh-0.5));
        const pz = Math.round(d.dz*t - ( d.dx)*side*(gh-0.5));
        if(!inW(px,pz) || terrH[gi(px,pz)] !== GY) continue;
        bpush('mk'+g, gFlat, mc, px+0.5, GY+0.05, pz+0.5);
      }
    }
  }
}

const NODES=[];
const NODE_DEF={tree:{hits:8},rock:{hits:8},gold:{hits:8}};
const NODE_S = 0.45;
const LEAF_LIT = matC(0xbfe89a), LEAF_DK = matC(0x6f9c52);
function mkTree(x,z,dec){
  const S = NODE_S;
  const hs=[], H = 4 + (Math.abs(Math.sin(x*3.3+z*7.7))*2|0);
  const gLog = boxGeo(), gLf = cube(T.leaves);
  const P = (dx,dy,dz)=>[x+0.5+dx*S, GY+(0.5+dy)*S, z+0.5+dz*S];
  const put = (key,g,m,dx,dy,dz,s)=>{ const p=P(dx,dy,dz);
    return bpush(key,g,m,p[0],p[1],p[2],0,(s||1)*S,(s||1)*S,(s||1)*S); };
  for(let k=0;k<H;k++) hs.push(put('log', gLog, MAT, 0,k,0));
  for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]])
    if(rnd(x*5.1+z*2.7+dx*3+dz*7) < 0.45) hs.push(put('root', gLog, MAT, dx,0,dz, 0.62));
  for(let dy=0; dy<3; dy++){
    const rad = dy===2 ? 1 : 2;
    for(let dx=-rad; dx<=rad; dx++) for(let dz=-rad; dz<=rad; dz++){
      if(Math.abs(dx)===rad && Math.abs(dz)===rad && dy!==1) continue;
      if(dx===0&&dz===0&&dy<2) continue;
      const r = rnd(x*1.7+z*4.3+dx*11+dz*23+dy*41);
      const m = (dy===2 || r<0.22) ? LEAF_LIT : (dy===0 && r<0.5) ? LEAF_DK : MAT;
      const key = m===LEAF_LIT?'leafL' : m===LEAF_DK?'leafD' : 'leaf';
      hs.push(put(key, gLf, m, dx, H+dy-1, dz));
    }
  }
  return hs;
}
function mkRock(x,z){
  const S = NODE_S;
  const hs=[], g = cube(T.stone), gm = cube(T.mossy), gr = cube(T.rock);
  const put = (key,gg,m,dx,dy,dz,s)=>bpush(key,gg,m,0,0,0);
  const pat = [[0,0,3],[1,0,2],[-1,0,1],[0,1,2],[0,-1,1],[1,1,1]];
  for(const [dx,dz,hh] of pat){ for(let k=0;k<hh;k++){
    const top = (k===hh-1);
    const mossy = top && rnd(x*3.1+z*6.7+dx*17+dz*29) < 0.42;
    hs.push(put(mossy?'rockM':'rockN', mossy?gm:g, MAT, dx,k,dz));
  } }
  for(const [dx,dz] of [[-1,-1],[2,0],[-1,1],[1,-1]])
    if(rnd(x*7.7+z*1.3+dx*5+dz*13) < 0.55) hs.push(put('rockP', gr, MAT, dx,0,dz, 0.44));
  return hs;
}
const ORE_GLOW = matC(0);
function mkGold(x,z){
  const S = NODE_S;
  const hs=[], g = cube(T.goldOre), gs = cube(T.stone), gb = cube(T.goldBlk);
  const put = (key,gg,m,dx,dy,dz,s)=>bpush(key,gg,m,0,0,0);
  for(const [dx,dz,hh,go] of [[0,0,3,1],[1,0,2,1],[-1,0,2,0],[0,1,2,1],[0,-1,1,0],[1,1,1,0]]){
    for(let k=0;k<hh;k++) hs.push(put(go?'ore':'oreS', go?g:gs, MAT, dx,k,dz));
  }
  hs.push(put('oreG', gb, ORE_GLOW, 0, 3, 0, 0.52));
  hs.push(put('oreG', gb, ORE_GLOW, 1, 2, 0, 0.38));
  return hs;
}
function placeNodes(){
  const taken = [];
  const ok = (x,z,minD)=>{
    for(const t of taken) if(Math.hypot(t[0]-x,t[1]-z) < minD) return false;
    return true;
  };
  TAG='resource-nodes';
  for(let g=0; g<NG; g++){
    const base = DIRS[g].a;
    const spec = [['tree',9],['rock',9],['gold',4]];
    for(const [type,cnt] of spec){
      let made=0, tries=0;
      while(made<cnt && tries++<1200){
        const a = base + (Math.random()-0.5)*(Math.PI*2/NG)*0.98;
        const r = 13.0 + Math.random()*24;
        const x = Math.round(Math.cos(a)*r), z = Math.round(Math.sin(a)*r);
        if(Math.hypot(x,z) < 12 || Math.hypot(x,z) > 37.5) continue;
        const cd = corridorDist(x+0.5,z+0.5);
        if(cd && cd[2] < GAP_HALF+2.5) continue;
        if(!ok(x,z, type==='tree'?3.4:2.8)) continue;
        taken.push([x,z]);
        const hs = type==='tree'? mkTree(x,z) : type==='rock'? mkRock(x,z) : mkGold(x,z);
        NODES.push({type,x,z,g,hs,alive:true});
        made++;
      }
    }
  }
  TAG='decor-forest-210';
  let placed=0;
  for(let i=0;i<210;i++){
    const a = Math.random()*Math.PI*2, r = ARENA_R+3 + Math.random()*(FIELD_R-ARENA_R-5);
    const x = Math.round(Math.cos(a)*r), z = Math.round(Math.sin(a)*r);
    if(!inW(x,z)) continue;
    const cd0 = corridorDist(x+0.5,z+0.5);
    if(cd0 && cd0[2] < gapHalfAt(r)+1.5) continue;
    if(terrAt(x,z) < GY) continue;
    const y0 = terrAt(x,z);
    const gLog = boxGeo(), gLf = cube(T.leaves);
    const H = 4+(Math.random()*3|0);
    for(let k=0;k<H;k++) bpush('log', gLog, MAT, x+0.5, y0-0.5+k, z+0.5);
    for(let dy=0;dy<2;dy++) for(let dx=-1;dx<=1;dx++) for(let dz=-1;dz<=1;dz++)
      bpush('leaf', gLf, MAT, x+0.5+dx, y0+H-1.5+dy, z+0.5+dz);
    placed++;
  }
  LOG.push('  실제로 심긴 장식나무 수: '+placed+' / 210');
}
function scatterDecor(){
  TAG='decor-flowers';
  const gBush=boxGeo(),gBushS=boxGeo(),gP=boxGeo(),gStem=boxGeo(),gPeb=boxGeo();
  const petalCol = [0xff6f6f, 0xffd84d, 0xffffff, 0xc98cff, 0x6fb8ff];
  const petalMat = petalCol.map(c=>matC(c));
  let n=0, guard=0, bush=0, fl=0, peb=0;
  while(n<700 && guard++<6000){
    const a=Math.random()*Math.PI*2, r=9+Math.random()*(FIELD_R-11);
    const x=Math.round(Math.cos(a)*r), z=Math.round(Math.sin(a)*r);
    if(!inW(x,z) || terrAt(x,z)!==GY) continue;
    if(Math.max(Math.abs(x),Math.abs(z))<=6) continue;
    const k=Math.random();
    if(k<0.55){
      const small = Math.random()<0.42;
      bpush(small?'bushS':'bush', small?gBushS:gBush, MAT, x+0.5, GY, z+0.5); bush++;
    } else if(k<0.88){
      const ci=(Math.random()*petalCol.length)|0;
      bpush('stem', gStem, MAT, x+0.5, GY, z+0.5);
      bpush('petal'+ci, gP, petalMat[ci], x+0.5, GY, z+0.5); fl++;
    } else {
      bpush('peb', gPeb, MAT, x+0.5, GY, z+0.5); peb++;
    }
    n++;
  }
  LOG.push('  scatterDecor: 총 '+n+'개 자리 (수풀 '+bush+', 들꽃 '+fl+'(=인스턴스 2개씩), 돌멩이 '+peb+') guard='+guard);
}
function crystalBase(){
  TAG='crystal-base';
  for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++){
    if(Math.abs(dx)===2&&Math.abs(dz)===2) continue;
    bpush('cb', cube(T.goldBlk), matC(0xffffff), dx+0.5, GY+1.5, dz+0.5);
  }
}
buildWorldMesh(); placeNodes(); scatterDecor(); crystalBase();

let total=0;
const rows=[...banks.entries()].sort((a,b)=>b[1]-a[1]);
LOG.push('── 뱅크별 인스턴스 (1인스턴스 = 큐브 12삼각형) ──');
for(const [k,v] of rows){ total+=v; LOG.push('  '+k.padEnd(10)+' '+String(v).padStart(6)+'  = '+String(v*12).padStart(7)+' tri'); }
LOG.push('  ── 뱅크 개수(=InstancedMesh/드로우콜): '+banks.size);
LOG.push('  ── 총 인스턴스: '+total+'   = '+(total*12)+' 삼각형');
LOG.push('── 구간별 ──');
for(const [k,v] of [...tagCount.entries()].sort((a,b)=>b[1]-a[1]))
  LOG.push('  '+k.padEnd(18)+' '+String(v).padStart(6)+' inst = '+String(v*12).padStart(7)+' tri');

// 지형 통계
let mtnCols=0;
for(let z=-HW;z<=HW;z++)for(let x=-HW;x<=HW;x++){
  const h=terrH[gi(x,z)]; if(h<=GY) continue; mtnCols++;
}
LOG.push('── 지형: 산 기둥(h>GY) 칸 수 = '+mtnCols+'  총블록='+NTOT);
LOG.push('   n(기둥당 쌓는 블록 수) 분포: '+JSON.stringify(NDIST));
LOG.push('   n>=2 인 기둥 수 = '+NCOL2+'  → Y스케일 1개로 합치면 '+(NTOT-mtnCols)+'개 중 '+(NTOT-mtnCols-NCOL2)+'개 절약 = '+((NTOT-mtnCols-NCOL2)*12)+' tri');
LOG.push('   min(7→2) 로 낮추면 '+NCAP2+'개 절약 = '+(NCAP2*12)+' tri;  min(7→3) 이면 '+NCAP3+'개 = '+(NCAP3*12)+' tri');

LOG.push('── 섹터 분할 시뮬 (r<18 = 중앙 1칸, 나머지 각도 '+SEC+'등분) ──');
LOG.push('   전부 분할 시 뱅크(드로우콜) 수: '+sbanks.size+' (현재 '+banks.size+')');
LOG.push('   BIG4(rk,leaf,mo,log)만 분할 시 뱅크 수: '+sbanks4.size);
const bigTot = ['rk','leaf','mo','log'].reduce((a,k)=>a+(banks.get(k)||0),0);
LOG.push('   BIG4 인스턴스 합계: '+bigTot+' = '+(bigTot*12)+' tri ('+(bigTot/total*100).toFixed(1)+'%)');
LOG.push('   섹터별 인스턴스: '+JSON.stringify([...secInst.entries()].sort()));
let over500=0; for(const [k,v] of sbanks) if(v>=200) over500++;
LOG.push('   전부 분할 시 인스턴스 200개 이상인 뱅크: '+over500);
document.getElementById('out').textContent = LOG.join('\n');
}
run();
</script>
