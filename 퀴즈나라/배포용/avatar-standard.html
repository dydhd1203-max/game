<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퀴즈나라 · 기준 캐릭터</title><link rel="stylesheet" href="avatar-standard.css"><link rel="stylesheet" href="avatar-foundation.css"></head>
<body><main><header><a href="./?demo=1">퀴즈나라</a><h1>기준 캐릭터 · 검수 중</h1><p>초록 반팔 · 남색 반바지 · 아이보리 운동화</p><p>공통 몸과 기본 착장을 검토하는 화면입니다. 목·어깨와 동작 그림은 아직 최종 확정 전이며, 현재 게임의 모든 옷이 이 기준으로 전환된 상태는 아닙니다.</p></header>
<section class="studio" aria-label="남녀 기준 캐릭터"><article><h2>남자 기본형</h2><div class="large" id="male"></div><div class="map-size" id="male-small"></div><small>마을 표시 기준 · 120px</small></article><article><h2>여자 기본형</h2><div class="large" id="female"></div><div class="map-size" id="female-small"></div><small>마을 표시 기준 · 120px</small></article></section>
<section class="controls" aria-label="동작 살펴보기"><div id="actions"><button data-action="idle">서기</button><button data-action="walk">걷기</button><button data-action="run">달리기</button><button data-action="floor-sit">아빠다리</button><button data-action="sit">책상 앉기</button><button data-action="jump">점프</button><button data-action="wave">인사</button></div><div id="directions"><button data-direction="front">앞</button><button data-direction="left">왼쪽</button><button data-direction="right">오른쪽</button><button data-direction="back">뒤</button><label><input id="outfit" type="checkbox" checked>기본 착장</label><label><input id="bones" type="checkbox">관절 보기</label><label>피부 <select id="skin"><option value="0">살구</option><option value="1">밝은</option><option value="2">보통</option><option value="3">건강</option><option value="4">진한</option></select></label></div><div class="playback"><button id="pause">일시 정지</button><label>동작 시점 <input id="phase" type="range" min="0" max="1" step="0.005" value="0"></label><output id="status" aria-live="polite">준비 중…</output></div></section>
<footer><p>방향키로 걷기 · 같은 방향키를 두 번 누른 채 유지하면 달리기 · C 앉기 · Space 점프 · H 인사</p><a href="./?demo=1&amp;avatar=foundation&amp;screen=campus" target="_blank" rel="noopener">교실에서 움직이기 ↗</a><a href="./?demo=1&amp;avatar=foundation&amp;screen=playground" target="_blank" rel="noopener">운동장에서 움직이기 ↗</a></footer><p id="error" role="alert" hidden></p></main>
<iframe id="runtime" src="./?demo=1&amp;session=foundation-studio" title="격리된 캐릭터 실행 환경" hidden></iframe><script src="avatar-run-input.js"></script><script src="avatar-standard.js"></script></body></html>
