<style>
/* ── 크롬북(1280×632)에서 스크롤 없이 들어가도록 짠 레이아웃 ──
   무거운 blur/filter 는 안 씁니다. Mali GPU 에서 비쌉니다.
   움직이는 건 transform/opacity 만 씁니다. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","맑은 고딕",sans-serif;
  font-size:15px; color:#123; user-select:none;
  background:#2e7fd4;
  /* 민무늬 하늘색이면 휑해 보인다. 빗금 무늬와 위쪽 빛을 얹는다.
     한 번만 칠해지는 배경이라 크롬북에서도 공짜다 */
  background-image:
    radial-gradient(120% 70% at 50% -10%, rgba(255,255,255,.35), rgba(255,255,255,0) 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.055) 0 14px, rgba(255,255,255,0) 14px 28px),
    linear-gradient(#7fd0ff 0%,#4aa6ee 44%,#2a72c8 100%);
}
/* 배경에 떠다니는 장식 — 화면 구석의 허전함을 메운다 */
#deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#deco i{position:absolute;display:block;border-radius:50%;

#stage,#toast,#modal{position:relative;z-index:1}
#stage{position:fixed;inset:0;z-index:1}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:#123}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-thumb{background:#8fc4ec;border-radius:8px;border:3px solid transparent;background-clip:content-box}

/* ── 공용 부품 ── */
.pnl{background:linear-gradient(#f8fcff 0%,#e2f1ff 42%,#cfe7fb 100%);
  border:3px solid #1e5c9e;border-radius:16px;

  letter-spacing:-.02em;text-shadow:0 1px 1px #14406e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.65), inset 0 -2px 0 rgba(0,0,0,.14);
  border-bottom:2px solid #16497f;display:flex;align-items:center;gap:8px}
/* 판 네 귀퉁이 못 — 큐플레이 특유의 '기계 판' 느낌 */
.pnl-h::before{content:'';width:9px;height:9px;border-radius:50%;flex:none;
  background:radial-gradient(circle at 35% 30%,#fff,#9fd0f5 55%,#5590c4);
  box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 18px;border-radius:12px;font-weight:800;letter-spacing:-.02em;
  background:linear-gradient(#9ad6ff 0%,#5aa8f0 46%,#3d8fe0 54%,#2f7fd0 100%);
  color:#fff;text-shadow:0 1px 1px #16457a;border:1px solid #1f5f9e;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),0 4px 0 #1f5f9e;
  transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1f5f9e}
.btn.y{background:linear-gradient(#fff0a8 0%,#ffd24a 46%,#ffc02e 54%,#ffab14 100%);
  color:#6b3d00;text-shadow:0 1px 0 #ffeda0;border-color:#c98800;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 4px 0 #c98800}
.btn.y:active{box-shadow:0 1px 0 #c98800}
.btn.p{background:linear-gradient(#ffc4dc 0%,#ff85b6 46%,#ff5f9e 54%,#f04b8c 100%);
  color:#fff;text-shadow:0 1px 1px #ab2a5c;border-color:#d13d79;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #d13d79}
.btn.p:active{box-shadow:0 1px 0 #d13d79}
.btn.g{background:linear-gradient(#c4f5b4 0%,#7ad966 46%,#4cc23c 54%,#3aae2c 100%);
  color:#fff;text-shadow:0 1px 1px #24691b;border-color:#37962b;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 4px 0 #37962b}
.btn.g:active{box-shadow:0 1px 0 #37962b}

  color:#2b4a63;text-shadow:none;border-color:#8ea3b6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 4px 0 #8ea3b6}
.btn.gray:active{box-shadow:0 1px 0 #8ea3b6}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.big{padding:14px 26px;font-size:19px;border-radius:14px}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px;box-shadow:0 3px 0 #1f5f9e}
.btn.sm.gray{box-shadow:0 3px 0 #8ea3b6}
.btn.sm.y{box-shadow:0 3px 0 #c98800}
.btn.sm.p{box-shadow:0 3px 0 #d13d79}
.btn.sm.g{box-shadow:0 3px 0 #37962b}
.inp{padding:10px 12px;border:2px solid #8fc0e4;border-radius:10px;background:#fff;outline:none;width:100%}

#login{display:none;height:100%;place-items:center;place-content:center;overflow:auto;padding:6px 0}

.logo{font-size:52px;font-weight:900;letter-spacing:-.05em;line-height:1;

    -4px 0 0 #14406e, 4px 0 0 #14406e, 0 -4px 0 #14406e, 0 4px 0 #14406e,
    0 7px 0 #0f3a66, 0 10px 0 #0b2d51}
.logo small{display:block;font-size:15px;font-weight:800;letter-spacing:0;
  color:#fff;margin-top:12px;
  text-shadow:-2px -2px 0 #14406e,2px -2px 0 #14406e,-2px 2px 0 #14406e,2px 2px 0 #14406e,0 4px 0 #0f3a66}

/* ── 위쪽 띠 ── */
.top{position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;
  gap:9px;padding:0 12px;color:#fff;z-index:5;
  background:linear-gradient(#5cb0f2 0%,#2f83d4 42%,#1f66b4 58%,#17538f 100%);

.icb{width:36px;height:36px;flex:none;border-radius:50%;font-size:17px;display:grid;place-items:center;
  background:linear-gradient(#a8dcff 0%,#5aa8f0 48%,#2f7fd0 100%);
  border:2px solid #123f6e;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #123f6e;
  transition:transform .06s,box-shadow .06s}
.icb:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 0 #123f6e}
.icb.y{background:linear-gradient(#ffe9a0 0%,#ffc93e 48%,#ffab14 100%);color:#6b3d00}
/* 아래 알림 띠 — 큐플레이 하단 바 자리 */
.ticker{height:30px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;

.ticker em{font-style:normal;color:#ffd24a;font-weight:900}
.top .nm{font-weight:900;font-size:17px;letter-spacing:-.02em;text-shadow:0 1px 0 #123}
.gold{display:flex;align-items:center;gap:5px;background:#0e3f70;border:2px solid #ffd24a;

.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc32b 60%,#e09400);
  border:1px solid #b57700;display:inline-block;flex:none}

/* ── 홈 ── */
.homewrap{position:absolute;inset:54px 0 0 0;display:grid;
  grid-template-columns:300px 1fr;gap:14px;padding:14px}
.mecard{display:flex;flex-direction:column;overflow:hidden}
.mestage{flex:1;display:grid;place-items:center;padding:6px;
  background:linear-gradient(#cdeaff,#a5d4f6);position:relative}
.mestage svg{border-radius:12px;overflow:hidden}
.menu{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.mtile{border:3px solid #1e5c9e;border-radius:18px;padding:16px 18px;text-align:left;
  background:linear-gradient(#ffffff 0%,#eaf5ff 44%,#d3e9fd 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),
             inset 0 -4px 0 rgba(122,176,220,.35), 0 5px 0 #164a80;
  transition:transform .07s,box-shadow .07s;min-height:118px;position:relative;overflow:hidden}
.mtile::after{content:'';position:absolute;right:-30px;top:-30px;width:96px;height:96px;
  border-radius:50%;background:rgba(255,255,255,.5)}
.mtile:active{transform:translateY(4px);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -4px 0 rgba(122,176,220,.35),0 1px 0 #164a80}
.mtile{display:flex;flex-direction:column;justify-content:center}
.mtile h3{margin:0 0 4px;font-size:23px;letter-spacing:-.03em;color:#12467e}
.mtile p{margin:0;font-size:13px;color:#4a6b8a;line-height:1.45}
.mtile .ic{font-size:30px;line-height:1;margin-bottom:9px;display:grid;place-items:center;
  width:56px;height:56px;border-radius:50%;position:relative;z-index:1;
  background:linear-gradient(#ffffff,#cfe6fb);border:3px solid #7fb4dd;
  box-shadow:inset 0 2px 0 #fff,0 3px 0 #9dc0dd}
.mtile h3,.mtile p{position:relative;z-index:1}
.mtile.lock{filter:grayscale(.7);opacity:.65}

/* ── 상점 ── */
.shopwrap{position:absolute;inset:54px 0 0 0;display:grid;
  grid-template-columns:260px 1fr 300px;gap:12px;padding:12px}
.tabs{display:flex;gap:4px;padding:8px 8px 0;flex-wrap:wrap}
.tab{padding:6px 9px;border-radius:9px 9px 0 0;font-weight:800;font-size:12px;white-space:nowrap;
  background:#c3ddf2;color:#2b5b85;box-shadow:inset 0 -3px 0 #9dbcd6}
.tab.on{background:#fff;color:#12467e;box-shadow:inset 0 -3px 0 #ffb724}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:9px;padding:10px;overflow-y:auto;align-content:start}
.itm{border:2px solid #9dc6e6;border-radius:12px;background:#fff;padding:5px 4px 4px;
  text-align:center;position:relative;transition:transform .07s}
.itm:active{transform:scale(.95)}
.itm.on{border-color:#ff9a24;background:#fff6e6;box-shadow:0 0 0 2px #ffd08a}
.itm.own{border-color:#57bb45}
.itm .thumb{height:64px;display:grid;place-items:center;overflow:hidden}
.itm .nm2{font-size:11px;font-weight:700;color:#2b5b85;line-height:1.2;height:26px;

.itm .pr{font-size:11px;font-weight:900;color:#b57700}
.itm .pr.free{color:#3d8f2e}
.itm .badge{position:absolute;top:-6px;right:-5px;font-size:10px;font-weight:900;

.itm .badge.eq{background:#ff9a24}
.rare1{--rc:#9dc6e6} .rare2{--rc:#7a5cd6} .rare3{--rc:#ff9a24}
.itm.r2{border-color:#a98ce8;background:#faf6ff}
.itm.r3{border-color:#ffb35c;background:#fff8ee}

/* ── 알림/토스트 ── */
#toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:60;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tt{background:#0e3f70;color:#fff;font-weight:800;padding:9px 18px;border-radius:20px;
  border:2px solid #7fd0ff;animation:tin .2s}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
#modal{position:fixed;inset:0;background:rgba(8,30,55,.55);display:none;place-items:center;z-index:70}
#modal.on{display:grid}
.mbox{width:min(560px,92vw);max-height:88vh;overflow:auto;padding:0}
.mbody{padding:16px}

/* ── 순위표 ── */
.rank{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:11px;
  background:#fff;border:2px solid #cfe4f5;margin-bottom:6px}
.rank .no{width:26px;height:26px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-weight:900;font-size:13px;background:#c3ddf2;color:#2b5b85}
.rank.t1 .no{background:linear-gradient(#ffe27a,#ffb724);color:#6b3d00}
.rank.t2 .no{background:linear-gradient(#eef3f7,#c3ced8);color:#4a5b6b}
.rank.t3 .no{background:linear-gradient(#f0c08a,#d1934c);color:#5b3410}
.rank .rn{flex:1;font-weight:800;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rs{font-weight:900;color:#12467e}
.rank.me{background:#fff6e6;border-color:#ffb724}

/* ── 아바타가 살아 있게 ──────────────────────────────────────
   전부 transform 만 쓴다. 브라우저가 GPU 로 처리해서 크롬북에서도 싸다.
   박자는 아바타마다 다르게 준다(animation-delay). 다 같이 깜빡이면 기계 같다. */
@keyframes qz-blink{0%,91%,100%{transform:scaleY(0)} 93.5%,95.5%{transform:scaleY(1)}}
.blink .lid{transform-box:fill-box;transform-origin:50% 0;
  animation:qz-blink 5.4s ease-in-out infinite}
@keyframes qz-bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-2.5px)}}
.bob{animation:qz-bob 3.6s ease-in-out infinite}
@keyframes qz-hop{0%,64%,100%{transform:translateY(0) scaleY(1)}
  74%{transform:translateY(-8px) scaleY(1.05)}
  84%{transform:translateY(0) scaleY(.93)}
  90%{transform:translateY(0) scaleY(1)}}
.petbox{transform-box:fill-box;transform-origin:50% 100%;
  animation:qz-hop 2.9s ease-in-out infinite}
@keyframes qz-wag{0%,100%{transform:rotate(-9deg)} 50%{transform:rotate(9deg)}}
.petbox .wag{transform-box:fill-box;transform-origin:50% 100%;
  animation:qz-wag 1.05s ease-in-out infinite}
/* 배경 속 움직이는 것들 */
@keyframes qz-drift{from{transform:translateX(-26px)}to{transform:translateX(226px)}}
@keyframes qz-fall{from{transform:translateY(-40px)}to{transform:translateY(330px)}}
@keyframes qz-twk{0%,100%{opacity:.35;transform:scale(.85)} 50%{opacity:1;transform:scale(1.15)}}
@keyframes qz-wave{0%,100%{transform:translateX(0)} 50%{transform:translateX(10px)}}
@keyframes qz-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes qz-rise{from{transform:translateY(40px);opacity:0}
  20%{opacity:.9} to{transform:translateY(-260px);opacity:0}}
@keyframes qz-swing{0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)}}
.bgmove .bgdrift{animation:qz-drift 22s linear infinite}
.bgmove .bgfall {animation:qz-fall 7s linear infinite}
.bgmove .bgtwk{transform-box:fill-box;transform-origin:50% 50%;animation:qz-twk 2.6s ease-in-out infinite}
.bgmove .bgwave{animation:qz-wave 4s ease-in-out infinite}
.bgmove .bgspin{transform-box:fill-box;transform-origin:50% 50%;animation:qz-spin 9s linear infinite}
.bgmove .bgrise{animation:qz-rise 6s linear infinite}
.bgmove .bgswing{transform-box:fill-box;transform-origin:50% 0;animation:qz-swing 3.4s ease-in-out infinite}

/* ── 패션왕 대회 ── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:10px;
  padding:10px;overflow-y:auto;align-content:start}

  transition:transform .08s}

/* ═══════════════════════════════════════════════════════════════════

const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 4자리 비번을 그대로 저장하지 않으려고 쓰는 아주 간단한 섞기.
   ※ 진짜 암호학적 보호가 아니다. 교실에서 옆자리 애가 값만 보고
     바로 알아채지 못하게 하는 정도다. 자세한 건 사용법 문서를 봐라. */
function pinHash(id, pin){
  let h = 2166136261 >>> 0; const s = 'qz1|'+id+'|'+pin;
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  let g = h; for(let i=0;i<3;i++){ g ^= g<<13; g>>>=0; g ^= g>>17; g ^= g<<5; g>>>=0; }
  return (h.toString(36)+'-'+g.toString(36));
}
/* 파이어베이스 키에 못 쓰는 글자( . $ # [ ] / )를 피해 아이디를 키로 만든다 */
function idKey(name){
  return String(name).trim().replace(/[.$#\[\]\/\s]/g,'_').slice(0,24);
}

/* ═══════════════════════════════════════════════════════════════════
   2) 아바타 — 코드로 그리는 2등신 캐릭터
      그림 파일이 하나도 없다. 모양 함수 × 색 = 아이템 수백 종.
   ═══════════════════════════════════════════════════════════════════ */
const AVW = 200, AVH = 300;

function sh(hex, a){            // a: 양수면 밝게, 음수면 어둡게
  const n = parseInt(hex.slice(1),16);
  let r = n>>16&255, g = n>>8&255, b = n&255;
  if(a>=0){ r+=(255-r)*a; g+=(255-g)*a; b+=(255-b)*a; }
  else    { r*=1+a; g*=1+a; b*=1+a; }
  const h2 = v => Math.round(clamp(v,0,255)).toString(16).padStart(2,'0');
  return '#'+h2(r)+h2(g)+h2(b);
}
const E = (cx,cy,rx,ry,f,x)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}"${x||''}/>`;

const PAL = {

/* ── 몸 ─────────────────────────────────────────────────────
   좌표: 머리중심(100,96) / 몸통 x72~128, y148~231 / 다리 y224~264

     '옷 입은 사람'으로 보인다. 붙어 있으면 한 덩어리처럼 뭉툭해진다.
     그래서 상의 14종도 전부 이 팔 위치에 맞춘 공용 소매를 쓴다. */
function drawBody(sk){
  const d = sh(sk,-.14), l = sh(sk,.35);
  return ''
  + RC(88,126,24,32,10,d)                                          // 목
  + PA('M100 148 C85 148 76 155 74 166 C72 180 72 196 73 210'
     + ' C74 223 79 231 100 231 C121 231 126 223 127 210'
     + ' C128 196 128 180 126 166 C124 155 115 148 100 148 Z', sk)  // 몸통
  + PA('M80 154 C69 158 61 174 56 194 C54 204 53 212 54 218'
     + ' C56 224 65 224 67 217 C69 206 73 188 79 174 C82 167 85 161 87 157 Z', sk)   // 왼팔
  + PA('M120 154 C131 158 139 174 144 194 C146 204 147 212 146 218'
     + ' C144 224 135 224 133 217 C131 206 127 188 121 174 C118 167 115 161 113 157 Z', sk) // 오른팔
  + C(60,222,10,sk) + C(140,222,10,sk)                             // 손
  + PA('M82 224 L82 258 C82 264 96 264 96 258 L98 224 Z', sk)      // 왼다리
  + PA('M118 224 L118 258 C118 264 104 264 104 258 L102 224 Z', sk)// 오른다리
  + E(100,229,26,5,d,' opacity=".5"');                             // 허리 그늘
}

/* ── 옷 공용 부품 ────────────────────────────────────────────
   몸통 세 가지 + 소매 네 가지. 상의 14종이 전부 이걸 쓴다.
   덕분에 팔 위치를 한 번 바꾸면 옷 14벌이 같이 따라온다. */
const T_BASE = 'M100 146 C84 146 74 154 72 166 C70 180 70 197 71 211'
             + ' C72 225 78 233 100 233 C122 233 128 225 129 211'
             + ' C130 197 130 180 128 166 C126 154 116 146 100 146 Z';

             + ' C72 234 78 242 100 242 C122 242 128 234 129 218'
             + ' C130 202 130 182 128 166 C126 154 116 146 100 146 Z';
const T_FLARE= 'M100 146 C84 146 74 154 72 166 C70 178 69 190 66 204'
             + ' L58 250 C74 258 126 258 142 250 L134 204'
             + ' C131 190 130 178 128 166 C126 154 116 146 100 146 Z';
const SLV = {
  /* 소매는 어깨 '안쪽'(x90)에서 시작해야 몸통에 붙어 보인다.
     바깥(x82)에서 시작하면 어깨에 틈이 생겨 소매가 둥둥 뜬다 */
  s:['M90 150 C75 154 62 172 57 191 C61 198 74 200 78 192 C80 180 85 164 93 155 Z',
     'M110 150 C125 154 138 172 143 191 C139 198 126 200 122 192 C120 180 115 164 107 155 Z'],
  l:['M90 150 C75 154 61 174 55 198 C53 208 52 215 54 221 C58 227 69 226 71 219'
     + ' C73 206 77 187 83 172 C87 162 92 156 96 152 Z',
     'M110 150 C125 154 139 174 145 198 C147 208 148 215 146 221 C142 227 131 226 129 219'
     + ' C127 206 123 187 117 172 C113 162 108 156 104 152 Z'],
  p:['M91 149 C74 152 62 166 62 181 C69 190 84 190 88 181 C88 168 90 156 95 151 Z',
     'M109 149 C126 152 138 166 138 181 C131 190 116 190 112 181 C112 168 110 156 105 151 Z'],
  w:['M90 149 C72 154 56 176 49 201 C60 212 79 210 83 197 C84 180 88 160 95 151 Z',
     'M110 149 C128 154 144 176 151 201 C140 212 121 210 117 197 C116 180 112 160 105 151 Z']

/* ── 눈 ──────────────────────────────────────────────────────
   홍채를 겹쳐 그리고, 윗속눈썹을 두껍게 얹고, 반짝이를 두 개 넣는다.
   이 세 가지가 빠지면 인형 눈처럼 밋밋해진다. */
function iris(x, c, rx, ry){
  const id = sh(c,-.5), il = sh(c,.22), ib = sh(c,-.2);
  /* 흰자를 조금만 남기고 홍채가 눈을 거의 채우게 한다.
     흰자가 넓으면 인형 눈처럼 보인다 */
  return E(x,105,rx,ry,'#fff')
   + E(x,106,rx*.95,ry*.94,il)                       // 홍채 바깥(밝은 테)
   + E(x,107,rx*.82,ry*.82,c)                        // 홍채
   + E(x,110,rx*.62,ry*.52,ib)                       // 아래쪽 그늘 — 깊어 보이게
   + E(x,108,rx*.40,ry*.42,'#17120e')                // 눈동자
   + E(x,106,rx*.95,ry*.94,'none',` stroke="${id}" stroke-width="2.2"`)
   + C(x-rx*.30,100,rx*.30,'#fff')                   // 큰 반짝
   + C(x+rx*.34,111,rx*.15,'#fff',' opacity=".9"')   // 작은 반짝
   + E(x,115,rx*.40,ry*.11,'#fff',' opacity=".3"');  // 아랫눈꺼풀 빛
}

  w = w||4.6;
  return LN(`M${x-15} ${y+9} Q${x} ${y-1} ${x+15} ${y+9}`, '#4a3428', w)

function drawFace(av){
  const sk = PAL.skin[av.sk||0][0];
  const ec = PAL.eye[av.ec||0][0];
  const eye = EYES[av.eyes] || EYES.round;
  SEXM = av.sex === 'm';
  /* 눈썹 색은 머리 색을 따라간다 — 안 그러면 가발 쓴 것처럼 따로 논다 */
  let bc = '#6b4a33';
  if(av.hair){ const ci = +String(av.hair).split(':')[1];
    if(PAL.hair[ci]) bc = sh(PAL.hair[ci][0], -.18); }
  const brow = SEXM
    ? PA('M55 88 C58 78 76 74 92 80 L91 86 C77 81 61 84 57 91 Z', bc)
      + PA('M145 88 C142 78 124 74 108 80 L109 86 C123 81 139 84 143 91 Z', bc)
    : LN('M59 80 Q73 70 89 76', bc, 4.4) + LN('M141 80 Q127 70 111 76', bc, 4.4);
  const eyes = SEXM
    ? `<g transform="translate(100 109) scale(.80 .76) translate(-100 -109)">${eye[1](ec)}</g>`
    : eye[1](ec);
  const blush = SEXM
    ? E(58,127,9.5,4.6,'#ff9db4',' opacity=".26"') + E(142,127,9.5,4.6,'#ff9db4',' opacity=".26"')
    : E(60,126,11.5,6.5,'#ff9db4',' opacity=".5"') + E(140,126,11.5,6.5,'#ff9db4',' opacity=".5"');
  const mouth = SEXM
    ? PA('M87 133 C92 132 96 134 100 134 C104 134 108 132 113 133'
       + ' C111 140 89 140 87 133 Z','#bd554e')
      + LN('M87 133 C92 132 96 134 100 134 C104 134 108 132 113 133','#8f342f',2)
    : PA('M88 132 C93 131 96 136 100 136 C104 136 107 131 112 132'
       + ' C110 145 90 145 88 132 Z','#c0504a')
      + PA('M93 134 C96 137 104 137 107 134 C104 132.5 96 132.5 93 134 Z','#fff',' opacity=".8"')
      + LN('M90 132 C94 131 97 135 100 135 C103 135 106 131 110 132','#8f342f',2);
  /* 눈 깜빡임용 눈꺼풀 — 살색 네모를 눈 위에 덮었다 폈다 한다 */
  const lid = `<g class="blink">`
    + `<rect class="lid" x="52" y="82" width="44" height="44" fill="${sk}" transform="scale(1 0)"/>`
    + `<rect class="lid" x="104" y="82" width="44" height="44" fill="${sk}" transform="scale(1 0)"/></g>`;
  return brow + eyes + blush
  + LN('M97 119 Q101 122 99 125', sh(sk,-.28), 2.4)
  + mouth + lid;
}

function itemForSex(it, sex){
  if(!it)return false;
  sex=avatarSex(sex);
  if(it.cat==='hair')return AVATAR_HAIR[sex].includes(HAIR_ALIAS[it.shape]||it.shape);
  if(it.cat==='top'||it.cat==='bottom')return AVATAR_CLOTHES[sex][it.cat].includes(it.shape);
  if(it.cat==='outfit')return !!OUTFIT_PARTS[it.shape]?.[sex];
  return !(it.cat==='shoes'&&sex==='m'&&it.shape==='ballet');
}
function fixedColour(cat,shape,sex){
  sex=avatarSex(sex);
  if(cat==='hair')return 1;
  if(cat==='expression'||cat==='effect')return 0;
  if(cat==='outfit')return shape==='hanbok'?(sex==='m'?5:7):({dress:7,robe:6,overall:5,space:8}[shape]??0);
  if(cat==='top'||cat==='bottom')return CURATED_COLOURS[sex][cat][shape]??0;
  if(cat==='ear'||cat==='neck'||cat==='frame')return 0;
  if(cat==='face')return CURATED_COLOURS.face[shape]??1;
  return CURATED_COLOURS[cat]?.[shape]??5;
}
function hasStyle(id,owned,includeStarter=true){
  const [cat,shape]=String(id||'').split(':'),prefix=cat+':'+shape+':';
  const keys=Object.keys(owned||{}).filter(key=>owned[key]);
  if(includeStarter)keys.push(...STARTER);
  if(keys.some(key=>key.startsWith(prefix)))return true;
  // Previously purchased top-only dresses/overalls become the whole product
  // without deleting ownership or charging for its new catalogue category.
  return cat==='outfit'&&keys.some(key=>key.startsWith('top:'+shape+':')||shape==='hanbok'&&key.startsWith('bottom:hanbok:'));
}
function curatedItem(cat,shape,sex){

  if(!itemForSex(source,sex))return null;
  const names=avatarSex(sex)==='m'?{top:{tee:'도토리 반팔',hood:'후드 집업',shirt:'단정한 셔츠',vest:'클래식 조끼',knit:'포근한 니트'},bottom:{shorts:'편한 반바지'}}:{};

}

function applyCatalogItem(value,it){

    av.outfit=it.shape+':'+it.ci;

  }else{
    if((it.cat==='top'||it.cat==='bottom')&&av.outfit){
      const sex=avatarSex(av.sex);
      // A separated garment replaces the whole suit; no hidden dress remains.
      av.outfit='';av.top=sex==='m'?'tee:5':'tee:3';av.bottom=sex==='m'?'jeans:5':'shorts:5';
    }

function avatarForSex(value, wantSex, owned){
  const av=Object.assign({},value||{}), sex=avatarSex(wantSex==null?av.sex:wantSex);
  av.sex=sex;av.ec=0;av.sk=Number.isFinite(Number(av.sk))?Math.round(clamp(Number(av.sk),0,PAL.skin.length-1)):0;
  const previousTop=String(av.top||'').split(':')[0];
  let whole=String(av.outfit||'').split(':')[0];
  if(!whole&&OUTFIT_PARTS[previousTop]?.[sex])whole=previousTop;
  for(const c of CATS){

    const raw=String(av[c.k]||''),shape=c.k==='hair'?(HAIR_ALIAS[raw.split(':')[0]]||raw.split(':')[0]):raw.split(':')[0];

  if(!val) return '';

  if(window.QPAvatar && window.QPAvatar.render) return window.QPAvatar.render(av||newAvatar(), size, lod==null?2:lod);
  av = av || newAvatar(); lod = lod==null?2:lod;
  const key = avKey(av)+'#'+size+'#'+lod;
  const hit = avCache.get(key); if(hit) return hit;
  const sk = (PAL.skin[av.sk] || PAL.skin[0])[0];
  const mm = av.sex === 'm';
  /* 아바타마다 깜빡이는 박자를 다르게 — 다 같이 깜빡이면 기계 같다 */
  let hsh = 0; for(let i=0;i<key.length;i++){ hsh = (hsh*31 + key.charCodeAt(i)) >>> 0; }
  const d1 = (hsh % 40) / 10, d2 = ((hsh>>>5) % 30) / 10;
  let s = '';
  if(lod >= 2) s += lod>=3 ? `<g class="bgmove">`+part('bg', av.bg)+`</g>`
                           : part('bg', av.bg);   // 배경은 선을 안 두른다
  s += SHADOW;
  s += `<g class="${lod>=3?'bob':''}" style="animation-delay:${d2}s">`;
  if(lod >= 2) s += ink(part('back', av.back), 2.8);
  s += `<g${headT(mm)}>` + ink(part('hair', av.hair, 'b'), 3.2) + `</g>`;
  s += `<g${bodyT(mm)}>` + ink(drawBody(sk), 3)
     + ink(part('bottom', av.bottom), 2.8)
     + ink(part('shoes', av.shoes), 2.8)
     + ink(part('top', av.top), 2.8)
     + ink(part('neck', av.neck), 2.2) + `</g>`;
  s += `<g${headT(mm)}>`
     + ink(drawHead(sk), 3)
     + drawFace(av)                       /* 얼굴은 선이 이미 들어 있어서 안 두른다 */
     + ink(part('face', av.face), 2)
     + ink(part('glass', av.glass), 2.2)
     + `</g><g${headT(mm)}>` + ink(part('hair', av.hair, 'f'), 3.2)
     + `</g><g${headT(mm)}>`
     + ink(part('ear', av.ear), 2.2)
     + ink(part('hat', av.hat), 2.8)
     + `</g>`;
  s += `</g>`;
  if(lod >= 2 && av.pet) s += `<g class="${lod>=3?'petbox':''}" style="animation-delay:${d1}s">`
                  + ink(part('pet', av.pet), 2.8) + `</g>`;
  const svg = `<svg viewBox="0 0 ${AVW} ${AVH}" width="${size*AVW/AVH}" height="${size}" `
    + `shape-rendering="geometricPrecision" style="display:block">${s}</svg>`;
  if(avCache.size > 260) avCache.clear();
  avCache.set(key, svg);
  return svg;
}

/* ═══════════════════════════════════════════════════════════════════
   2.5) 소리 — 파일을 하나도 안 쓴다
   효과음과 배경음악을 따로 조절하고 이 브라우저에 저장한다.
   화면을 누르거나 키보드를 사용하면 브라우저가 합성음을 재생한다.
   ═══════════════════════════════════════════════════════════════════ */
const SND = {
  ctx:null, master:null, fxGain:null, musicGain:null,
  prefs:(()=>{try{
    const p=JSON.parse(localStorage.getItem('qz_audio')||'null');
    return p||{effects:JSON.parse(localStorage.getItem('qz_snd')||'true'),music:JSON.parse(localStorage.getItem('qz_bgm')||'true')};
  }catch(e){return {};}})(),
  on:true, bgm:true, fxVolume:60, musicVolume:35,
  timer:null, next:0, step:0, hidden:document.hidden, unlocked:false, resuming:null, suspending:null,
  voices:{fx:new Set(),music:new Set()},gameEvents:new Set(),fxSequence:0,

  setup(){
    const p=this.prefs;
    this.on=p.effects!==false;this.bgm=p.music!==false;
    this.fxVolume=Number.isFinite(p.fxVolume)?clamp(p.fxVolume,0,100):60;
    this.musicVolume=Number.isFinite(p.musicVolume)?clamp(p.musicVolume,0,100):35;
  },
  persist(){
    try{
      localStorage.setItem('qz_audio',JSON.stringify({effects:this.on,music:this.bgm,fxVolume:this.fxVolume,musicVolume:this.musicVolume}));
      localStorage.setItem('qz_snd',JSON.stringify(this.on));localStorage.setItem('qz_bgm',JSON.stringify(this.bgm));
    }catch(e){}
  },
  async unlock(){
    this.unlocked=true;
    if(this.hidden)return false;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return false;
    try{
      if(!this.ctx || this.ctx.state==='closed'){
        this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=.7;this.master.connect(this.ctx.destination);
        this.fxGain=this.ctx.createGain();this.fxGain.connect(this.master);
        this.musicGain=this.ctx.createGain();this.musicGain.connect(this.master);
        this.applyGains();
        this.ctx.onstatechange=()=>{if(this.ctx.state==='running'&&!this.hidden)this.ensureMusic();else this.stopMusic();this.paintControls();};
      }
      if(this.suspending)await this.suspending;
      if(this.hidden)return false;
      if(this.ctx.state==='suspended'){
        if(!this.resuming)this.resuming=this.ctx.resume().finally(()=>{this.resuming=null;});
        await this.resuming;
      }
      if(this.hidden){if(this.ctx.state==='running')await this.ctx.suspend();return false;}
      this.ensureMusic();this.paintControls();return this.ctx.state==='running';
    }catch(e){ return false; }
  },
  applyGains(){
    if(this.fxGain)this.fxGain.gain.value=this.on?this.fxVolume/100*.65:0;
    if(this.musicGain)this.musicGain.gain.value=this.bgm?this.musicVolume/100*.28:0;
  },
  keepVoice(source,nodes,bus){
    const group=this.voices[bus];group.add(source);
    source.onended=()=>{group.delete(source);nodes.forEach(node=>{try{node.disconnect();}catch(e){}});};
  },
  stopVoices(bus){
    this.voices[bus].forEach(source=>{try{source.stop();}catch(e){}try{source.disconnect();}catch(e){}});
    this.voices[bus].clear();
  },
  note(freq,t,dur,type,vol,bus='fx'){
    if(!this.ctx || this.ctx.state!=='running' || this.hidden || (bus==='fx'?!this.on||!this.fxVolume:!this.bgm||!this.musicVolume))return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    t=Math.max(t,c.currentTime+.004);
    o.type = type||'square'; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol||0.2, t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g);g.connect(bus==='music'?this.musicGain:this.fxGain);
    this.keepVoice(o,[o,g],bus);
    o.start(t); o.stop(t+dur+0.02);
  },
  noise(t, dur, vol){
    if(!this.ctx || this.ctx.state!=='running' || this.hidden || !this.bgm || !this.musicVolume)return;
    const c = this.ctx, n = Math.floor(c.sampleRate*dur);
    const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(); src.buffer = buf;
    const g = c.createGain(); g.gain.value = vol||0.06;
    const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=4000;
    src.connect(f); f.connect(g); g.connect(this.musicGain);
    this.keepVoice(src,[src,f,g],'music');src.start(Math.max(t,c.currentTime+.004));
  },
  /* 효과음 */
  seq(list, type, vol){
    if(!this.ctx || this.ctx.state!=='running' || this.hidden || !this.on)return;
    this.fxSequence++;
    const t0 = this.ctx.currentTime + 0.01;
    list.forEach(v=> this.note(v[0], t0+v[1], v[2], type, vol));
  },
  click(){ this.seq([[1175,0,0.045],[1760,0.028,0.06]], 'triangle', 0.22); },
  pick(){  this.seq([[660,0,0.05],[990,0.05,0.07]], 'triangle', 0.12); },
  ok(){    this.seq([[784,0,0.09],[988,0.08,0.09],[1319,0.16,0.20]], 'triangle', 0.18); },
  no(){    this.seq([[311,0,0.13],[233,0.12,0.22]], 'triangle', 0.15); },
  coin(){  this.seq([[1319,0,0.05],[1976,0.05,0.14]], 'square', 0.13); },
  buy(){   this.seq([[523,0,0.06],[659,0.06,0.06],[784,0.12,0.06],[1047,0.18,0.16]],'triangle',0.16); },
  tick(){  this.seq([[1200,0,0.03]], 'square', 0.07); },
  hurry(){ this.seq([[1400,0,0.04],[1400,0.1,0.04]], 'square', 0.10); },
  fanfare(){ this.seq([[523,0,0.12],[659,0.11,0.12],[784,0.22,0.12],
                       [1047,0.33,0.30],[784,0.33,0.30],[1319,0.55,0.45]], 'square', 0.17); },
  sad(){   this.seq([[440,0,0.18],[392,0.17,0.18],[330,0.34,0.34]], 'triangle', 0.14); },
  start(){ this.seq([[523,0,0.10],[784,0.12,0.10],[1047,0.24,0.22]], 'square', 0.16); },
  gameState(meta){
    if(!meta)return;
    const event=meta.phase==='end'?'end':meta.phase==='ask'&&(meta.mode==='cross'||meta.qi===0)?'start':null;
    if(!event)return;
    const key=meta.session+'/'+event;if(this.gameEvents.has(key))return;
    if(this.gameEvents.size>80)this.gameEvents.clear();this.gameEvents.add(key);
    if(event==='start')this.start();else this.fanfare();
  },

  /* 직접 만든 멜로디와 부드러운 베이스 */
  TUNE: [
    /* [음높이(반음), 길이] 0 = 쉼 */
    [72,1],[76,1],[79,1],[76,1], [81,1],[79,1],[76,1],[72,1],
    [74,1],[77,1],[81,1],[77,1], [79,1],[77,1],[74,2],[0,0],
    [72,1],[76,1],[79,1],[84,1], [83,1],[79,1],[76,1],[72,1],
    [74,1],[71,1],[74,1],[77,1], [76,2],[0,0],[72,2],[0,0]
  ],
  BASS: [48,48,53,53,55,55,48,48, 48,48,53,53,55,55,48,48,
         45,45,50,50,52,52,45,45, 48,48,53,53,55,55,48,48],
  hz(m){ return 440 * Math.pow(2, (m-69)/12); },
  stopMusic(){
    clearInterval(this.timer);this.timer=null;this.next=0;this.stopVoices('music');
  },
  ensureMusic(){
    if(!this.ctx || this.ctx.state!=='running' || this.hidden || !this.bgm || !this.musicVolume){this.stopMusic();return;}
    if(this.timer)return;
    this.next=this.ctx.currentTime+.08;
    const SPB=.28;
    this.timer = setInterval(()=>{
      if(!this.ctx || this.ctx.state!=='running' || this.hidden || !this.bgm || !this.musicVolume){this.stopMusic();return;}
      const now=this.ctx.currentTime;
      if(this.next<now-.05)this.next=now+.03;
      let scheduled=0;
      while(this.next<now+.18 && scheduled++<4){
        const i = this.step % this.TUNE.length;
        const n = this.TUNE[i];
        if(n[0])this.note(this.hz(n[0]),this.next,SPB*n[1]*.78,'triangle',.18,'music');
        const b = this.BASS[i % this.BASS.length];
        if(i%2===0)this.note(this.hz(b),this.next,SPB*1.5,'sine',.24,'music');
        if(i%4===3)this.noise(this.next,.025,.018);
        this.next+=SPB*Math.max(1,n[1]);
        this.step++;
      }
    },60);
  },
  music(go){
    this.bgm=!!go;this.persist();this.applyGains();this.ensureMusic();this.paintControls();
  },
  setOn(v){
    this.on=!!v;if(!this.on)this.stopVoices('fx');this.persist();this.applyGains();this.paintControls();
  },
  volume(bus,v){
    this[bus==='music'?'musicVolume':'fxVolume']=clamp(Number(v)||0,0,100);
    if(bus==='fx'&&!this.fxVolume)this.stopVoices('fx');
    this.persist();this.applyGains();this.ensureMusic();this.paintControls();
  },
  visibility(){
    this.hidden=document.hidden;
    if(this.hidden){this.stopMusic();this.stopVoices('fx');if(this.ctx&&this.ctx.state==='running'&&!this.suspending)this.suspending=this.ctx.suspend().catch(()=>{}).finally(()=>{this.suspending=null;});}
    else if(this.unlocked)this.unlock();
    this.paintControls();
  },
  paintControls(){
    const icon=el('tbSnd');if(icon){icon.innerHTML=uiIcon((this.on&&this.fxVolume)||(this.bgm&&this.musicVolume)?'sound':'mute')+'<span class="qp-tool-label">소리</span>';icon.setAttribute('aria-label','소리 설정');}
    [['sndFX',this.on],['sndMusic',this.bgm]].forEach(([id,on])=>{const b=el(id);if(b){b.textContent=on?'켜짐':'꺼짐';b.setAttribute('aria-pressed',String(on));b.classList.toggle('p',on);b.classList.toggle('gray',!on);}});
    [['sndFXVolume','sndFXValue',this.fxVolume],['sndMusicVolume','sndMusicValue',this.musicVolume]].forEach(([id,out,v])=>{if(el(id))el(id).value=v;if(el(out))el(out).textContent=v+'%';});
    if(el('sndState'))el('sndState').textContent=this.ctx&&this.ctx.state==='running'?'설정은 다음에도 그대로예요.':'화면을 누르거나 키보드를 사용하면 소리가 준비돼요.';
  }
};
SND.setup();
document.addEventListener('pointerdown',()=>SND.unlock(),{capture:true,passive:true});
document.addEventListener('keydown',e=>{if(!e.repeat)SND.unlock();},true);
document.addEventListener('visibilitychange',()=>SND.visibility());
/* 눌림은 즉시 표시하고, 같은 동작의 선택/정답 소리와 클릭음을 겹치지 않는다. */
(()=>{
  const selector='button,[role="button"],.mtile,.itm,.setrow,.fcard.pick';
  const pressed=new Set(),states=new WeakMap();
  const control=target=>{
    const b=target?.closest?.(selector);
    return b&&!b.disabled&&!b.closest('[aria-disabled="true"],.lock')?b:null;
  };
  const press=b=>{
    let state=states.get(b);
    if(!state){state={timer:null,at:0};states.set(b,state);}
    clearTimeout(state.timer);state.at=performance.now();
    b.classList.add('qp-pressed');pressed.add(b);
  };
  const release=b=>{
    const state=states.get(b);if(!state)return;
    clearTimeout(state.timer);
    state.timer=setTimeout(()=>{b.classList.remove('qp-pressed');pressed.delete(b);},Math.max(0,90-(performance.now()-state.at)));
  };
  const releaseAll=()=>pressed.forEach(release);
  document.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;const b=control(e.target);if(b)press(b);
  },true);
  document.addEventListener('pointerup',releaseAll,true);
  document.addEventListener('pointercancel',releaseAll,true);
  document.addEventListener('keydown',e=>{
    if(e.repeat||(e.key!=='Enter'&&e.key!==' '))return;
    const b=control(e.target);if(b)press(b);
  },true);
  document.addEventListener('keyup',e=>{if(e.key==='Enter'||e.key===' ')releaseAll();},true);
  window.addEventListener('blur',releaseAll);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)releaseAll();});
  document.addEventListener('click',e=>{
    const b=control(e.target);if(!b)return;
    if(!pressed.has(b)){press(b);release(b);}
    const before=SND.fxSequence;
    setTimeout(()=>{if(SND.fxSequence===before)SND.click();},0);
  },true);
})();

const DBR = 'quiz';

             set(k,v){ try{ localStorage.setItem('qz_'+k, JSON.stringify(v)); }catch(e){} },
             del(k){ try{ localStorage.removeItem('qz_'+k); }catch(e){} } };

const saveQueues = new Map();
function save(patch, now2){
  if(!ME) return Promise.resolve();
  const accountKey=ME.k;
  Object.assign(ME, patch);
  let queue=saveQueues.get(accountKey);
  if(!queue){queue={patch:{},timer:null,inFlight:Promise.resolve()};saveQueues.set(accountKey,queue);}
  Object.assign(queue.patch,JSON.parse(JSON.stringify(patch||{})));
  paintGold();
  if(!FB.ok) return Promise.resolve();
  clearTimeout(queue.timer);
  const flush = ()=>{
    clearTimeout(queue.timer);queue.timer=null;
    const p=queue.patch;queue.patch={};
    if(!Object.keys(p).length) return queue.inFlight;
    queue.inFlight=queue.inFlight.then(()=>uref(accountKey).update(p))
      .catch(e=>toast('저장 실패: '+e.message,3000));
    return queue.inFlight;
  };
  if(now2) return flush();
  queue.timer=setTimeout(flush,500);
  return queue.inFlight;
}

   내 계정을 계속 지켜보다가, 내가 방금 쓴 값이 아니면 그대로 받는다. */
let meWatch = null;
function watchMe(){
  if(meWatch){ meWatch(); meWatch = null; }
  if(!FB.ok || !ME) return;
  const accountKey=ME.k, r = uref(accountKey);
  const cb = r.on('value', sn=>{
    const u = sn.val(); if(!u || !ME || ME.k!==accountKey) return;
    const pending=saveQueues.get(accountKey)&&saveQueues.get(accountKey).patch||{};
    if(pending.gold === undefined && typeof u.gold === 'number' && u.gold !== ME.gold){
      const diff = u.gold - ME.gold;
      ME.gold = u.gold; paintGold();
      if(diff > 0){ toast('선물 도착! +' + diff + '골드 🎁', 2600); SND.coin(); }
    }
      if(pending.av===undefined&&u.av)ME.av=avatarForSex(u.av,null,u.owned);
      if(pending.skinOwned===undefined)Object.assign(ME,skinAccount(u));
      if(u.stat) ME.stat=Object.assign({},u.stat);
      if(u.day && pending.day===undefined) ME.day=Object.assign({},u.day);
      if((u.crown||0) !== (ME.crown||0)) ME.crown = u.crown||0;
  });
  meWatch = ()=> r.off('value', cb);
}
function owns(id){return hasStyle(id,ME&&ME.owned);}
const SKIN_PRICE=100;
const skinPurchaseLocks=new Set();
function canChangeAvatar(){
  if(!ME||!skinPurchaseLocks.has(ME.k))return true;
  toast('피부색을 저장하는 중이에요. 잠시 기다려 주세요.');return false;
}
function skinAccount(user){
  const setup=user.skinSetup!==false,owned=Object.assign({},user.skinOwned||{});
  const tone=Number.isFinite(Number(user.av?.sk))?Math.round(clamp(Number(user.av.sk),0,PAL.skin.length-1)):0;
  if(setup)owned[tone]=1; // Existing accounts keep the skin they already chose.
  return {skinSetup:setup,skinOwned:owned};
}
function skinPurchaseUser(user,tone){
  if(!user||!Number.isInteger(tone)||!PAL.skin[tone])return;
  const skin=skinAccount(user);
  if(!skin.skinSetup){skin.skinSetup=true;skin.skinOwned[tone]=1;}
  else if(!skin.skinOwned[tone]){
    if((Number(user.gold)||0)<SKIN_PRICE)return;
    user.gold=(Number(user.gold)||0)-SKIN_PRICE;skin.skinOwned[tone]=1;
  }
  Object.assign(user,skin);user.av=Object.assign({},user.av,{sk:tone});return user;
}
async function acquireSkin(accountKey,tone){
  if(!ME||ME.k!==accountKey||!canChangeAvatar())return false;
  skinPurchaseLocks.add(accountKey);
  try{
    await save({},true);
    const result=await uref(accountKey).transaction(user=>skinPurchaseUser(user,tone),undefined,false);
    if(!result.committed)return false;
    if(!ME||ME.k!==accountKey)return false;
    const user=result.snapshot.val();ME.gold=user.gold;Object.assign(ME,skinAccount(user));
    ME.av=avatarForSex(user.av,null,user.owned);paintGold();return true;
  }finally{skinPurchaseLocks.delete(accountKey);}
}

/* Friend QUIZQUIZ room rewards (daily cap) merge with purchases on the current account. */
async function recordPracticeAnswer(correct, claimId, accountKey){
  if(!FB.ok || !accountKey) throw new Error('계정 연결을 확인해 주세요');
  const day=today();
  if(ME && ME.k===accountKey) await save({},true);
  const result=await uref(accountKey).transaction(user=>{
    if(!user) return;
    user.practiceClaims=user.practiceClaims||{};
    if(user.practiceClaims[claimId]) return user;
    const currentDay=user.day && user.day.d===day?Object.assign({},user.day):{d:day,g:0};
    const gold=correct?Math.max(0,Math.min(R.practicePerQ,R.practiceCap-(Number(currentDay.g)||0))):0;
    currentDay.g=(Number(currentDay.g)||0)+gold;user.day=currentDay;
    user.gold=(Number(user.gold)||0)+gold;
    user.stat=user.stat||{};user.stat.solved=(user.stat.solved||0)+1;user.stat.correct=(user.stat.correct||0)+(correct?1:0);
    user.practiceClaims[claimId]={gold,correct:!!correct};return user;
  },undefined,false);
  if(!result.committed || !result.snapshot.val()) throw new Error('정답 기록을 저장하지 못했어요');
  const user=result.snapshot.val(),receipt=user.practiceClaims[claimId];
  if(ME && ME.k===accountKey){ME.gold=user.gold;ME.day=user.day;ME.stat=user.stat;paintGold();}
  return receipt;
}

      if(mode==='up'){
        if(u){ msg('<b style="color:#c0392b">그 아이디는 이미 있어요. 다른 이름으로 해 보세요.</b>'); el('lgId').focus({preventScroll:true}); return; }
        if(step===1){ pin2 = pin; pin=''; step=2; dots();
          el('lgLab').textContent = '한 번 더';
          msg('안 잊어버리게 <b>한 번 더</b> 눌러 주세요.'); password.focus({preventScroll:true}); return; }
        if(pinHash(k,pin) !== pinHash(k,pin2)){ pin=''; pin2=''; step=1; dots();
          el('lgLab').textContent='쓸 비밀번호';
          msg('<b style="color:#c0392b">두 번이 서로 달라요. 처음부터 다시.</b>'); password.focus({preventScroll:true}); return; }
        const fresh = { name:raw, pin:pinHash(k,pin), pinView:pin, gold:R.startGold, av:Object.assign(newAvatar(sex),{sk:firstSkin}),skinSetup:true,skinOwned:{[firstSkin]:1},
          owned:{}, stat:{solved:0,correct:0}, day:{d:today(),g:0}, made:now() };
        uref(k).transaction(user=>user?undefined:fresh,undefined,false).then(result=>{if(!result.committed){msg('그 아이디는 이미 있어요. 다른 이름으로 해 보세요.');return;}enter(k,result.snapshot.val());})
          .catch(e=> msg('<b style="color:#c0392b">만들기 실패: '+esc(e.message)+'</b>'));
        return;
      }
      if(!u){ msg('<b style="color:#c0392b">그런 아이디가 없어요. "처음이에요"를 눌러 만들어 주세요.</b>'); el('lgId').focus({preventScroll:true}); return; }
      if(u.pin !== h){ pin=''; dots(); msg('<b style="color:#c0392b">비밀번호가 달라요. 다시 눌러 보세요.</b>'); password.focus({preventScroll:true}); return; }
      if(u.pinView!==pin) uref(k).update({pinView:pin}).catch(()=>{});
      enter(k, u);
    }).catch(e=> msg('<b style="color:#c0392b">연결 실패: '+esc(e.message)+'</b>'));
  };

  function enter(k, u){
    ME = { k, name:u.name||k, gold:u.gold||0, av:avatarForSex(Object.assign(newAvatar(u.av&&u.av.sex), u.av||{}),null,u.owned),
           owned:u.owned||{}, stat:u.stat||{solved:0,correct:0}, crown:u.crown||0,
           day:(u.day && u.day.d===today()) ? u.day : {d:today(), g:0} };
    Object.assign(ME,skinAccount(u));
    if(JSON.stringify(u.skinOwned||{})!==JSON.stringify(ME.skinOwned)||u.skinSetup!==ME.skinSetup)save({skinOwned:ME.skinOwned,skinSetup:ME.skinSetup});
    IS_TEACHER = isAdminLogin(k, u.pin);
    LS.set('login', {k, h:u.pin});
    watchMe();
    if(JSON.stringify(u.av||{})!==JSON.stringify(ME.av))save({av:ME.av});
    if(!ME.day || ME.day.d!==today()) save({day:{d:today(),g:0}});
    entryScreen();
  }

  /* 지난번에 들어왔던 아이디면 바로 들어간다 */
  el('lgId').focus({preventScroll:true});
  const saved = LS.get('login', null);
  if(saved && saved.k && initFB()){
    msg('지난번 아이디로 들어가는 중…');
    uref(saved.k).once('value').then(sn=>{
      const u = sn.val();
      if(u && u.pin===saved.h && (saved.k!==ADMIN_KEY || isAdminLogin(saved.k, u.pin))) enter(saved.k, u);
      else { LS.del('login'); msg(''); }
    }).catch(()=>{ msg(''); });
  }
};

/* Only known catalog parts reach the shared renderer from class presence.
   The fallback stays fixed so a malformed remote profile never changes style
   between heartbeats or sends an unchecked palette index to the face painter. */
function campusAvatar(value){
  const source=value&&typeof value==='object'&&!Array.isArray(value)?value:{};
  const sex=source.sex==='m'?'m':'f';
  const av={sk:0,ec:0,sex,eyes:'round',hair:sex==='m'?'short:1':'bob:1',top:'tee:3',bottom:'shorts:5',shoes:'sneaker:8',
    hat:'',glass:'',ear:'',neck:'',back:'',pet:'',bg:'',face:'',frame:'',effect:'',expression:'bright:0'};
  for(const [field,palette] of [['sk',PAL.skin],['ec',PAL.eye]]){
    if(Number.isFinite(Number(source[field])))av[field]=Math.round(clamp(Number(source[field]),0,palette.length-1));
  }
  if(typeof source.eyes==='string'&&Object.prototype.hasOwnProperty.call(EYES,source.eyes))av.eyes=source.eyes;
  for(const cat of CATS){
    const val=source[cat.k];
    if(val===''&&cat.off){av[cat.k]='';continue;}
    if(typeof val==='string'&&ITEMS[cat.k+':'+val]&&itemForSex(ITEMS[cat.k+':'+val],sex))av[cat.k]=val;
  }
  av.bg='';av.frame='';
  return avatarForSex(av,sex);
}
function campusCheckpoint(uid,space='campus'){
  let saved=campusCheckpoints.get(space+':'+uid);
  if(!saved)try{saved=JSON.parse(sessionStorage.getItem('qp_'+space+'_'+DBR+'_'+uid)||'null');}catch{}
  // Leaving the scene releases a shared chair. Return to its safe walking
  // position; taking the chair again must go through the current lease.
  const revision=window.QPForestVillageScene?.get(space)?.checkpointRevision;
  if(revision&&saved?.revision!==revision)return null;
  return saved&&Number.isFinite(saved.x)&&Number.isFinite(saved.y)?{x:saved.x,y:saved.y,height:Number(saved.height)||0}:null;
}
function rememberCampus(uid,state,space='campus'){
  if(!state||!Number.isFinite(state.x)||!Number.isFinite(state.y))return;
  const checkpoint={x:state.x,y:state.y,height:Number(state.height)||0};
  const revision=window.QPForestVillageScene?.get(space)?.checkpointRevision;if(revision)checkpoint.revision=revision;
  campusCheckpoints.set(space+':'+uid,checkpoint);
  try{sessionStorage.setItem('qp_'+space+'_'+DBR+'_'+uid,JSON.stringify(checkpoint));}catch{}
}
function mountSchoolSpace(st,space,arrival){
  if(!ME){go('login');return;}
  const getScene=zone=>zone==='campus'?window.QPSchoolRoomScene.get():zone==='playground'?window.QPPlaygroundScene?.get():window.QPForestVillageScene?.get(zone);
  const scene=getScene(space);
  if(!scene||(space==='playground'&&!scene.publicEntryReady)){toast('운동장을 준비하고 있어요.');go('campus');return;}
  const uid=ME.k,requested=arrival&&Number.isFinite(arrival.x)&&Number.isFinite(arrival.y)?{x:arrival.x,y:arrival.y,height:Number(arrival.height)||0}:campusCheckpoint(uid,space);
  const checkpoint=requested&&window.QPSchoolRoomWorld.createNavigation(scene,{height:requested?.height}).canStand(requested.x,requested.y)?requested:null;
  const initial=checkpoint||scene.spawn;
  st.innerHTML=topbar(scene.title,false,true)+'<div class="school-room-host" id="campusRoot"></div>';
  wireTop();
  let world=null,roster=[],status={mode:'connecting',message:'우리 반 친구들을 만나고 있어요.'},stopped=false;
  // The classroom blackboard is the door to the QUIZQUIZ lobby; 뒤로 returns to this classroom spot.
  function openBoard(){
    if(stopped)return;
    go('quizquiz',{back:space});
  }
  function teleport(item){
    if(stopped||!scene.interactables.includes(item))return;
    const next=item.target,nextScene=getScene(next);
    if(!nextScene||(next==='playground'&&!nextScene.publicEntryReady)){toast('운동장을 준비하고 있어요.');return;}
    const door=nextScene.interactables?.find(value=>item.targetDoor?value.id===item.targetDoor:value.target===space),point=door?.arrival||door?.approach;
    // A door on a raised deck/lookout arrives on that same level.
    if(!point||!window.QPSchoolRoomWorld.createNavigation(nextScene,{height:point.height}).canStand(point.x,point.y)){toast('출입구 위치를 확인하고 있어요.');return;}
    go(next,{x:point.x,y:point.y,height:Number(point.height)||0});
  }
  const presence=window.QPVillagePresence.connect({db:FB.db,base:DBR,classId:window.CLASS_NAME||'3-3',space,
    uid,name:ME.name,avatar:campusAvatar(ME.av),bounds:{width:scene.width,height:scene.height},
    initialState:{x:initial.x,y:initial.y,height:initial.height||0,zone:space},
    onPlayers:players=>{roster=players;if(world)world.setPlayers(players);},
    onStatus:value=>{status=value;if(world)world.setStatus(value);},onSeatLost:()=>world?.stand()});
  if(space==='campus')activeCampusPresence=presence;else if(space==='playground')activePlaygroundPresence=presence;else activeVillagePresence=presence;
  world=window.QPSchoolRoomWorld.mount(el('campusRoot'),{scene,user:{uid,name:ME.name,avatar:campusAvatar(ME.av)},
    renderAvatar:(av,height,lod)=>avatarSVG(campusAvatar(av),height||72,lod==null?3:lod),validateAvatar:campusAvatar,
    presence,checkpoint,zone:space,onCheckpoint:state=>rememberCampus(uid,world?.getCheckpoint?.()||state,space),onBoard:space==='campus'?openBoard:null,onPortal:teleport,
    onExit:()=>go(space==='campus'||space==='village'?'home':space==='playground'?'campus':'village'),exitLabel:space==='playground'?'교실로 돌아가기':space==='campus'||space==='village'?'학생 메뉴':'마을로 돌아가기',isPaused:()=>el('modal').classList.contains('on')});
  if(space==='campus')activeCampus=world;else if(space==='playground')activePlayground=world;else activeVillage=world;
  world.setPlayers(roster);world.setStatus(status);world.focus();
  leaveFn=()=>{
    stopped=true;rememberCampus(uid,world.getCheckpoint?.()||world.getState(),space);
    world.destroy();void presence.disconnect();
    if(activeCampus===world)activeCampus=null;
    if(activeCampusPresence===presence)activeCampusPresence=null;
    if(activePlayground===world)activePlayground=null;
    if(activePlaygroundPresence===presence)activePlaygroundPresence=null;
    if(activeVillage===world)activeVillage=null;
    if(activeVillagePresence===presence)activeVillagePresence=null;
  };
}

function showRank(){
  if(!FB.ok){ toast('연결이 안 돼 있어요'); return; }
  modal('우리 반 순위', '<div class="center" style="height:120px">불러오는 중…</div>');
  FB.db.ref(DBR+'/users').once('value').then(sn=>{
    const arr = [];
    sn.forEach(c=>{ const v=c.val(); if(c.key==='__teacher'||c.key===ADMIN_KEY) return;
      arr.push({k:c.key, name:v.name||c.key, gold:v.gold||0, crown:v.crown||0,
        correct:(v.stat&&v.stat.correct)||0, av:v.av}); });
    const draw = (key, unit)=>{
      const s = arr.slice().sort((a,b)=> (b[key]-a[key]) || a.name.localeCompare(b.name));
      return s.slice(0,30).map((u,i)=>`<div class="rank ${i<3?'t'+(i+1):''} ${u.k===ME.k?'me':''}">
        <div class="no">${i+1}</div>
        <div style="width:30px;flex:none">${avatarSVG(Object.assign(newAvatar(),u.av||{}), 40, 1)}</div>
        <div class="rn">${esc(u.name)}${crownStr(u.crown)}</div><div class="rs">${u[key].toLocaleString()}${unit}</div></div>`).join('')
        || '<div class="hint">아직 아무도 없어요.</div>';
    };
    el('mBody').innerHTML = `<div class="row gap" style="margin-bottom:10px">
        <button class="btn sm y f1" id="rkA">맞힌 문제</button>
        <button class="btn sm gray f1" id="rkB">모은 골드</button></div>
      <div id="rkList" style="max-height:52vh;overflow:auto">${draw('correct','개')}</div>`;
    const A = el('rkA'), B = el('rkB');
    A.onclick = ()=>{ A.className='btn sm y f1'; B.className='btn sm gray f1'; el('rkList').innerHTML = draw('correct','개'); };
    B.onclick = ()=>{ B.className='btn sm y f1'; A.className='btn sm gray f1'; el('rkList').innerHTML = draw('gold','골드'); };
  }).catch(e=> el('mBody').innerHTML = '<div class="hint">불러오지 못했어요: '+esc(e.message)+'</div>');
}

SCREENS.shop = function(st,arg){
  const S = { cat:arg?.fitting?'top':'hair', sel:null, pv:avatarForSex(ME.av,null,ME.owned) };
  const groups=[{name:'머리 · 얼굴',icon:'hair',cats:['hair','expression']},{name:'한벌옷',icon:'outfit',cats:['outfit']},{name:'상의',icon:'top',cats:['top']},{name:'하의',icon:'bottom',cats:['bottom']},{name:'신발',icon:'shoes',cats:['shoes']},{name:'장신구',icon:'glass',cats:['hat','glass','face','ear','neck','frame']},{name:'날개 · 펫 · 효과',icon:'pet',cats:['back','pet','effect','bg']}];

  st.innerHTML = `<section class="starlight-shop forest-shop" aria-label="숲속 옷 가게">
    <header class="starlight-header"><button class="btn" id="tbBack">← 뒤로</button><h1 class="forest-shop-title">${QPCandy.html('숲속 옷 가게',{arc:.22})}</h1><div class="f1"></div><button class="icb" id="tbSnd" aria-label="소리 설정">${uiIcon('sound')}</button><div class="gold">${uiIcon('coin')}<span class="sr-only">보유 골드</span><b id="goldNum">${(ME.gold||0).toLocaleString()}</b></div><button class="btn starlight-close" id="shopClose" aria-label="상점 닫고 마을로">×</button></header>
  <div class="shopwrap qp-village-shop qp-starlight-shop">
    <div class="pnl col shop-fitting">
      <div class="pnl-h" id="pvTitle">입어 보기</div>
      <div class="mestage f1" id="pvStage"></div>
      <div class="shop-fitting-controls">
        <div class="row gap4">
          <button class="btn sm gray f1" id="btnRand">아무거나</button>
          <button class="btn sm gray f1" id="btnReset">되돌리기</button>
        </div>
        <div class="row gap4 mt8">
          <button class="btn sm p f1" id="btnGender">남자 / 여자</button>
          <button class="btn sm p f1" id="btnFace">피부색</button>
        </div>
      </div>
    </div>

    <div class="pnl col shop-shelves" style="overflow:hidden">
      <div class="qp-shop-switch"><button class="tab on" id="shopAll" aria-pressed="true">아이템 상점</button><button class="tab" id="shopOwned" aria-pressed="false">내 옷장</button></div>
      <div id="shGroups" aria-label="상품 분류"></div>
      <div class="tabs" id="shTabs" aria-label="꾸미기 부위"></div>
      <div class="shop-catalog-note hint" id="shopCatalogNote"></div>
      <div class="shop-stock f1 scroll"><div id="shopFeatured"></div><div class="grid" id="shGrid"></div></div>
    </div>

    <div class="pnl col shop-selection">
      <div class="pnl-h forest-shop-subtitle">${QPCandy.html('나의 스타일',{arc:.16})}</div>
      <div id="shInfo" class="f1 scroll"></div>
    </div>
  </div></section>`;
  wireTop('village');el('shopClose').onclick=()=>go('village');

  const paintPv = ()=>{
    S.pv=avatarForSex(S.pv,ME.av.sex,ME.owned);
    const preview=Object.assign({},S.pv,{bg:S.cat==='bg'?S.pv.bg:'',frame:S.cat==='frame'?S.pv.frame:''});
    el('pvStage').innerHTML = avatarSVG(preview, 280, 3);
    el('pvStage').classList.toggle('shop-preview-background',S.cat==='bg');
    el('pvTitle').textContent = '입어 보기';
    el('pvTitle').setAttribute('aria-label','입어 보기 · '+avatarSexName(S.pv.sex));
    el('shopAll').textContent = '아이템 상점';
    el('shopOwned').textContent = '내 옷장';
    el('btnGender').textContent = avatarSexName(S.pv.sex)+' 아바타';
    el('btnGender').setAttribute('aria-label','남자 또는 여자 아바타 고르기. 현재 '+(S.pv.sex==='m'?'남자':'여자'));
  };
  S.onlyOwned=false;
  function switchWardrobe(owned){
    S.onlyOwned=owned;S.sel=null;
    el('shopAll').classList.toggle('on',!owned);el('shopOwned').classList.toggle('on',owned);
    el('shopAll').setAttribute('aria-pressed',String(!owned));el('shopOwned').setAttribute('aria-pressed',String(owned));
    paintGrid();paintInfo();
  }
  el('shopAll').onclick=()=>switchWardrobe(false);
  el('shopOwned').onclick=()=>switchWardrobe(true);

  function paintTabs(){
    const group=groups.find(g=>g.cats.includes(S.cat));
    el('shGroups').innerHTML=groups.map(g=>`<button class="tab ${g===group?'on':''}" data-group="${g.cats[0]}" aria-pressed="${g===group}">${uiIcon(g.icon)}<span>${g.name}</span></button>`).join('');
    el('shGroups').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.cat=b.dataset.group;S.sel=null;paintPv();paintTabs();paintGrid();paintInfo();});
    el('shTabs').innerHTML = CATS.filter(c=>group.cats.includes(c.k)).map(c=>
      `<button class="tab ${c.k===S.cat?'on':''}" data-c="${c.k}" aria-pressed="${c.k===S.cat}">${uiIcon(c.k)}<span>${c.n}</span></button>`).join('');
    $$('#shTabs .tab').forEach(b=> b.onclick = ()=>{ S.cat=b.dataset.c; S.sel=null;
      paintPv(); paintTabs(); paintGrid(); paintInfo(); });
  }
  function paintGrid(){
    const c = CAT[S.cat]; let h = '';
    const picks=publicItems(S.cat,S.pv.sex).filter(it=>!S.onlyOwned||owns(it.id)),featured=picks[0];
    el('shopFeatured').innerHTML=featured?`<div class="shop-featured"><div class="shop-feature-art">${partThumb(S.cat,featured.shape,featured.ci,110,S.pv.sex)}</div><div class="shop-feature-copy"><span class="shop-feature-kicker">오늘의 스타일</span><h2>${esc(featured.short)}</h2><p>반짝이는 나만의 모습을 찾아봐요!</p><button class="btn" id="shopFeatureTry">입어 보기 <span aria-hidden="true">→</span></button></div><div class="shop-feature-picks">${picks.slice(1,4).map(it=>`<button data-pick="${it.id}" aria-label="${esc(it.short)} 입어 보기">${partThumb(S.cat,it.shape,it.ci,65,S.pv.sex)}</button>`).join('')}</div><span class="shop-feature-star" aria-hidden="true">✦</span></div>`:'';
    if(featured)el('shopFeatureTry').onclick=()=>{S.sel=featured.id;S.pv=applyCatalogItem(S.pv,featured);paintPv();paintGrid();paintInfo();};
    el('shopFeatured').querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{const it=picks.find(p=>p.id===b.dataset.pick);S.sel=it.id;S.pv=applyCatalogItem(S.pv,it);paintPv();paintGrid();paintInfo();});
    if(c.off) h += `<button class="itm" data-none="1" aria-pressed="${S.sel==='__none'}" style="grid-column:span 1">
      <div class="thumb shop-none" aria-hidden="true">✕</div>
      <div class="nm2">안 쓰기</div><div class="pr free">공짜</div></button>`;
    el('shopCatalogNote').textContent=S.cat==='outfit'?'상의와 하의를 함께 입는 한벌옷이에요.':avatarSexName(S.pv.sex)+' 아바타에게 맞는 '+(S.onlyOwned?'보유 아이템을':'아이템을')+' 골라요.';
    for(const it of publicItems(S.cat,S.pv.sex)){
      const {id,shape:sk,ci}=it,own=owns(id),eq=ME.av[S.cat]===sk+':'+ci;
      if(S.onlyOwned&&!own)continue;
      const rare=it.price>=600?' r3':it.price>=300?' r2':'';
      h+=`<button class="itm${rare} ${own?'own':''} ${S.sel===id?'on':''}" data-id="${id}" aria-pressed="${S.sel===id}">
        ${eq?'<span class="badge eq">입음</span>':(own?'<span class="badge">보유</span>':'')}
        <div class="thumb">${partThumb(S.cat,sk,ci,100,S.pv.sex)}</div>
        <div class="nm2">${esc(it.short)}</div>
        <div class="pr ${own?'free':''}">${own?'가지고 있음':it.price.toLocaleString()+' 골드'}</div><span class="shop-card-action">${eq?'착용 중':'입어 보기'}</span></button>`;
    }
    el('shGrid').innerHTML = h||'<div class="hint" style="grid-column:1/-1;padding:20px">이 부위에 가진 아이템이 없어요. 상점에서 마음에 드는 아이템을 골라 보세요.</div>';
    $$('#shGrid .itm').forEach(b=> b.onclick = ()=>{
      if(b.dataset.none){
        S.sel='__none';
        if(S.cat==='outfit'&&S.pv.outfit)S.pv=applyCatalogItem(S.pv,curatedItem('top','tee',S.pv.sex));
        else S.pv[S.cat]='';
      }else{
        S.sel=b.dataset.id;const chosen=ITEMS[S.sel];
        S.pv=applyCatalogItem(S.pv,curatedItem(chosen.cat,chosen.shape,S.pv.sex));
      }
      paintPv(); paintGrid(); paintInfo();
    });
  }
  function paintInfo(){
    const box = el('shInfo');
    const worn=()=>`<div class="shop-worn-list"><div class="shop-info-subtitle">지금 입고 있는 것</div>${CATS.filter(c=>ME.av[c.k]&&(!ME.av.outfit||!['top','bottom'].includes(c.k))).map(c=>{const it=curatedItem(c.k,ME.av[c.k].split(':')[0],ME.av.sex);return it?`<div class="shop-worn-row"><span class="shop-worn-thumb" aria-hidden="true">${partThumb(c.k,it.shape,it.ci,64,ME.av.sex)}</span><span><small>${c.n}</small><b>${esc(it.name)}</b></span><span class="shop-worn-check" aria-label="착용 중">✓</span></div>`:'';}).join('')}</div>`;
    if(!S.sel){ box.innerHTML = worn()+`<p class="hint shop-fitting-note">옷을 누르면 바로 입어 볼 수 있어요.<br>마음에 들면 구매하거나 갈아입어요.</p>`;
      return;
    }
    if(S.sel==='__none'){
      box.innerHTML = `<div class="shop-info-title">안 쓰기</div>
        <div class="hint mt8">${CAT[S.cat].n}를 빼고 다닐 수 있어요.</div>
        <button class="btn g mt12" style="width:100%" id="btnWear">벗기</button>`;
      el('btnWear').onclick = ()=>{if(!canChangeAvatar())return;const av=S.cat==='outfit'?(ME.av.outfit?applyCatalogItem(ME.av,curatedItem('top','tee',ME.av.sex)):Object.assign({},ME.av)):Object.assign({},ME.av,{[S.cat]:''});
        save({av}); ME.av=av; S.pv=Object.assign({},av); paintPv(); paintGrid(); paintInfo(); toast('벗었어요'); };
      return;
    }
    const selected=ITEMS[S.sel],it=curatedItem(selected.cat,selected.shape,S.pv.sex),own=owns(it.id),eq=ME.av[it.cat]===it.shape+':'+it.ci;
    const rare = it.price>=600?'<span class="tag" style="background:#ffe6c8;color:#a35f00">희귀</span>'
               : it.price>=300?'<span class="tag" style="background:#eee2ff;color:#5b3ba8">고급</span>':'';
    box.innerHTML = `
      <div class="center shop-detail-picture">
        ${partThumb(it.cat, it.shape, it.ci, 138, S.pv.sex)}</div>
      <div class="shop-info-title">${esc(it.name)} ${rare}</div>
      <div class="hint mt8 shop-detail-price">${CAT[it.cat].n} · ${own?'<b style="color:#3d8f2e">이미 가지고 있어요</b>'
        :'<b style="color:#b57700">'+it.price.toLocaleString()+'골드</b>'}</div>
      <div class="mt12">${
        eq ? `<button class="btn gray" style="width:100%" disabled>지금 입고 있어요</button>`
        : own ? `<button class="btn g" style="width:100%" id="btnWear">이걸로 입기</button>`
        : `<button class="btn y" style="width:100%" id="btnBuy" ${(ME.gold||0)<it.price?'disabled':''}>
             ${(ME.gold||0)<it.price?'골드가 모자라요':'사기 · '+it.price.toLocaleString()+'골드'}</button>`}</div>
      ${(!own && (ME.gold||0)<it.price)? `<div class="hint mt8" style="color:#c0392b">
        ${(it.price-(ME.gold||0)).toLocaleString()}골드가 더 있어야 해요. 퀴즈를 더 풀어 보세요!</div>`:''}${worn()}`;
    const wear = ()=>{if(!canChangeAvatar())return false;const av=applyCatalogItem(ME.av,it);
      ME.av=av; save({av}); S.pv=Object.assign({},av); paintPv(); paintGrid(); paintInfo();return true; };
    const bw = el('btnWear'); if(bw) bw.onclick = ()=>{ if(wear())toast('입었어요!'); };
    const bb = el('btnBuy');  if(bb) bb.onclick = async()=>{
      if(!canChangeAvatar())return;
      if((ME.gold||0) < it.price){ toast('골드가 모자라요'); return; }
      const buyerKey=ME.k;
      bb.disabled=true;
      try{
        await save({},true);
        const result=await uref(buyerKey).transaction(user=>{
          if(!user||!itemForSex(it,user.av?.sex))return;
          user.owned=user.owned||{};
          if(!hasStyle(it.id,user.owned)){
            if((Number(user.gold)||0)<it.price)return;
            user.gold=(Number(user.gold)||0)-it.price;
            user.owned[it.id]=1;
          }
          user.av=applyCatalogItem(user.av||newAvatar(),it);
          return user;
        },undefined,false);
        if(!result.committed){toast('골드가 모자라요');return;}
        if(!ME || ME.k!==buyerKey) return;
        const user=result.snapshot.val();ME.gold=user.gold;ME.owned=user.owned;
        ME.av=avatarForSex(Object.assign(newAvatar(),user.av),null,user.owned);S.pv=Object.assign({},ME.av);
        paintGold();paintPv();paintGrid();paintInfo();SND.buy();toast('샀어요! '+it.name,2200);
      }catch(e){toast('구매를 저장하지 못했어요. 다시 눌러 주세요.',2600);}
      finally{if(bb.isConnected)bb.disabled=false;}
    };
  }

  el('btnRand').onclick = ()=>{
    if(!canChangeAvatar())return;
    // Styles may change, but every displayed style uses its designed colour.
    let av=Object.assign({},ME.av,{outfit:''});
    for(const c of CATS.filter(c=>c.k!=='outfit')){
      const mine=publicItems(c.k,av.sex).filter(it=>owns(it.id));
      if(!mine.length)continue;
      if(c.off&&Math.random()<.3){av[c.k]='';continue;}
      av=applyCatalogItem(av,mine[(Math.random()*mine.length)|0]);
    }
    const suits=publicItems('outfit',av.sex).filter(it=>owns(it.id));
    if(suits.length&&Math.random()<.3)av=applyCatalogItem(av,suits[(Math.random()*suits.length)|0]);
    ME.av = av; save({av}); S.pv = Object.assign({},av); paintPv(); paintGrid(); paintInfo();
  };
  el('btnReset').onclick = ()=>{ S.pv = Object.assign({}, ME.av); S.sel=null; paintPv(); paintGrid(); paintInfo(); };
  el('btnGender').onclick = ()=>{
    if(!canChangeAvatar())return;
    const accountKey=ME.k, previewAv=Object.assign({},S.pv);
    modal('남자 / 여자 아바타 고르기', `
      <div class="row gap" id="avatarSexChoices" style="align-items:stretch">
        ${[['m','남자'],['f','여자']].map(([sex,name])=>`<div class="f1" style="min-width:0;text-align:center;background:#fffaf5;border:1px solid #e9dded;border-radius:14px;padding:12px 6px">
          <div data-avatar-sex="${sex}" style="display:flex;align-items:center;justify-content:center;min-height:210px">${avatarSVG(avatarForSex(previewAv,sex,ME.owned),210,3)}</div>
          <button class="btn sm ${ME.av.sex===sex?'p':'gray'}" data-sex="${sex}" aria-pressed="${ME.av.sex===sex}" style="width:100%;margin-top:8px">${name} 아바타</button>
        </div>`).join('')}
      </div>
      <div class="hint mt12">무료로 바꿀 수 있어요. 머리와 옷은 고른 아바타에 맞게 입어요. 피부색·골드·보유 아이템은 그대로예요.</div>
      <button class="btn gray mt12" style="width:100%" id="avatarSexClose">닫기</button>`, ()=>{
      $$('#avatarSexChoices [data-sex]').forEach(b=>b.onclick=()=>{
        if(!ME || ME.k!==accountKey || curScr!=='shop'||!canChangeAvatar())return;
        const av=avatarForSex(ME.av,b.dataset.sex,ME.owned);
        ME.av=av;save({av});S.pv=Object.assign({},av);S.sel=null;
        paintPv();paintGrid();paintInfo();closeModal();toast((av.sex==='m'?'남자':'여자')+' 아바타로 바꿨어요');
      });
      el('avatarSexClose').onclick=closeModal;
    });
  };
  el('btnFace').onclick=()=>{
    if(!canChangeAvatar())return;
    const accountKey=ME.k;let selected=ME.av.sk;
    modal('피부색 상점',`<div class="hint">처음 고른 피부색은 무료예요. 다른 피부색은 각각 ${SKIN_PRICE}골드에 한 번 사면 계속 사용할 수 있어요.</div>
      <div class="skin-options mt12" id="fSk"></div><div id="skinInfo" class="mt12"></div>`,()=>{
      const paint=()=>{
        el('fSk').innerHTML=PAL.skin.map(([colour,name],i)=>`<button class="skin-option" data-skin="${i}" aria-pressed="${i===selected}"><span class="skin-swatch" style="background:${colour}"></span><span>${name}</span><small>${ME.skinOwned?.[i]?'보유':SKIN_PRICE+'골드'}</small></button>`).join('');
        $$('#fSk [data-skin]').forEach(button=>button.onclick=()=>{selected=+button.dataset.skin;S.pv.sk=selected;paintPv();paint();});
        const own=!!ME.skinOwned?.[selected],same=ME.av.sk===selected,poor=!own&&(ME.gold||0)<SKIN_PRICE;
        el('skinInfo').innerHTML=`<button class="btn ${own?'g':'y'}" id="skinAction" style="width:100%" ${same||poor?'disabled':''}>${same?'지금 사용하고 있어요':own?'이 피부색 쓰기':poor?'골드가 모자라요':'사기 · '+SKIN_PRICE+'골드'}</button>`;
        el('skinAction').onclick=async()=>{
          const button=el('skinAction');button.disabled=true;
          try{
            const applied=await acquireSkin(accountKey,selected);
            if(!ME||ME.k!==accountKey)return;
            if(!applied){toast('골드가 모자라요');return;}
            if(curScr==='shop'&&el('pvStage')){
              S.pv=Object.assign({},ME.av);paintPv();
              if(el('modal').classList.contains('on')&&el('fSk')&&el('skinInfo'))paint();
            }
            toast(own?'피부색을 바꿨어요':'새 피부색을 샀어요!');
          }catch(error){toast('피부색을 저장하지 못했어요. 다시 눌러 주세요.');}
          finally{if(button.isConnected)button.disabled=false;}
        };
      };paint();
    });
  };

  paintTabs(); paintGrid(); paintInfo(); paintPv();
  if(arg?.owned)switchWardrobe(true);
};

/* ═══════════════════════════════════════════════════════════════════
   9) 문제 은행
   문제 한 개 = {q:문제, a:답, c:[오답 보기들]}
   c 가 없으면 답을 직접 쓰는 주관식. a 가 O/X 면 OX 문제.
   ═══════════════════════════════════════════════════════════════════ */
let BANK = {};                       // setId -> {title, qs:[...]}
function loadBank(){
  return new Promise((res,rej)=>{
    if(!FB.ok) return rej(new Error('연결 안 됨'));
    bref().once('value').then(sn=>{ BANK = sn.val()||{}; res(BANK); }).catch(rej);
  });
}
function setList(){
  return Object.keys(BANK).map(id=>({id, title:BANK[id].title||'이름 없음',
    n:(BANK[id].qs||[]).length, made:BANK[id].made||0}))
    .sort((a,b)=> b.made - a.made);
}
const isOX = it => /^(o|x|O|X|ㅇ|ㅁ|맞|틀)/.test(String(it.a).trim()) && String(it.a).trim().length<=2;

/* ═══════════════════════════════════════════════════════════════════
   10) 운영자 화면 — 위쪽 띠의 '운영자' 탭으로만 연다
   ═══════════════════════════════════════════════════════════════════ */
let adminBack = 'village';
SCREENS.teacher = function(st){
  if(!ME||!IS_TEACHER){go(ME?'village':'login');return;}
  let tab = 'quizzes', viewCleanup = null, stopped = false;
  const cleanupView = ()=>{ if(viewCleanup){ viewCleanup(); viewCleanup=null; } };
  leaveFn = ()=>{ stopped=true; cleanupView(); };
  st.innerHTML = `<div class="top teacher-top">
      <button class="btn sm gray" id="tBack">${uiIcon('arrow')} 돌아가기</button>
      <div class="nm">운영자 화면 — ${esc(window.CLASS_NAME||'우리 반')}</div>
      <div class="f1"></div>
      <div class="tabs" style="padding:0">
        <button class="tab on" data-t="quizzes" aria-current="page">내 퀴즈</button>
        <button class="tab" data-t="kids">학생 관리</button>
      </div>
      <button class="btn sm g" data-t="make">새 퀴즈 만들기</button>
      <button class="btn sm y" id="tQuizQuiz">QUIZQUIZ 방</button>
    </div><div id="tBody" class="tsplit"></div>`;
  el('tBack').onclick = ()=> go(adminBack||'village');
  el('tQuizQuiz').onclick = ()=> go('quizquiz');
  const setTeacherTab = value=>{
    tab=value;
    $$('.teacher-top [data-t]').forEach(b=>{
      const selected=b.dataset.t===value;
      b.classList.toggle('on',selected);
      b.setAttribute('aria-current',selected?'page':'false');
    });
  };
  $$('.teacher-top [data-t]').forEach(b=> b.onclick = ()=>{
    setTeacherTab(b.dataset.t); paint();
  });

  function paint(){
    cleanupView();
    el('tBody').classList.toggle('admin-body',tab!=='kids');
    if(tab==='quizzes') paintLibrary();
    else if(tab==='make') editSet(null);
    else paintKids();
  }

  function paintLibrary(){
    const body=el('tBody');
    body.innerHTML=`<section class="teacher-library">
      <header class="admin-heading"><div><h2>내 퀴즈</h2><p>문제를 보관하고 수정하는 곳이에요. 저장한 퀴즈는 QUIZQUIZ 방 만들기에서 골라 쓸 수 있어요.</p></div></header>
      <div class="teacher-library-toolbar"><label>퀴즈 찾기 <input class="inp" id="teacherQuizSearch" type="search" placeholder="퀴즈 제목" autocomplete="off"></label><span id="teacherQuizCount"></span></div>
      <div id="teacherQuizList" class="teacher-quiz-list"></div>
    </section>`;
    function draw(){
      const needle=el('teacherQuizSearch').value.trim().toLocaleLowerCase();
      const sets=Object.entries(BANK).sort((a,b)=>(b[1].updated||b[1].made||0)-(a[1].updated||a[1].made||0))
        .filter(([,s])=>String(s.title||'').toLocaleLowerCase().includes(needle));
      el('teacherQuizCount').textContent=sets.length+'개 퀴즈';
      el('teacherQuizList').innerHTML=sets.map(([id,s])=>`<article class="teacher-quiz-card" data-quiz="${esc(id)}">

        <div class="teacher-quiz-actions"><button class="btn sm gray" data-edit>문제 수정</button></div>

        row.querySelector('[data-edit]').onclick=()=>editSet(row.dataset.quiz);

  async function saveSet(set){
    const id=set.id||('s'+now().toString(36)+Math.random().toString(36).slice(2,7));

    return Object.assign({id},value);
  }
  function backToLibrary(){ if(stopped)return; setTeacherTab('quizzes'); paint(); }
  function editSet(id){
    cleanupView();
    el('tBody').classList.add('admin-body');
    el('tBody').replaceChildren();
    const set=id&&BANK[id]?Object.assign({id},BANK[id]):{id:'s'+now().toString(36)+Math.random().toString(36).slice(2,7),title:'새 퀴즈',qs:[],made:now()};
    viewCleanup=window.QPTeacherBuilder.mount(el('tBody'),{set,
      onBack:backToLibrary,onSave:saveSet,onNext:async draft=>{await saveSet(draft);backToLibrary();}}).destroy;

  /* ── 학생 명단 ───────────────────────────────────────────── */
  const isStudentKey = k=> k!=='__teacher' && k!==ADMIN_KEY;
  function paintKids(){
    el('tBody').innerHTML = `
      <div class="pnl col" style="grid-column:span 2;overflow:hidden">
        <div class="pnl-h">학생 명단 <div class="f1"></div>
          <button class="btn sm gray" id="kRe">새로 읽기</button>
          <button class="btn sm y" id="kGiveAll">모두에게 골드 주기</button></div>
        <div class="f1 scroll" style="padding:10px" id="kBox">불러오는 중…</div></div>`;
    el('kRe').onclick = drawKids;
    el('kGiveAll').onclick = ()=>{
      const n = parseInt(prompt('모두에게 줄 골드 (예: 100)'),10);
      if(!n || n<=0) return;
      FB.db.ref(DBR+'/users').once('value').then(sn=>{
        const ups = {};
        sn.forEach(c=>{ if(!isStudentKey(c.key)) return; ups[c.key+'/gold'] = (c.val().gold||0)+n; });
        FB.db.ref(DBR+'/users').update(ups).then(()=>{ toast('모두에게 '+n+'골드 줬어요'); drawKids(); });
      });

  function drawKids(){
    const box = el('kBox'); if(!box) return; box.innerHTML='불러오는 중…';
    FB.db.ref(DBR+'/users').once('value').then(sn=>{

      const arr=[]; sn.forEach(c=>{ if(isStudentKey(c.key)) arr.push(Object.assign({k:c.key}, c.val())); });
      arr.sort((a,b)=> String(a.name||'').localeCompare(String(b.name||'')));
      box.innerHTML = `<div class="hint" style="margin-bottom:8px">모두 <b>${arr.length}명</b>.
        아이디와 비밀번호를 볼 수 있어요. 비밀번호가 <b>?</b>이면 그 학생이 한 번 더 로그인하면 보여요. <b>비번 초기화</b>를 누르면 <b>0000</b>이 됩니다.</div>`
      + (arr.map(u=>`<div class="setrow">
          <div style="width:26px">${avatarSVG(Object.assign(newAvatar(),u.av||{}),36,1)}</div>
          <div class="sn">${esc(u.name||u.k)}${crownStr(u.crown)} <span class="kid-cred">아이디 <b>${esc(u.name||u.k)}</b> · 비밀번호 <b>${esc(u.pinView||'?')}</b></span>
            <div class="sc">골드 ${(u.gold||0).toLocaleString()} · 맞힘 ${(u.stat&&u.stat.correct)||0} / 푼 것 ${(u.stat&&u.stat.solved)||0}</div></div>
          <button class="btn sm gray" data-pin="${esc(u.k)}">비번 초기화</button>
          <button class="btn sm y" data-gold="${esc(u.k)}">골드 주기</button>
          <button class="btn sm p" data-del="${esc(u.k)}">삭제</button></div>`).join('')
        || '<div class="hint">아직 들어온 학생이 없어요.</div>');
      $$('#kBox [data-pin]').forEach(b=> b.onclick=()=>{ const k=b.dataset.pin;
        if(!confirm(k+' 의 비밀번호를 0000 으로 바꿀까요?')) return;
        uref(k).update({pin:pinHash(k,'0000'),pinView:'0000'}).then(()=>{toast('0000 으로 바꿨어요',2400);drawKids();}); });
      $$('#kBox [data-gold]').forEach(b=> b.onclick=()=>{ const k=b.dataset.gold;
        const n=parseInt(prompt(k+' 에게 줄 골드'),10); if(!n) return;
        uref(k).once('value').then(s2=> uref(k).update({gold:Math.max(0,(s2.val().gold||0)+n)}).then(()=>{ toast('줬어요'); drawKids(); })); });
      $$('#kBox [data-del]').forEach(b=> b.onclick=()=>{ const k=b.dataset.del;
        if(!confirm(k+' 계정을 지울까요? 골드와 옷이 전부 사라집니다.')) return;
        uref(k).remove().then(()=>{ toast('지웠어요'); drawKids(); }); });
    }).catch(e=> box.innerHTML='<div class="hint">불러오지 못했어요: '+esc(e.message)+'</div>');
  }

  loadBank().then(()=>{ if(!stopped)paint(); }).catch(e=>{
    if(stopped)return;
    el('tBody').innerHTML = '<div class="pnl" style="padding:20px">연결 실패: '+esc(e.message)+'</div>'; });
};

/* ═══════════════════════════════════════════════════════════════════
   13) QUIZQUIZ 공용 — 서버 시계와 문제 고르기
   ═══════════════════════════════════════════════════════════════════ */
let SVOFF = 0, clockOn = false;
function ensureClock(){
  if(clockOn || !FB.ok) return;
  clockOn = true;
  FB.db.ref('.info/serverTimeOffset').on('value', s=>{ SVOFF = s.val()||0; });
}
const svNow = ()=> Date.now() + SVOFF;

/* 같은 씨앗(seed)이면 언제 다시 돌려도 같은 순서가 나온다.
   방장 화면을 새로고침해도 문제 순서가 안 흐트러진다. */
function seedRnd(seed){ let s = seed>>>0 || 1;
  return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
function pickQs(setId, seed, count, onlyOX){
  let all = (BANK[setId] && BANK[setId].qs || []).filter(q=>q.type!=='match'&&q.type!=='order').slice();
  if(onlyOX) all = all.filter(isOX);
  const rnd = seedRnd(seed);
  for(let i=all.length-1;i>0;i--){ const j=(rnd()*(i+1))|0; const t=all[i]; all[i]=all[j]; all[j]=t; }
  return all.slice(0, Math.min(count||all.length, all.length));
}

const fref = () => FB.db.ref(DBR+'/fashion');

const crownStr = n => n>0 ? ' ' + '👑'.repeat(Math.min(n,3)) : '';

SCREENS.fashion = function(st){
  const F = { cur:null, ents:{}, votes:{}, res:null, subs:[], key:'', sndDone:null };

  wireTop();
  const wrap = el('fWrap');
  const sub = (r,cb)=>{ const h = r.on('value',cb); F.subs.push(()=> r.off('value',h)); };
  leaveFn = ()=> F.subs.forEach(f=>f());
  sub(fref().child('cur'),    x=>{ F.cur = x.val(); draw(); });
  sub(fref().child('entries'),x=>{ F.ents = x.val()||{}; draw(); });
  sub(fref().child('votes'),  x=>{ F.votes = x.val()||{}; draw(); });

  const arr = ()=> Object.keys(F.ents).map(k=> Object.assign({k}, F.ents[k]));
