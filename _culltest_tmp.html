<title>cull test</title>
<pre id="out">running…</pre>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
const L=[];
L.push('three r'+THREE.REVISION);
const renderer = new THREE.WebGLRenderer();
renderer.setSize(1366,768);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,1));
const cam = new THREE.PerspectiveCamera(74, 1366/768, 0.08, 420);
scene.add(cam);
const geo = new THREE.BoxGeometry(1,1,1);
const mat = new THREE.MeshLambertMaterial();
// 8개 섹터, 각 섹터는 r 40~59 고리의 45도 조각 (index.html 산 배치와 같은 모양)
const metrics=[];
for(let s=0;s<8;s++){
  const pts=[];
  for(let k=0;k<400;k++){
    const a=(s+Math.random())*(Math.PI*2/8), r=40+Math.random()*19;
    pts.push([Math.cos(a)*r, 9+Math.random()*15, Math.sin(a)*r]);
  }
  const im = new THREE.InstancedMesh(geo, mat, pts.length);
  const m = new THREE.Matrix4();
  pts.forEach((p,i)=> im.setMatrixAt(i, m.makeTranslation(p[0],p[1],p[2])));
  im.instanceMatrix.needsUpdate = true;
  im.frustumCulled = true;
  im.computeBoundingSphere();
  im.userData.s = s;
  scene.add(im);
  metrics.push(im.boundingSphere.radius.toFixed(1));
}
L.push('섹터 bounding sphere 반지름: '+metrics.join(', '));
L.push('InstancedMesh.boundingSphere 지원? '+(scene.children[1].boundingSphere!==undefined));

// 카메라를 마을 안(중심에서 20)에 두고 바깥을 본다
function shot(px,pz,lookX,lookZ,label){
  cam.position.set(px, 11, pz);
  cam.lookAt(lookX, 11, lookZ);
  cam.updateMatrixWorld(true);
  renderer.render(scene, cam);
  const info = renderer.info.render;
  L.push(label+' → 드로우콜 '+info.calls+'/8,  삼각형 '+info.triangles+'/'+(8*400*12));
  return info.calls;
}
let tot=0, n=0;
tot+=shot(0,0, 0,-60,'중앙에서 북쪽');           n++;
tot+=shot(20,0, 60,0,'r=20 에서 바깥(동)');      n++;
tot+=shot(20,0, -60,0,'r=20 에서 안쪽(서)');     n++;
tot+=shot(0,20, 0,-60,'r=20 에서 맞은편(북)');   n++;
tot+=shot(35,0, 60,10,'r=35 협곡 앞');           n++;
tot+=shot(-14,26, 20,-30,'대각선');              n++;
L.push('평균 통과 섹터 = '+(tot/n).toFixed(2)+'/8  → 살아남는 비율 '+((tot/n)/8*100).toFixed(0)+'%');
document.getElementById('out').textContent = L.join('\n');
</script>
